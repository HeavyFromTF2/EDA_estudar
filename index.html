  .nav-item { display: flex; align-items: center; gap: 8px;

    text-align: left; border-radius: 6px; transition: background 0.12s;
    color: var(--text); font-family: inherit; }
  .nav-item:hover { background: var(--nav-hover); }
  .nav-item.active { background: var(--nav-active-bg); color: var(--nav-active-text); }

  .nav-num { font-size: 10px; font-weight: 600; color: var(--text3); min-width: 18px;

  .nav-label { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.3; }
  .nav-aula { font-size: 10px; color: var(--text3); white-space: nowrap; }
  .nav-item.active .nav-aula { color: rgba(255,255,255,0.55); }

  /* Content */
  .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
  .section { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .demo-frame { width: 100%; flex: 1; border: none; display: block; background: transparent; }

  /* Mobile */
  .mobile-bar { display: none; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .mobile-menu-btn { background: none; border: 1px solid var(--border2); border-radius: 6px;
    padding: 6px 10px; font-size: 16px; cursor: pointer; color: var(--text);
    font-family: inherit; line-height: 1; }
  .mobile-title { font-size: 13px; font-weight: 600; color: var(--text); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (max-width: 640px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;

      width: 260px; box-shadow: 2px 0 20px rgba(0,0,0,0.18); }
    .sidebar.open { transform: translateX(0); }
    .overlay { display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.35); z-index: 99; }
    .overlay.show { display: block; }
    .mobile-bar { display: flex; }
    html, body { overflow: auto; }
    .layout { height: auto; overflow: visible; }
    .content { height: calc(100vh - 44px); }
    .demo-frame { min-height: calc(100vh - 44px); }

&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Insertion Sort — Demonstração Interativa&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Estruturas de Dados e Algoritmos · IPBeja · EDA Aula 3&lt;/p&gt;

  &lt;div class=&quot;info-row&quot;&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Melhor Caso&lt;/strong&gt;&lt;span&gt;Custo: O(n)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Caso Médio / Pior&lt;/strong&gt;&lt;span&gt;Custo: O(n²)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Espaço Auxiliar&lt;/strong&gt;&lt;span&gt;Custo: O(1) (In-place)&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-prev&quot; onclick=&quot;step(-1)&quot;&gt;← Anterior&lt;/button&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-next&quot; onclick=&quot;step(1)&quot;&gt;Próximo →&lt;/button&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;reset()&quot;&gt;↺ Recomeçar&lt;/button&gt;
    &lt;span id=&quot;phase-label&quot; class=&quot;phase-badge&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;desc-box&quot; id=&quot;desc-box&quot;&gt;&lt;/div&gt;

  &lt;svg id=&quot;visual-svg&quot; viewBox=&quot;0 0 680 160&quot;&gt;&lt;/svg&gt;

  &lt;div class=&quot;array-label&quot;&gt;Array A (índice em cima, valor em baixo):&lt;/div&gt;
  &lt;div id=&quot;array-row&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;step-counter&quot; id=&quot;step-counter&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;pseudocode-section&quot;&gt;
    &lt;div class=&quot;pseudocode-title&quot;&gt;Linha de Execução de Exame — INSERTION-SORT(A)&lt;/div&gt;
    &lt;div class=&quot;code-container&quot; id=&quot;code-container&quot;&gt;
      &lt;div class=&quot;code-line&quot; id=&quot;line-1&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;for j = 2 to A.length&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Começa no 2º elemento. O 1º já está &quot;ordenado&quot; sozinho.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot; id=&quot;line-2&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    key = A[j]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Memoriza a &quot;chave&quot; (o elemento que queres encaixar).&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot; id=&quot;line-3&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    // Inserir A[j] na sequência ordenada A[1..j-1]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Explicação teórica do objetivo da iteração.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot; id=&quot;line-4&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    i = j - 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Começa a olhar para o vizinho imediatamente à esquerda.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot; id=&quot;line-5&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    while i &gt; 0 and A[i] &gt; key&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Enquanto houver números à esquerda MAIORES que a chave...&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot; id=&quot;line-6&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;        A[i + 1] = A[i]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Arrasta o número maior uma casa para a direita para abrir espaço.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot; id=&quot;line-7&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;        i = i - 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Recua o ponteiro uma posição à esquerda para continuar a procurar.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot; id=&quot;line-8&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    A[i + 1] = key&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Encontrou o sítio certo! Larga lá a chave guardada na vaga livre.&lt;/span&gt;&lt;/div&gt;

      Elementos ainda não avaliados
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
// O mesmo array inicial que usaste no Heap Sort para facilitar a comparação mental de performance
const ORIG = [16, 4, 10, 14, 7, 9, 3, 2, 8, 1];

let steps = [];
let cur = 0;

function genSteps() {
  steps = [];
  // Mantemos indexação de base 1 para consistência com o teu projeto anterior
  let A = [null, ...ORIG];
  const n = A.length - 1;

  function snap(desc, phase, keyIdx, compIdx, sortedCount) {
    steps.push({
      A: A.slice(),
      desc,
      phase,
      keyIdx,
      compIdx,
      sortedCount
    });
  }

  snap(&quot;Array inicial. O sub-array ordenado começa apenas com o primeiro elemento (índice 1).&quot;, &quot;init&quot;, null, null, 1);

  for (let j = 2; j &lt;= n; j++) {
    let key = A[j];
    snap(`Definimos a chave &lt;b&gt;A[${j}] = ${key}&lt;/b&gt;. Vamos inseri-la na posição correta do sub-array ordenado à esquerda.`, &quot;scan&quot;, j, j - 1, j - 1);
    
    let i = j - 1;
    let moved = false;

    while (i &gt; 0 &amp;&amp; A[i] &gt; key) {
      snap(`Como &lt;b&gt;A[${i}] (${A[i]}) &gt; Chave (${key})&lt;/b&gt;, deslocamos o ${A[i]} para a direita (índice ${i+1}).`, &quot;shift&quot;, i + 1, i, j - 1);
      A[i + 1] = A[i];
      moved = true;
      i--;
    }

    if (i &gt; 0) {
      snap(`Comparação: Encontrado elemento menor ou igual à chave &lt;b&gt;A[${i}] (${A[i]}) &amp;le; Chave (${key})&lt;/b&gt;. A busca termina aqui.`, &quot;compare&quot;, i + 1, i, j - 1);
    } else {
      snap(`Atingimos o início do array (ponteiro i = 0). A chave atual é o menor elemento avaliado até agora.`, &quot;compare&quot;, 1, null, j - 1);
    }

    A[i + 1] = key;
    snap(`Inserimos a chave &lt;b&gt;${key}&lt;/b&gt; na sua vaga correta (posição A[${i + 1}]).`, &quot;insert&quot;, i + 1, null, j);
  }

  snap(&quot;Ordenação concluída! Array final ordenado em ordem crescente: &quot; + A.slice(1).join(&quot;, &quot;) + &quot;.&quot;, &quot;done&quot;, null, null, n);
}

function drawVisual(A, keyIdx, compIdx, sortedCount, phase) {
  const svg = document.getElementById(&#x27;visual-svg&#x27;);
  svg.innerHTML = &#x27;&#x27;;

  const n = A.length - 1;
  const startX = 40;
  const spacing = 62;
  const centerY = 80;

  for (let i = 1; i &lt;= n; i++) {
    const cx = startX + (i - 1) * spacing;
    
    // Decisão de cores baseada nos estados do Insertion Sort
    let fillVar = &#x27;var(--bg2)&#x27;, strokeColor = &#x27;var(--border2)&#x27;, textColor = &#x27;var(--text)&#x27;;
    let isKey = (i === keyIdx);
    let isComp = (i === compIdx);
    let isSorted = (i &lt;= sortedCount &amp;&amp; phase !== &#x27;done&#x27; &amp;&amp; !isKey &amp;&amp; !isComp) || phase === &#x27;done&#x27;;

    if (isKey) {
      fillVar = &#x27;var(--warn-bg)&#x27;; strokeColor = &#x27;var(--warn-border)&#x27;; textColor = &#x27;var(--warn-text)&#x27;;
    } else if (isComp) {
      fillVar = &#x27;var(--info-bg)&#x27;; strokeColor = &#x27;var(--info-border)&#x27;; textColor = &#x27;var(--info-text)&#x27;;
    } else if (isSorted) {
      fillVar = &#x27;var(--success-bg)&#x27;; strokeColor = &#x27;var(--success-border)&#x27;; textColor = &#x27;var(--success-text)&#x27;;
    }

    // Desenha barra ou retângulo vertical para dar um aspeto moderno e linear
    const rectH = 50;
    const rectW = 44;
    const rx = cx - rectW/2;
    const ry = centerY - rectH/2;

    const rect = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;rect&#x27;);
    rect.setAttribute(&#x27;x&#x27;, rx); rect.setAttribute(&#x27;y&#x27;, ry);
    rect.setAttribute(&#x27;width&#x27;, rectW); rect.setAttribute(&#x27;height&#x27;, rectH);
    rect.setAttribute(&#x27;rx&#x27;, 8);
    rect.setAttribute(&#x27;fill&#x27;, fillVar);
    rect.setAttribute(&#x27;stroke&#x27;, strokeColor);
    rect.setAttribute(&#x27;stroke-width&#x27;, &#x27;1.5&#x27;);
    svg.appendChild(rect);

    // Índices
    const idx = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;text&#x27;);
    idx.setAttribute(&#x27;x&#x27;, cx); idx.setAttribute(&#x27;y&#x27;, ry - 10);
    idx.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
    idx.setAttribute(&#x27;font-size&#x27;, &#x27;11&#x27;);
    idx.setAttribute(&#x27;fill&#x27;, &#x27;var(--text3)&#x27;);
    idx.textContent = `i=${i}`;
    svg.appendChild(idx);

    // Valores
    const txt = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;text&#x27;);
    txt.setAttribute(&#x27;x&#x27;, cx); txt.setAttribute(&#x27;y&#x27;, centerY);
    txt.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
    txt.setAttribute(&#x27;dominant-baseline&#x27;, &#x27;central&#x27;);
    txt.setAttribute(&#x27;font-size&#x27;, &#x27;15&#x27;);
    txt.setAttribute(&#x27;font-weight&#x27;, &#x27;600&#x27;);
    txt.setAttribute(&#x27;fill&#x27;, textColor);
    txt.textContent = A[i];
    svg.appendChild(txt);
    
    // Indicador especial por baixo se for a chave atual &quot;Key&quot;
    if(isKey &amp;&amp; phase !== &#x27;insert&#x27;) {
      const subTxt = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;text&#x27;);
      subTxt.setAttribute(&#x27;x&#x27;, cx); subTxt.setAttribute(&#x27;y&#x27;, ry + rectH + 16);
      subTxt.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
      subTxt.setAttribute(&#x27;font-size&#x27;, &#x27;10&#x27;);
      subTxt.setAttribute(&#x27;font-weight&#x27;, &#x27;bold&#x27;);
      subTxt.setAttribute(&#x27;fill&#x27;, &#x27;var(--warn-border)&#x27;);
      subTxt.textContent = &quot;CHAVE&quot;;
      svg.appendChild(subTxt);
    }
  }
}

function drawArray(A, keyIdx, compIdx, sortedCount, phase) {
  const row = document.getElementById(&#x27;array-row&#x27;);
  row.innerHTML = &#x27;&#x27;;
  for (let i = 1; i &lt; A.length; i++) {
    const cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;cell&#x27;;
    
    let isKey = (i === keyIdx);
    let isComp = (i === compIdx);
    let isSorted = (i &lt;= sortedCount &amp;&amp; phase !== &#x27;done&#x27; &amp;&amp; !isKey &amp;&amp; !isComp) || phase === &#x27;done&#x27;;

    if (isKey) cell.classList.add(&#x27;cell-key&#x27;);
    else if (isComp) cell.classList.add(&#x27;cell-compare&#x27;);
    else if (isSorted) cell.classList.add(&#x27;cell-sorted&#x27;);
    else cell.classList.add(&#x27;cell-unsorted&#x27;);

    const idxEl = document.createElement(&#x27;div&#x27;);
    idxEl.className = &#x27;cell-idx&#x27;;
    idxEl.textContent = i;
    const valEl = document.createElement(&#x27;div&#x27;);
    valEl.className = &#x27;cell-val&#x27;;
    valEl.textContent = A[i];
    
    cell.appendChild(idxEl);
    cell.appendChild(valEl);
    row.appendChild(cell);
  }
}

function render() {
  const s = steps[cur];
  drawVisual(s.A, s.keyIdx, s.compIdx, s.sortedCount, s.phase);
  drawArray(s.A, s.keyIdx, s.compIdx, s.sortedCount, s.phase);
  document.getElementById(&#x27;desc-box&#x27;).innerHTML = s.desc;

  const phaseColors = {
    init: &#x27;background:var(--bg3);color:var(--text2)&#x27;,
    scan: &#x27;background:var(--warn-bg);color:var(--warn-text)&#x27;,
    shift: &#x27;background:var(--info-bg);color:var(--info-text)&#x27;,
    compare: &#x27;background:var(--info-bg);color:var(--info-text)&#x27;,
    insert: &#x27;background:var(--success-bg);color:var(--success-text)&#x27;,
    done: &#x27;background:var(--success-bg);color:var(--success-text)&#x27;
  };
  
  const phaseNames = { 
    init: &#x27;Início&#x27;, 
    scan: &#x27;Nova Chave&#x27;, 
    shift: &#x27;Deslocamento&#x27;, 
    compare: &#x27;Comparação&#x27;, 
    insert: &#x27;Inserção&#x27;, 
    done: &#x27;Concluído&#x27; 
  };
  
  const pb = document.getElementById(&#x27;phase-label&#x27;);
  pb.style.cssText = (phaseColors[s.phase] || &#x27;&#x27;) + &#x27;;padding:3px 12px;border-radius:8px;font-size:12px;font-weight:500&#x27;;
  pb.textContent = phaseNames[s.phase] || s.phase;

  document.getElementById(&#x27;step-counter&#x27;).textContent = `Passo ${cur+1} de ${steps.length}`;
  document.getElementById(&#x27;btn-prev&#x27;).disabled = cur === 0;
  document.getElementById(&#x27;btn-next&#x27;).disabled = cur === steps.length - 1;
}

function step(d) { cur = Math.max(0, Math.min(steps.length-1, cur+d)); render(); }
function reset() { cur = 0; render(); }

genSteps();
render();
&lt;/script&gt;
&lt;/body&gt;

&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Merge Sort — Demonstração Interativa&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Estruturas de Dados e Algoritmos · IPBeja · EDA Aula 2&lt;/p&gt;

  &lt;div class=&quot;info-row&quot;&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Divisão e Conquista&lt;/strong&gt;&lt;span&gt;Subproblemas de tamanho n/2&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Função merge&lt;/strong&gt;&lt;span&gt;Usa Sentinelas: ∞&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Complexidade Pior Caso&lt;/strong&gt;&lt;span&gt;Custo: Θ(n log n)&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-prev&quot; onclick=&quot;step(-1)&quot;&gt;← Anterior&lt;/button&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-next&quot; onclick=&quot;step(1)&quot;&gt;Próximo →&lt;/button&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;reset()&quot;&gt;↺ Recomeçar&lt;/button&gt;
    &lt;span id=&quot;phase-label&quot; class=&quot;phase-badge&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;desc-box&quot; id=&quot;desc-box&quot;&gt;&lt;/div&gt;

  &lt;svg id=&quot;visual-svg&quot; viewBox=&quot;0 0 680 180&quot;&gt;&lt;/svg&gt;

  &lt;div class=&quot;array-label&quot;&gt;Array Principal A (índice em cima, valor em baixo):&lt;/div&gt;
  &lt;div id=&quot;array-row&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;step-counter&quot; id=&quot;step-counter&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;pseudocode-section&quot;&gt;
    
    &lt;div class=&quot;pseudocode-title&quot;&gt;Secção 1: MERGE-SORT(A, p, r) — Divisão Recursiva&lt;/div&gt;
    &lt;div class=&quot;code-container&quot;&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;if p &lt; r then&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Se o sub-array tiver mais do que 1 elemento...&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    q = ⌊(p + r) / 2⌋&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Calcula o ponto intermédio (divisão a meio).&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    MERGE-SORT(A, p, q)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Ordena recursivamente a primeira metade esquerda.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    MERGE-SORT(A, q + 1, r)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Ordena recursivamente a segunda metade direita.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    MERGE(A, p, q, r)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Intercala as duas metades já ordenadas.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;pseudocode-title&quot;&gt;Secção 2: MERGE(A, p, q, r) — Combinação e Escrita das Metades&lt;/div&gt;
    &lt;div class=&quot;code-container&quot; id=&quot;code-container&quot;&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;n1 = q - p + 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Tamanho da sequência da esquerda.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;n2 = r - q&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Tamanho da sequência da direita.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;let L[1..n1+1] and R[1..n2+1] be new arrays&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Aloca os blocos temporários L e R.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;for i = 1 to n1 do L[i] = A[p + i - 1]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Transpõe a sub-sequência esquerda para L.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;for j = 1 to n2 do R[j] = A[q + j]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Transpõe a sub-sequência direita para R.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;L[n1 + 1] = ∞&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Sentinela estável no final de L.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;R[n2 + 1] = ∞&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Sentinela estável no final de R.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;i = 1; j = 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Inicializa os apontadores de leitura.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;for k = p to r do&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Reconstrói e ordena o intervalo no Array Principal A.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    if L[i] &lt;= R[j] then&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Se o valor em L for o menor...&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;        A[k] = L[i]; i = i + 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Aloca-o em A[k] e avança em L.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    else A[k] = R[j]; j = j + 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Senão, aloca R[j] em A[k] e avança em R.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

  &lt;/div&gt;

  &lt;div class=&quot;legend&quot;&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--info-bg);border-color:var(--info-border)&quot;&gt;&lt;/div&gt;
      Sub-array em Divisão
    &lt;/div&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--warn-bg);border-color:var(--warn-border)&quot;&gt;&lt;/div&gt;
      Elementos sob Comparação Ativa (L vs R)
    &lt;/div&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--success-bg);border-color:var(--success-border)&quot;&gt;&lt;/div&gt;
      Posição alterada / Escrita ativa
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const ORIG = [16, 4, 10, 14, 7, 9, 3, 2];

let steps = [];
let cur = 0;

function genSteps(){
  steps = [];
  let A = [null, ...ORIG];
  
  function snap(desc, phase, p, r, meta={}) {
    steps.push({
      A: A.slice(),
      desc,
      phase,
      p,
      r,
      meta: JSON.parse(JSON.stringify(meta))
    });
  }

  function merge(p, q, r) {
    let n1 = q - p + 1;
    let n2 = r - q;
    let L = [];
    let R = [];
    
    for(let i = 1; i &lt;= n1; i++) L[i] = A[p + i - 1];
    for(let j = 1; j &lt;= n2; j++) R[j] = A[q + j];
    
    L[n1 + 1] = Infinity;
    R[n2 + 1] = Infinity;
    
    snap(`Execução do &lt;b&gt;MERGE(A, ${p}, ${q}, ${r})&lt;/b&gt;.&lt;br&gt;Criados os arrays auxiliares &lt;b&gt;L&lt;/b&gt; (tamanho ${n1}) e &lt;b&gt;R&lt;/b&gt; (tamanho ${n2}) com as sentinelas &lt;b&gt;&amp;infin;&lt;/b&gt; prontas para início da intercalação.`, &quot;merge&quot;, p, r, { L, R, i:1, j:1, k:p, stage:&#x27;init&#x27; });

    let i = 1;
    let j = 1;
    
    for(let k = p; k &lt;= r; k++) {
      let activeSide = &#x27;&#x27;;
      let chosenVal = null;
      
      if(L[i] &lt;= R[j]) {
        chosenVal = L[i];
        activeSide = &#x27;L&#x27;;
        snap(`Comparação: Elemento esquerdo menor ou igual &lt;b&gt;L[${i}] (${L[i]}) &amp;le; R[${j}] (${R[j] === Infinity ? &#x27;&amp;infin;&#x27; : R[j]})&lt;/b&gt;.&lt;br&gt;Selecionamos o valor de &lt;b&gt;L&lt;/b&gt; para mover para a posição de destino.`, &quot;merge&quot;, p, r, { L, R, i, j, k, stage:&#x27;compare&#x27;, side:&#x27;L&#x27; });
        A[k] = L[i];
        i++;
      } else {
        chosenVal = R[j];
        activeSide = &#x27;R&#x27;;
        snap(`Comparação: Elemento direito menor &lt;b&gt;L[${i}] (${L[i] === Infinity ? &#x27;&amp;infin;&#x27; : L[i]}) &gt; R[${j}] (${R[j]})&lt;/b&gt;.&lt;br&gt;Selecionamos o valor de &lt;b&gt;R&lt;/b&gt; para mover para a posição de destino.`, &quot;merge&quot;, p, r, { L, R, i, j, k, stage:&#x27;compare&#x27;, side:&#x27;R&#x27; });
        A[k] = R[j];
        j++;
      }
      snap(`Posicionado com sucesso: O índice de destino &lt;b&gt;A[${k}]&lt;/b&gt; recebe o valor estável &lt;b&gt;${chosenVal}&lt;/b&gt;. Incrementamos o ponteiro de ${activeSide} e avançamos k para ${k+1}.`, &quot;merge&quot;, p, r, { L, R, i, j, k, stage:&#x27;placed&#x27;, side:activeSide });
    }
    snap(`Fusão terminada para o bloco de índices [${p}..${r}]. O intervalo foi devidamente reordenado e unificado em A.`, &quot;conquer&quot;, p, r, {});
  }

  function mergeSort(p, r) {
    if(p &lt; r) {
      let q = Math.floor((p + r) / 2);
      snap(`Divisão recursiva: &lt;b&gt;mergeSort(A, ${p}, ${r})&lt;/b&gt;.&lt;br&gt;Calculado o ponto médio &lt;b&gt;q = ${q}&lt;/b&gt; para quebrar o problema em duas metades.`, &quot;divide&quot;, p, r, { q });
      
      mergeSort(p, q);
      mergeSort(q + 1, r);
      merge(p, q, r);
    } else {
      snap(`Caso base alcançado: O sub-array possui tamanho 1 no índice &lt;b&gt;A[${p}] = ${A[p]}&lt;/b&gt;. Elementos isolados estão ordenados por definição.`, &quot;divide&quot;, p, r, { base: true });
    }
  }

  snap(&quot;Início da ordenação utilizando Merge Sort (Abordagem de Divisão e Conquista com indexação de Base 1).&quot;, &quot;start&quot;, null, null, {});
  mergeSort(1, A.length - 1);
  snap(&quot;Algoritmo concluído! Todas as subdivisões foram resolvidas e intercaladas. O array está perfeitamente ordenado.&quot;, &quot;done&quot;, null, null, {});
}

function drawVisual(s) {
  const svg = document.getElementById(&#x27;visual-svg&#x27;);
  svg.innerHTML = &#x27;&#x27;;
  
  if (s.phase === &#x27;start&#x27; || s.phase === &#x27;done&#x27; || !s.p) {
    const txt = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
    txt.setAttribute(&#x27;x&#x27;, 340); txt.setAttribute(&#x27;y&#x27;, 95);
    txt.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
    txt.setAttribute(&#x27;fill&#x27;, &#x27;var(--text2)&#x27;);
    txt.setAttribute(&#x27;font-size&#x27;, &#x27;14&#x27;);
    txt.textContent = s.phase === &#x27;done&#x27; ? &quot;Concluído! Todos os blocos foram fundidos com sucesso.&quot; : &quot;Pressiona Próximo para ver a árvore e as matrizes auxiliares L e R.&quot;;
    svg.appendChild(txt);
    return;
  }

  if (s.phase === &#x27;divide&#x27;) {
    let q = s.meta.q;
    for(let i=1; i&lt;=8; i++) {
      let x = 40 + (i-1)*75;
      let y = 70;
      let inScope = (i &gt;= s.p &amp;&amp; i &lt;= s.r);
      
      if(inScope &amp;&amp; q) {
        y = (i &lt;= q) ? 50 : 90;
      }
      
      drawBox(svg, x, y, s.A[i], i, inScope ? &#x27;var(--info-bg)&#x27; : &#x27;var(--bg)&#x27;, inScope ? &#x27;var(--info-border)&#x27; : &#x27;var(--border)&#x27;);
    }
    return;
  }

  if (s.phase === &#x27;merge&#x27; &amp;&amp; s.meta.L) {
    const meta = s.meta;
    
    // DESENHO DO ARRAY A
    drawText(svg, 40, 32, &quot;Array Principal A:&quot;, &quot;12&quot;, &quot;var(--text2)&quot;, &quot;start&quot;);
    for(let i=1; i&lt;=8; i++) {
      let x = 40 + (i-1)*50;
      let isTarget = (i === meta.k);
      let isCurrentRange = (i &gt;= s.p &amp;&amp; i &lt;= s.r);
      
      let fill = &#x27;var(--bg)&#x27;;
      let border = &#x27;var(--border)&#x27;;
      
      if (isCurrentRange) {
        if (isTarget &amp;&amp; meta.stage === &#x27;placed&#x27;) {
          fill = &#x27;var(--success-bg)&#x27;; 
          border = &#x27;var(--success-border)&#x27;;
        } else if (isTarget &amp;&amp; meta.stage === &#x27;compare&#x27;) {
          fill = &#x27;var(--warn-bg)&#x27;;
          border = &#x27;var(--warn-border)&#x27;;
        } else {
          fill = &#x27;var(--info-bg)&#x27;; 
          border = &#x27;var(--info-border)&#x27;;
        }
      }
      drawBox(svg, x, 40, s.A[i], i, fill, border);
    }

    // DESENHO DO ARRAY AUXILIAR L
    drawText(svg, 40, 112, &quot;Array Auxiliar L (Esquerdo):&quot;, &quot;12&quot;, &quot;var(--text2)&quot;, &quot;start&quot;);
    for(let i=1; i&lt;meta.L.length; i++) {
      let x = 40 + (i-1)*50;
      let isComparing = (i === meta.i &amp;&amp; meta.side === &#x27;L&#x27; &amp;&amp; meta.stage === &#x27;compare&#x27;);
      
      let fill = &#x27;var(--info-bg)&#x27;;
      let border = &#x27;var(--info-border)&#x27;;
      
      if (isComparing) {
        fill = &#x27;var(--warn-bg)&#x27;;
        border = &#x27;var(--warn-border)&#x27;;
      }
      
      let valStr = meta.L[i] === Infinity ? &#x27;∞&#x27; : meta.L[i];
      drawBox(svg, x, 120, valStr, i, fill, border);
    }

    // DESENHO DO ARRAY AUXILIAR R
    let startX_R = 40 + (meta.L.length * 50) + 40;
    drawText(svg, startX_R, 112, &quot;Array Auxiliar R (Direito):&quot;, &quot;12&quot;, &quot;var(--text2)&quot;, &quot;start&quot;);
    for(let j=1; j&lt;meta.R.length; j++) {
      let x = startX_R + (j-1)*50;
      let isComparing = (j === meta.j &amp;&amp; meta.side === &#x27;R&#x27; &amp;&amp; meta.stage === &#x27;compare&#x27;);
      
      let fill = &#x27;var(--info-bg)&#x27;;
      let border = &#x27;var(--info-border)&#x27;;
      
      if (isComparing) {
        fill = &#x27;var(--warn-bg)&#x27;;
        border = &#x27;var(--warn-border)&#x27;;
      }

      let valStr = meta.R[j] === Infinity ? &#x27;∞&#x27; : meta.R[j];
      drawBox(svg, x, 120, valStr, j, fill, border);
    }
  }
  
  if (s.phase === &#x27;conquer&#x27;) {
    for(let i=1; i&lt;=8; i++) {
      let x = 40 + (i-1)*75;
      let inRange = (i &gt;= s.p &amp;&amp; i &lt;= s.r);
      // CORREÇÃO: Apenas fica verde se estiver dentro do intervalo conquistado neste passo
      drawBox(svg, x, 70, s.A[i], i, inRange ? &#x27;var(--success-bg)&#x27; : &#x27;var(--bg)&#x27;, inRange ? &#x27;var(--success-border)&#x27; : &#x27;var(--border)&#x27;);
    }
  }
}

function drawBox(svg, x, y, val, idx, fill, border) {
  const rect = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;rect&#x27;);
  rect.setAttribute(&#x27;x&#x27;, x); rect.setAttribute(&#x27;y&#x27;, y);
  rect.setAttribute(&#x27;width&#x27;, 42); rect.setAttribute(&#x27;height&#x27;, 36);
  rect.setAttribute(&#x27;fill&#x27;, fill); rect.setAttribute(&#x27;stroke&#x27;, border);
  rect.setAttribute(&#x27;stroke-width&#x27;, &#x27;1.5&#x27;);
  rect.setAttribute(&#x27;rx&#x27;, &#x27;6&#x27;);
  svg.appendChild(rect);

  const tIdx = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
  tIdx.setAttribute(&#x27;x&#x27;, x + 21); tIdx.setAttribute(&#x27;y&#x27;, y - 4);
  tIdx.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;); tIdx.setAttribute(&#x27;font-size&#x27;, &#x27;9&#x27;);
  tIdx.setAttribute(&#x27;fill&#x27;, &#x27;var(--text3)&#x27;);
  tIdx.textContent = idx;
  svg.appendChild(tIdx);

  const tVal = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
  tVal.setAttribute(&#x27;x&#x27;, x + 21); tVal.setAttribute(&#x27;y&#x27;, y + 18);
  tVal.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;); tVal.setAttribute(&#x27;dominant-baseline&#x27;, &#x27;central&#x27;);
  tVal.setAttribute(&#x27;font-size&#x27;, &#x27;13&#x27;); tVal.setAttribute(&#x27;font-weight&#x27;, &#x27;500&#x27;);
  tVal.setAttribute(&#x27;fill&#x27;, &#x27;var(--text)&#x27;);
  tVal.textContent = val;
  svg.appendChild(tVal);
}

function drawText(svg, x, y, str, size, color, anchor=&quot;middle&quot;) {
  const txt = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
  txt.setAttribute(&#x27;x&#x27;, x); txt.setAttribute(&#x27;y&#x27;, y);
  txt.setAttribute(&#x27;font-size&#x27;, size); txt.setAttribute(&#x27;fill&#x27;, color);
  txt.setAttribute(&#x27;text-anchor&#x27;, anchor);
  txt.innerHTML = str;
  svg.appendChild(txt);
}

function drawArray(A, s){
  const row = document.getElementById(&#x27;array-row&#x27;);
  row.innerHTML = &#x27;&#x27;;
  for(let i = 1; i &lt; A.length; i++){
    const cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;cell&#x27;;
    
    let isCurrentScope = (i &gt;= s.p &amp;&amp; i &lt;= s.r);
    
    if(s.phase === &#x27;done&#x27;) {
      cell.classList.add(&#x27;cell-active&#x27;);
    } else if(isCurrentScope) {
      if (s.phase === &#x27;divide&#x27;) {
        cell.classList.add(&#x27;cell-divide&#x27;);
      } else if (s.phase === &#x27;merge&#x27;) {
        if (i === s.meta.k &amp;&amp; s.meta.stage === &#x27;placed&#x27;) {
          cell.classList.add(&#x27;cell-active&#x27;); 
        } else if (i === s.meta.k &amp;&amp; s.meta.stage === &#x27;compare&#x27;) {
          cell.classList.add(&#x27;cell-merge&#x27;);
        } else {
          cell.classList.add(&#x27;cell-divide&#x27;);
        }
      } else if (s.phase === &#x27;conquer&#x27;) {
        // CORREÇÃO: Apenas ativa o verde em baixo para o bloco local conquistado
        cell.classList.add(&#x27;cell-active&#x27;);
      }
    } else {
      cell.classList.add(&#x27;cell-normal&#x27;);
    }

    const idxEl = document.createElement(&#x27;div&#x27;);
    idxEl.className = &#x27;cell-idx&#x27;;
    idxEl.textContent = i;
    const valEl = document.createElement(&#x27;div&#x27;);
    valEl.className = &#x27;cell-val&#x27;;
    valEl.textContent = A[i];
    cell.appendChild(idxEl);
    cell.appendChild(valEl);
    row.appendChild(cell);
  }
}

function render(){
  const s = steps[cur];
  drawVisual(s);
  drawArray(s.A, s);
  document.getElementById(&#x27;desc-box&#x27;).innerHTML = s.desc;

  const phaseColors = {
    start:   &#x27;background:var(--bg3);color:var(--text2)&#x27;,
    divide:  &#x27;background:var(--info-bg);color:var(--info-text)&#x27;,
    merge:   &#x27;background:var(--warn-bg);color:var(--warn-text)&#x27;,
    conquer: &#x27;background:var(--success-bg);color:var(--success-text)&#x27;,
    done:    &#x27;background:var(--success-bg);color:var(--success-text)&#x27;
  };
  const phaseNames = { start: &#x27;Setup&#x27;, divide: &#x27;Divisão&#x27;, merge: &#x27;Fusão (Merge)&#x27;, conquer: &#x27;Conquistado&#x27;, done: &#x27;Concluído&#x27; };
  const pb = document.getElementById(&#x27;phase-label&#x27;);
  pb.style.cssText = (phaseColors[s.phase] || &#x27;&#x27;) + &#x27;;padding:3px 12px;border-radius:8px;font-size:12px;font-weight:500&#x27;;
  pb.textContent = phaseNames[s.phase] || s.phase;

  document.getElementById(&#x27;step-counter&#x27;).textContent = `Passo ${cur+1} de ${steps.length}`;
  document.getElementById(&#x27;btn-prev&#x27;).disabled = cur === 0;
  document.getElementById(&#x27;btn-next&#x27;).disabled = cur === steps.length - 1;
}

function step(d){ cur = Math.max(0, Math.min(steps.length-1, cur+d)); render(); }
function reset(){ cur = 0; render(); }

genSteps();
render();
&lt;/script&gt;

&lt;html lang=&quot;pt&quot;&gt;

&lt;title&gt;Heap Sort — Demonstração Interativa&lt;/title&gt;
&lt;style&gt;
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Heap Sort — Demonstração Interativa&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Estruturas de Dados e Algoritmos · IPBeja · EDA Aula 3&lt;/p&gt;

  &lt;div class=&quot;info-row&quot;&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Build-Max-Heap&lt;/strong&gt;&lt;span&gt;Custo: O(n) linear&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Max-Heapify&lt;/strong&gt;&lt;span&gt;Custo: O(log n) por descida&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Heap Sort Total&lt;/strong&gt;&lt;span&gt;Custo Total: O(n log n)&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-prev&quot; onclick=&quot;step(-1)&quot;&gt;← Anterior&lt;/button&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-next&quot; onclick=&quot;step(1)&quot;&gt;Próximo →&lt;/button&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;reset()&quot;&gt;↺ Recomeçar&lt;/button&gt;
    &lt;span id=&quot;phase-label&quot; class=&quot;phase-badge&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;desc-box&quot; id=&quot;desc-box&quot;&gt;&lt;/div&gt;

  &lt;svg id=&quot;tree-svg&quot; viewBox=&quot;0 0 680 270&quot;&gt;&lt;/svg&gt;

  &lt;div class=&quot;array-label&quot;&gt;Array Principal A (índice em cima, valor em baixo):&lt;/div&gt;
  &lt;div id=&quot;array-row&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;step-counter&quot; id=&quot;step-counter&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;pseudocode-section&quot;&gt;
    
    &lt;div class=&quot;pseudocode-title&quot;&gt;Secção 1: HEAP-SORT(A) — Algoritmo Principal&lt;/div&gt;
    &lt;div class=&quot;code-container&quot;&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;BUILD-MAX-HEAP(A)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Converte o array desordenado num Max-Heap estável.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;for i = A.length down to 2 do&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Extrai consecutivamente os elementos da raiz.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    exchange A[1] with A[i]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Envia o maior elemento (raiz) para a cauda do array.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    A.heap-size = A.heap-size - 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Reduz a fronteira do heap, isolando o elemento fixado.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    MAX-HEAPIFY(A, 1)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Corrige a raiz para reestruturar a propriedade de max-heap.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;pseudocode-title&quot;&gt;Secção 2: BUILD-MAX-HEAP(A) — Construção Iterativa&lt;/div&gt;
    &lt;div class=&quot;code-container&quot;&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;A.heap-size = A.length&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Define o tamanho inicial do heap como a totalidade do array.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;for i = ⌊A.length / 2⌋ down to 1 do&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Itera sobre os nós internos (que contêm filhos).&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    MAX-HEAPIFY(A, i)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Garante que o sub-heap centrado em &#x27;i&#x27; respeita a regra.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;pseudocode-title&quot;&gt;Secção 3: MAX-HEAPIFY(A, i) — Correção e Descida do Elemento&lt;/div&gt;
    &lt;div class=&quot;code-container&quot;&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;l = LEFT(i); r = RIGHT(i)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Determina os índices dos filhos esquerdo (2*i) e direito (2*i+1).&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;if l ≤ A.heap-size and A[l] &gt; A[i] then largest = l else largest = i&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Verifica o maior entre &#x27;i&#x27; e o esquerdo.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;if r ≤ A.heap-size and A[r] &gt; A[largest] then largest = r&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Verifica se o filho direito é maior ainda.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;if largest ≠ i then&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Caso um dos filhos quebre a propriedade de Max-Heap...&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    exchange A[i] with A[largest]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Permuta os valores de forma a restabelecer a ordem.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    MAX-HEAPIFY(A, largest)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Executa recursivamente no nó afetado para propagar a descida.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

  &lt;/div&gt;

  &lt;div class=&quot;legend&quot;&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--info-bg);border-color:var(--info-border)&quot;&gt;&lt;/div&gt;
      Nó Integrante do Heap
    &lt;/div&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--warn-bg);border-color:var(--warn-border)&quot;&gt;&lt;/div&gt;
      Elemento em Análise Ativa / Troca
    &lt;/div&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--success-bg);border-color:var(--success-border)&quot;&gt;&lt;/div&gt;
      Elemento Estabilizado (Ordenado)
    &lt;/div&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--bg3);border-color:var(--border)&quot;&gt;&lt;/div&gt;
      Excluído do Heap (heap-size reduzido)
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const ORIG = [16, 4, 10, 14, 7, 9, 3, 2, 8, 1];

function parent(i){ return Math.floor(i/2); }
function left(i){ return 2*i; }
function right(i){ return 2*i+1; }

let steps = [];
let cur = 0;

function genSteps(){
  steps = [];
  let A = [null, ...ORIG];
  let hs = A.length - 1;

  function snap(desc, phase, highlight=[], sorted=[]){
    steps.push({ 
      A: A.slice(), 
      hs, 
      desc, 
      phase, 
      highlight: highlight.slice(), 
      sorted: sorted.slice() 
    });
  }

  snap(&quot;&lt;b&gt;Estado Inicial:&lt;/b&gt; Representação do array como árvore binária. Vamos invocar o &lt;code&gt;BUILD-MAX-HEAP(A)&lt;/code&gt; para reestruturá-lo.&quot;, &quot;build&quot;, []);

  // BUILD-MAX-HEAP
  for(let i = Math.floor((A.length-1)/2); i &gt;= 1; i--){
    snap(`Início do procedimento: Chamando &lt;code&gt;MAX-HEAPIFY(A, ${i})&lt;/code&gt; no nó interno &lt;b&gt;A[${i}]&lt;/b&gt; (valor ${A[i]}) para inspecionar a sua árvore descendente.`, &quot;build&quot;, [i]);
    let ii = i;
    while(true){
      let l = left(ii), r = right(ii), largest = ii;
      if(l &lt;= hs &amp;&amp; A[l] &gt; A[largest]) largest = l;
      if(r &lt;= hs &amp;&amp; A[r] &gt; A[largest]) largest = r;
      
      if(largest !== ii){
        snap(`Violação detetada: O pai &lt;b&gt;A[${ii}] (${A[ii]})&lt;/b&gt; é menor que o filho &lt;b&gt;A[${largest}] (${A[largest]})&lt;/b&gt;. É necessária uma troca imediata.`, &quot;build&quot;, [ii, largest]);
        [A[ii], A[largest]] = [A[largest], A[ii]];
        snap(`Permutado com sucesso: Valores invertidos. O elemento afetado desceu para a posição &lt;b&gt;A[${largest}]&lt;/b&gt;. Continua-se a análise em profundidade.`, &quot;build&quot;, [largest]);
        ii = largest;
      } else {
        snap(`Propriedade assegurada no nó &lt;b&gt;${ii}&lt;/b&gt;: O elemento já cumpre a regra do Max-Heap (maior ou igual a ambos os filhos).`, &quot;build&quot;, [ii]);
        break;
      }
    }
  }
  snap(`Estrutura Pronta: &lt;code&gt;BUILD-MAX-HEAP(A)&lt;/code&gt; terminou. O maior elemento global do array encontra-se isolado na raiz principal: &lt;b&gt;A[1] = ${A[1]}&lt;/b&gt;.`, &quot;build&quot;, [1]);

  // HEAP-SORT SELECTION PHASE
  let sorted = [];
  for(let i = A.length-1; i &gt;= 2; i--){
    snap(`Fase de Extração: Trocamos o elemento máximo na raiz &lt;b&gt;A[1] (${A[1]})&lt;/b&gt; com o último elemento ativo do heap &lt;b&gt;A[${i}] (${A[i]})&lt;/b&gt;.`, &quot;sort&quot;, [1, i], sorted.slice());
    [A[1], A[i]] = [A[i], A[1]];
    sorted.unshift(i);
    hs--;
    snap(`Elemento Fixado: O valor &lt;b&gt;${A[i]}&lt;/b&gt; está agora na sua posição ordenada permanente. O limite operacional decresce: &lt;code&gt;heap-size&lt;/code&gt; = &lt;b&gt;${hs}&lt;/b&gt;. Realiza-se o reajuste da nova raiz.`, &quot;sort&quot;, [1], sorted.slice());
    
    let ii = 1;
    while(true){
      let l = left(ii), r = right(ii), largest = ii;
      if(l &lt;= hs &amp;&amp; A[l] &gt; A[largest]) largest = l;
      if(r &lt;= hs &amp;&amp; A[r] &gt; A[largest]) largest = r;
      
      if(largest !== ii){
        snap(`Inconsistência na raiz: O valor superior &lt;b&gt;A[${ii}] (${A[ii]})&lt;/b&gt; quebra a integridade face ao filho &lt;b&gt;A[${largest}] (${A[largest]})&lt;/b&gt;. Efetuando correção.`, &quot;sort&quot;, [ii, largest], sorted.slice());
        [A[ii], A[largest]] = [A[largest], A[ii]];
        ii = largest;
      } else break;
    }
    if(i &gt; 2) snap(`Propriedade Reestabelecida: Max-Heap reorganizado com êxito. Nova raiz candidata definida: &lt;b&gt;A[1] = ${A[1]}&lt;/b&gt;.`, &quot;sort&quot;, [1], sorted.slice());
  }
  sorted.unshift(1);
  snap(&quot;Algoritmo Concluído! Todas as permutas e descidas terminaram com sucesso. O array encontra-se ordenado em ordem estável crescente.&quot;, &quot;done&quot;, [], sorted.slice());
}

const POSITIONS = [
  null,
  [340, 32],
  [196, 92], [484, 92],
  [124, 152], [268, 152], [412, 152], [556, 152],
  [88,  212], [160, 212], [232, 212], [304, 212]
];

function drawTree(A, hs, highlight, sorted){
  const svg = document.getElementById(&#x27;tree-svg&#x27;);
  svg.innerHTML = &#x27;&#x27;;

  const n = Math.min(A.length - 1, 11);

  // DESENHO DAS ARESTAS DE CONEXÃO
  for(let i = 2; i &lt;= n; i++){
    const pi = parent(i);
    if(!POSITIONS[i] || !POSITIONS[pi]) continue;
    const [x1,y1] = POSITIONS[pi];
    const [x2,y2] = POSITIONS[i];
    
    const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/len, ny=dy/len, r=18;
    
    const line = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;line&#x27;);
    line.setAttribute(&#x27;x1&#x27;, x1+nx*r); line.setAttribute(&#x27;y1&#x27;, y1+ny*r);
    line.setAttribute(&#x27;x2&#x27;, x2-nx*r); line.setAttribute(&#x27;y2&#x27;, y2-ny*r);
    line.setAttribute(&#x27;stroke&#x27;, getComputedStyle(document.documentElement).getPropertyValue(&#x27;--border2&#x27;).trim() || &#x27;#ccc&#x27;);
    line.setAttribute(&#x27;stroke-width&#x27;, &#x27;1.2&#x27;);
    svg.appendChild(line);
  }

  // DESENHO DOS NÓS DA ÁRVORE
  for(let i = 1; i &lt;= n; i++){
    if(!POSITIONS[i]) continue;
    const [cx,cy] = POSITIONS[i];
    const inHeap = i &lt;= hs;
    const isSort = sorted.includes(i);
    const isHL = highlight.includes(i);

    let fillVar, strokeColor, textColor;
    if(isSort){
      fillVar = &#x27;var(--success-bg)&#x27;; strokeColor = &#x27;var(--success-border)&#x27;; textColor = &#x27;var(--success-text)&#x27;;
    } else if(!inHeap){
      fillVar = &#x27;var(--bg3)&#x27;; strokeColor = &#x27;var(--border)&#x27;; textColor = &#x27;var(--text3)&#x27;;
    } else if(isHL){
      fillVar = &#x27;var(--warn-bg)&#x27;; strokeColor = &#x27;var(--warn-border)&#x27;; textColor = &#x27;var(--warn-text)&#x27;;
    } else {
      fillVar = &#x27;var(--info-bg)&#x27;; strokeColor = &#x27;var(--info-border)&#x27;; textColor = &#x27;var(--info-text)&#x27;;
    }

    const circle = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;circle&#x27;);
    circle.setAttribute(&#x27;cx&#x27;, cx); circle.setAttribute(&#x27;cy&#x27;, cy);
    circle.setAttribute(&#x27;r&#x27;, 18);
    circle.setAttribute(&#x27;fill&#x27;, fillVar);
    circle.setAttribute(&#x27;stroke&#x27;, strokeColor);
    circle.setAttribute(&#x27;stroke-width&#x27;, &#x27;1.5&#x27;);
    svg.appendChild(circle);

    const idx = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
    idx.setAttribute(&#x27;x&#x27;, cx); idx.setAttribute(&#x27;y&#x27;, cy - 23);
    idx.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
    idx.setAttribute(&#x27;font-size&#x27;, &#x27;9&#x27;);
    idx.setAttribute(&#x27;fill&#x27;, &#x27;var(--text3)&#x27;);
    idx.textContent = i;
    svg.appendChild(idx);

    const txt = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
    txt.setAttribute(&#x27;x&#x27;, cx); txt.setAttribute(&#x27;y&#x27;, cy);
    txt.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
    txt.setAttribute(&#x27;dominant-baseline&#x27;, &#x27;central&#x27;);
    txt.setAttribute(&#x27;font-size&#x27;, &#x27;12&#x27;);
    txt.setAttribute(&#x27;font-weight&#x27;, &#x27;500&#x27;);
    txt.setAttribute(&#x27;fill&#x27;, textColor);
    txt.textContent = A[i];
    svg.appendChild(txt);
  }
}

function drawArray(A, hs, highlight, sorted){
  const row = document.getElementById(&#x27;array-row&#x27;);
  row.innerHTML = &#x27;&#x27;;
  for(let i = 1; i &lt; A.length; i++){
    const cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;cell&#x27;;
    const isSort = sorted.includes(i);
    const isHL = highlight.includes(i);
    const inHeap = i &lt;= hs;
    
    if(isSort) cell.classList.add(&#x27;cell-sort&#x27;);
    else if(isHL) cell.classList.add(&#x27;cell-hl&#x27;);
    else if(inHeap) cell.classList.add(&#x27;cell-heap&#x27;);
    else cell.classList.add(&#x27;cell-out&#x27;);

    const idxEl = document.createElement(&#x27;div&#x27;);
    idxEl.className = &#x27;cell-idx&#x27;;
    idxEl.textContent = i;
    const valEl = document.createElement(&#x27;div&#x27;);
    valEl.className = &#x27;cell-val&#x27;;
    valEl.textContent = A[i];
    cell.appendChild(idxEl);
    cell.appendChild(valEl);
    row.appendChild(cell);
  }
}

function render(){
  const s = steps[cur];
  drawTree(s.A, s.hs, s.highlight, s.sorted);
  drawArray(s.A, s.hs, s.highlight, s.sorted);
  document.getElementById(&#x27;desc-box&#x27;).innerHTML = s.desc;

  const phaseColors = {
    build: &#x27;background:var(--info-bg);color:var(--info-text)&#x27;,
    sort:  &#x27;background:var(--warn-bg);color:var(--warn-text)&#x27;,
    done:  &#x27;background:var(--success-bg);color:var(--success-text)&#x27;
  };
  const phaseNames = { build: &#x27;Build-Max-Heap&#x27;, sort: &#x27;Heap Sort (Ordenação)&#x27;, done: &#x27;Concluído&#x27; };
  const pb = document.getElementById(&#x27;phase-label&#x27;);
  pb.style.cssText = (phaseColors[s.phase] || &#x27;&#x27;) + &#x27;;padding:3px 12px;border-radius:8px;font-size:12px;font-weight:500&#x27;;
  pb.textContent = phaseNames[s.phase] || s.phase;

  document.getElementById(&#x27;step-counter&#x27;).textContent = `Passo ${cur+1} de ${steps.length}`;
  document.getElementById(&#x27;btn-prev&#x27;).disabled = cur === 0;
  document.getElementById(&#x27;btn-next&#x27;).disabled = cur === steps.length - 1;
}

function step(d){ cur = Math.max(0, Math.min(steps.length-1, cur+d)); render(); }
function reset(){ cur = 0; render(); }

genSteps();
render();
&lt;/script&gt;

&lt;div class=&quot;container&quot;&gt;

    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Caso Médio&lt;/strong&gt;&lt;span&gt;Custo: &amp;Theta;(n log n)&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;info-card&quot;&gt;&lt;strong&gt;Partition&lt;/strong&gt;&lt;span&gt;Complexidade Linear: &amp;Theta;(n)&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

    &lt;button class=&quot;btn&quot; onclick=&quot;reset()&quot;&gt;↺ Recomeçar&lt;/button&gt;
    &lt;span id=&quot;phase-label&quot; class=&quot;phase-badge&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;

  &lt;svg id=&quot;visual-svg&quot; viewBox=&quot;0 0 680 140&quot;&gt;&lt;/svg&gt;

  &lt;div class=&quot;array-label&quot;&gt;Array Principal A (índices Base 1, conforme os slides):&lt;/div&gt;
  &lt;div id=&quot;array-row&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;step-counter&quot; id=&quot;step-counter&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;pseudocode-section&quot;&gt;
    
    &lt;div class=&quot;pseudocode-title&quot;&gt;Secção 1: QUICKSORT(A, p, r) — Divisão e Conquista&lt;/div&gt;
    &lt;div class=&quot;code-container&quot;&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;if p &lt; r then&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Condição de paragem: o intervalo tem de ter mais do que 1 elemento.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    q = PARTITION(A, p, r)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Separa o array em redor do pivô e descobre a sua posição intermédia.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    QUICKSORT(A, p, q - 1)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Ordena recursivamente a metade esquerda (elementos menores).&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    QUICKSORT(A, q + 1, r)&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Ordena recursivamente a metade direita (elementos maiores).&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;pseudocode-title&quot;&gt;Secção 2: PARTITION(A, p, r) — Reorganização em torno do Pivô&lt;/div&gt;
    &lt;div class=&quot;code-container&quot;&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;x = A[r]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// O pivô x é sempre o último elemento da fatia atual.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;i = p - 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// O índice &#x27;i&#x27; marca o fim da zona dos elementos que são menores que x.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;for j = p to r - 1 do&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// O índice &#x27;j&#x27; corre a fatia para varrer e analisar cada valor.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;    if A[j] ≤ x then&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Encontraste um valor menor ou igual ao pivô?&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;        i = i + 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Alarga a fronteira dos pequenos avançando o &#x27;i&#x27;.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;        exchange A[i] with A[j]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Joga o elemento pequeno para a zona reservada à esquerda.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;exchange A[i + 1] with A[r]&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Coloca o pivô no meio exato das duas zonas (em i + 1).&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;code-line&quot;&gt;&lt;span class=&quot;line-num&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;line-text&quot;&gt;return i + 1&lt;/span&gt;&lt;span class=&quot;line-comment&quot;&gt;// Devolve a posição final estável do pivô.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

  &lt;/div&gt;

  &lt;div class=&quot;legend&quot;&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--info-bg);border-color:var(--info-border)&quot;&gt;&lt;/div&gt;
      Intervalo sob análise [p..r]
    &lt;/div&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--warn-bg);border-color:var(--warn-border)&quot;&gt;&lt;/div&gt;
      Pivô ativo / Elemento lido por j
    &lt;/div&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--success-bg);border-color:var(--success-border)&quot;&gt;&lt;/div&gt;
      Pivô encaixado na posição final ordenada
    &lt;/div&gt;
    &lt;div class=&quot;legend-item&quot;&gt;
      &lt;div class=&quot;legend-dot&quot; style=&quot;background:var(--bg);border-color:var(--border2)&quot;&gt;&lt;/div&gt;
      Fora do bloco atual de recursão
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const ORIG = [16, 4, 10, 14, 7, 9, 3, 2, 8, 1];

let steps = [];
let cur = 0;
let finalPositions = new Set();

function genSteps(){
  steps = [];
  let A = [null, ...ORIG];
  finalPositions.clear();

  function snap(desc, phase, p, r, meta={}) {
    steps.push({
      A: A.slice(),
      desc,
      phase,
      p,
      r,
      meta: JSON.parse(JSON.stringify(meta)),
      fixed: Array.from(finalPositions)
    });
  }

  function partition(p, r) {
    let x = A[r]; 
    let i = p - 1;
    
    snap(`Entramos na função &lt;code&gt;PARTITION&lt;/code&gt; para o intervalo [${p}..${r}].&lt;br&gt;O pivô escolhido é o último elemento: &lt;b&gt;x = A[${r}] = ${x}&lt;/b&gt;. Arrancamos com &lt;b&gt;i = ${i}&lt;/b&gt;.`, &quot;partition&quot;, p, r, { x, i, j: p, stage: &#x27;init&#x27; });

    for (let j = p; j &lt;= r - 1; j++) {
      snap(`O ponteiro &lt;b&gt;j&lt;/b&gt; está no índice &lt;b&gt;${j}&lt;/b&gt;. Vamos testar se &lt;b&gt;A[${j}] (${A[j]})&lt;/b&gt; é menor ou igual ao nosso pivô &lt;b&gt;x (${x})&lt;/b&gt;.`, &quot;partition&quot;, p, r, { x, i, j, stage: &#x27;check&#x27; });
      
      if (A[j] &lt;= x) {
        i = i + 1;
        snap(`Boa! Como &lt;b&gt;${A[j]} &amp;le; ${x}&lt;/b&gt;, avançamos o ponteiro dos menores (&lt;b&gt;i&lt;/b&gt; passou para &lt;b&gt;${i}&lt;/b&gt;) e vamos trocar o &lt;b&gt;A[${i}]&lt;/b&gt; com o &lt;b&gt;A[${j}]&lt;/b&gt;.`, &quot;partition&quot;, p, r, { x, i, j, stage: &#x27;before_swap&#x27; });
        
        let temp = A[i];
        A[i] = A[j];
        A[j] = temp;
        
        snap(`Troca feita! O valor menor &lt;b&gt;${A[i]}&lt;/b&gt; saltou para a esquerda. A zona segura até ao índice &lt;b&gt;i = ${i}&lt;/b&gt; está arrumada.`, &quot;partition&quot;, p, r, { x, i, j, stage: &#x27;after_swap&#x27; });
      } else {
        snap(`Como &lt;b&gt;A[${j}] (${A[j]}) &gt; ${x}&lt;/b&gt;, não mexemos em nada. O elemento fica sossegado na zona direita dos maiores.`, &quot;partition&quot;, p, r, { x, i, j, stage: &#x27;no_action&#x27; });
      }
    }

    snap(`Varredura do loop feita. Está na hora de tirar o pivô &lt;b&gt;A[${r}] (${x})&lt;/b&gt; da ponta e encaixá-lo no meio, trocando com o &lt;b&gt;A[${i+1}] (${A[i+1]})&lt;/b&gt;.`, &quot;partition&quot;, p, r, { x, i, j: r, stage: &#x27;before_final&#x27; });
    
    let temp = A[i + 1];
    A[i + 1] = A[r];
    A[r] = temp;
    
    let q = i + 1;
    finalPositions.add(q); 
    
    snap(`Perfeito! O pivô encontrou o seu lugar definitivo no índice &lt;b&gt;q = ${q}&lt;/b&gt; (valor &lt;b&gt;${A[q]}&lt;/b&gt;). Tudo à esquerda é menor e tudo à direita é maior.`, &quot;partition&quot;, p, r, { x, i, q, j: q, stage: &#x27;final&#x27; });
    return q;
  }

  function quickSort(p, r) {
    if (p &lt; r) {
      snap(`Disparou o &lt;code&gt;QUICKSORT&lt;/code&gt; no intervalo [${p}..${r}]. Como a fatia tem tamanho válido (p &amp;lt; r), vamos fatiá-la com o Partition.`, &quot;sort&quot;, p, r, {});
      let q = partition(p, r);
      
      snap(`Divisão: O pivô dividiu as águas no índice &lt;b&gt;q = ${q}&lt;/b&gt;. Vamos mandar a metade esquerda para a recursão: &lt;code&gt;QUICKSORT(A, ${p}, ${q-1})&lt;/code&gt;.`, &quot;sort&quot;, p, r, { q });
      quickSort(p, q - 1);
      
      snap(`Divisão: Agora mandamos a metade direita tratar da vida: &lt;code&gt;QUICKSORT(A, ${q+1}, ${r})&lt;/code&gt;.`, &quot;sort&quot;, p, r, { q });
      quickSort(q + 1, r);
    } else if (p === r) {
      finalPositions.add(p);
      snap(`Encontrámos um bloco unitário em &lt;b&gt;A[${p}] = ${A[p]}&lt;/b&gt;. Um elemento sozinho já está ordenado por natureza!`, &quot;sort&quot;, p, r, { base: true });
    }
  }

  snap(&quot;&lt;b&gt;Ponto de Partida:&lt;/b&gt; Carregámos o array desordenado tal como está no &lt;code&gt;main()&lt;/code&gt; do PDF. Vamos começar!&quot;, &quot;start&quot;, null, null, {});
  quickSort(1, A.length - 1);
  
  for(let k=1; k&lt;=10; k++) finalPositions.add(k);
  snap(&quot;Tudo pronto! O array foi completamente esmiuçado e ordenado com sucesso de ponta a ponta.&quot;, &quot;done&quot;, null, null, {});
}

function drawVisual(s) {
  const svg = document.getElementById(&#x27;visual-svg&#x27;);
  svg.innerHTML = &#x27;&#x27;;
  
  for(let idx=1; idx&lt;=10; idx++) {
    let x = 40 + (idx-1)*60;
    let y = 50;
    
    let fill = &#x27;var(--bg)&#x27;;
    let border = &#x27;var(--border)&#x27;;
    
    if (s.fixed.includes(idx)) {
      fill = &#x27;var(--success-bg)&#x27;;
      border = &#x27;var(--success-border)&#x27;;
    } else if (s.p &amp;&amp; idx &gt;= s.p &amp;&amp; idx &lt;= s.r) {
      if (s.meta &amp;&amp; s.meta.j === idx &amp;&amp; s.phase === &#x27;partition&#x27;) {
        fill = &#x27;var(--warn-bg)&#x27;;
        border = &#x27;var(--warn-border)&#x27;;
      } else if (s.meta &amp;&amp; s.phase === &#x27;partition&#x27; &amp;&amp; idx === s.r) {
        fill = &#x27;var(--warn-bg)&#x27;;
        border = &#x27;var(--warn-border)&#x27;;
      } else {
        fill = &#x27;var(--info-bg)&#x27;;
        border = &#x27;var(--info-border)&#x27;;
      }
    }

    drawBox(svg, x, y, s.A[idx], idx, fill, border);

    if (s.phase === &#x27;partition&#x27; &amp;&amp; s.meta) {
      if (s.meta.i === idx) {
        drawPointer(svg, x + 23, y + 52, &quot;i&quot;, &quot;var(--text)&quot;);
      }
      if (s.meta.j === idx) {
        drawPointer(svg, x + 23, y - 22, &quot;j ↓&quot;, &quot;var(--warn-text)&quot;);
      }
      if (s.meta.i === s.p - 1 &amp;&amp; idx === s.p) {
        drawPointer(svg, x - 15, y + 52, &quot;i&quot;, &quot;var(--text)&quot;);
      }
    }
  }
}

function drawBox(svg, x, y, val, idx, fill, border) {
  const rect = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;rect&#x27;);
  rect.setAttribute(&#x27;x&#x27;, x); rect.setAttribute(&#x27;y&#x27;, y);
  rect.setAttribute(&#x27;width&#x27;, 46); rect.setAttribute(&#x27;height&#x27;, 38);
  rect.setAttribute(&#x27;fill&#x27;, fill); rect.setAttribute(&#x27;stroke&#x27;, border);
  rect.setAttribute(&#x27;stroke-width&#x27;, &#x27;1.5&#x27;);
  rect.setAttribute(&#x27;rx&#x27;, &#x27;6&#x27;);
  svg.appendChild(rect);

  const tIdx = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
  tIdx.setAttribute(&#x27;x&#x27;, x + 23); tIdx.setAttribute(&#x27;y&#x27;, y + 14);
  tIdx.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;); tIdx.setAttribute(&#x27;font-size&#x27;, &#x27;9&#x27;);
  tIdx.setAttribute(&#x27;fill&#x27;, &#x27;var(--text3)&#x27;);
  tIdx.textContent = `[${idx}]`;
  svg.appendChild(tIdx);

  const tVal = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
  tVal.setAttribute(&#x27;x&#x27;, x + 23); tVal.setAttribute(&#x27;y&#x27;, y + 28);
  tVal.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;); tVal.setAttribute(&#x27;font-size&#x27;, &#x27;14&#x27;); 
  tVal.setAttribute(&#x27;font-weight&#x27;, &#x27;600&#x27;);
  tVal.setAttribute(&#x27;fill&#x27;, &#x27;var(--text)&#x27;);
  tVal.textContent = val;
  svg.appendChild(tVal);
}

function drawPointer(svg, x, y, label, color) {
  const txt = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
  txt.setAttribute(&#x27;x&#x27;, x); txt.setAttribute(&#x27;y&#x27;, y);
  txt.setAttribute(&#x27;font-size&#x27;, &#x27;12&#x27;); txt.setAttribute(&#x27;font-weight&#x27;, &#x27;bold&#x27;);
  txt.setAttribute(&#x27;fill&#x27;, color); txt.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
  txt.textContent = label;
  svg.appendChild(txt);
}

function drawArrayRow(A, s){
  const row = document.getElementById(&#x27;array-row&#x27;);
  row.innerHTML = &#x27;&#x27;;
  for(let i = 1; i &lt; A.length; i++){
    const cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;cell&#x27;;
    
    if(s.fixed.includes(i) || s.phase === &#x27;done&#x27;) cell.classList.add(&#x27;cell-sorted&#x27;);
    else if(s.p &amp;&amp; i &gt;= s.p &amp;&amp; i &lt;= s.r) {
      if(s.meta &amp;&amp; i === s.r) cell.classList.add(&#x27;cell-pivot&#x27;);
      else cell.classList.add(&#x27;cell-scope&#x27;);
    }
    else cell.classList.add(&#x27;cell-normal&#x27;);

    const idxEl = document.createElement(&#x27;div&#x27;);
    idxEl.className = &#x27;cell-idx&#x27;;
    idxEl.textContent = i;
    const valEl = document.createElement(&#x27;div&#x27;);
    valEl.className = &#x27;cell-val&#x27;;
    valEl.textContent = A[i];
    cell.appendChild(idxEl);
    cell.appendChild(valEl);
    row.appendChild(cell);
  }
}

function render(){
  const s = steps[cur];
  drawVisual(s);
  drawArrayRow(s.A, s);
  document.getElementById(&#x27;desc-box&#x27;).innerHTML = s.desc;

  const phaseColors = {
    start:     &#x27;background:var(--bg3);color:var(--text2)&#x27;,
    sort:      &#x27;background:var(--info-bg);color:var(--info-text)&#x27;,
    partition: &#x27;background:var(--warn-bg);color:var(--warn-text)&#x27;,
    done:      &#x27;background:var(--success-bg);color:var(--success-text)&#x27;
  };
  const phaseNames = { start: &#x27;Início&#x27;, sort: &#x27;Divisão Quick&#x27;, partition: &#x27;Rotina Partition&#x27;, done: &#x27;Concluído!&#x27; };
  const pb = document.getElementById(&#x27;phase-label&#x27;);
  pb.style.cssText = (phaseColors[s.phase] || &#x27;&#x27;) + &#x27;;padding:3px 12px;border-radius:8px;font-size:12px;font-weight:500&#x27;;
  pb.textContent = phaseNames[s.phase] || s.phase;

  document.getElementById(&#x27;step-counter&#x27;).textContent = `Passo ${cur+1} de ${steps.length}`;
  document.getElementById(&#x27;btn-prev&#x27;).disabled = cur === 0;
  document.getElementById(&#x27;btn-next&#x27;).disabled = cur === steps.length - 1;
}

function step(d){ cur = Math.max(0, Math.min(steps.length-1, cur+d)); render(); }
function reset(){ cur = 0; render(); }

genSteps();
render();
&lt;/script&gt;
