&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Sebenta Completa: Aula 9 — Introdução aos Grafos&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Representações Computacionais, BFS, DFS, Ordenação Topológica e Componentes · IPBeja&lt;/p&gt;

  &lt;div class=&quot;nav-tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab(0)&quot;&gt;1. Estruturas &amp; Memória&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(1)&quot;&gt;2. Pesquisa em Largura (BFS)&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(2)&quot;&gt;3. Pesquisa em Profundidade (DFS)&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(3)&quot;&gt;4. Ordenação &amp; Componentes&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(4)&quot;&gt;5. Simulador Manual por Passos&lt;/button&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab0&quot; class=&quot;tab-content active&quot;&gt;
    &lt;h2&gt;Representação Estrutural de Grafos (Slides 4-9)&lt;/h2&gt;
    &lt;p&gt;Um grafo é composto por um conjunto de vértices &lt;code&gt;V&lt;/code&gt; e ramos &lt;code&gt;E&lt;/code&gt;, designado por &lt;code&gt;G = (V, E)&lt;/code&gt;. Existem duas formas padronizadas universais para o seu armazenamento computacional:&lt;/p&gt;
    
    &lt;div class=&quot;grid-2&quot;&gt;
      &lt;div class=&quot;interactive-box&quot;&gt;
        &lt;h3&gt;1. Listas de Adjacência (Slides 4, 7)&lt;/h3&gt;
        &lt;p&gt;Uma tabela &lt;code&gt;Adj&lt;/code&gt; com &lt;code&gt;|V|&lt;/code&gt; listas ligadas. Para cada vértice &lt;code&gt;u&lt;/code&gt;, a lista contém os seus vizinhos diretos.&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;Espaço em Memória:&lt;/strong&gt; &lt;code&gt;O(V + E)&lt;/code&gt;.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Ideal para:&lt;/strong&gt; Grafos &lt;strong&gt;Esparsos&lt;/strong&gt; (onde &lt;code&gt;|E| &amp;lt;&amp;lt; |V|²&lt;/code&gt;).&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Grafos Ponderados:&lt;/strong&gt; O peso &lt;code&gt;w(u, v)&lt;/code&gt; é guardado diretamente no nó da lista adjacente.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;interactive-box&quot;&gt;
        &lt;h3&gt;2. Matrizes de Adjacência (Slide 8)&lt;/h3&gt;
        &lt;p&gt;Uma matriz quadrada bidimensional &lt;code&gt;A&lt;/code&gt; de tamanho &lt;code&gt;|V| × |V|&lt;/code&gt;.&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;Espaço em Memória:&lt;/strong&gt; Estrito &lt;code&gt;Θ(V²)&lt;/code&gt;.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Ideal para:&lt;/strong&gt; Grafos &lt;strong&gt;Densos&lt;/strong&gt; (onde &lt;code&gt;|E| ≈ |V|²&lt;/code&gt;).&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Regra de Atribuição:&lt;/strong&gt; &lt;code&gt;A[i][j] = 1&lt;/code&gt; (ou o peso &lt;code&gt;w&lt;/code&gt;) se existir o ramo &lt;code&gt;(i, j)&lt;/code&gt;, e &lt;code&gt;0&lt;/code&gt; caso contrário.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h2&gt;Matriz de Incidência (Slide 9)&lt;/h2&gt;
    &lt;p&gt;Se o grafo não contiver auto-ciclos (loops no próprio vértice), pode ser representado por uma matriz &lt;code&gt;B&lt;/code&gt; de dimensão &lt;code&gt;|V| × |E|&lt;/code&gt;:&lt;/p&gt;
    &lt;pre&gt;
B[i][j] = -1  -&gt; Se o ramo j parte do vértice i
B[i][j] =  1  -&gt; Se o ramo j chega ao vértice i
B[i][j] =  0  -&gt; Caso contrário
    &lt;/pre&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab1&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Pesquisa com Prioridade à Largura — BFS (Slides 10-14)&lt;/h2&gt;
    &lt;p&gt;A partir de um vértice fonte &lt;code&gt;s&lt;/code&gt;, a BFS explora sistematicamente os ramos para descobrir todos os vértices alcançáveis, calculando de forma exata a **distância mais curta** (menor número de ramos) entre &lt;code&gt;s&lt;/code&gt; e os restantes nós. Funciona em grafos orientados e não orientados com complexidade **O(V + E)**.&lt;/p&gt;
    
    &lt;h3&gt;O Mecanismo de Cores e Estados&lt;/h3&gt;
    &lt;p&gt;Para evitar ciclos e repetições, o algoritmo atribui três cores conceituais aos nós durante a execução:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;code&gt;WHITE&lt;/code&gt;: Nó ainda não descoberto.&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;GRAY&lt;/code&gt;: Nó descoberto mas cujos vizinhos ainda não foram totalmente explorados (está na Fila).&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;BLACK&lt;/code&gt;: Nó totalmente processado e fechado.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;Pseudocódigo Padrão de Exame: BFS(G, s)&lt;/h3&gt;
    &lt;pre&gt;
BFS(G, s)
1  for each vertex u in G.V - {s}
2      u.color = WHITE
3      u.d = INF
4      u.pi = NIL
5  s.color = GRAY
6  s.d = 0
7  s.pi = NIL
8  Q = Ø
9  ENQUEUE(Q, s)
10 while Q != Ø
11     u = DEQUEUE(Q)
12     for each v in G.Adj[u]
13         if v.color == WHITE
14             v.color = GRAY
15             v.d = u.d + 1
16             v.pi = u
17             ENQUEUE(Q, v)
18     u.color = BLACK
    &lt;/pre&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab2&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Pesquisa com Prioridade à Profundidade — DFS (Slides 15-22)&lt;/h2&gt;
    &lt;p&gt;A DFS pesquisa o grafo &quot;mergulhando&quot; o mais fundo possível num caminho antes de efetuar o &lt;i&gt;backtracking&lt;/i&gt;. Produz uma floresta de árvores de pesquisa com ordem de crescimento **Θ(V + E)**.&lt;/p&gt;
    
    &lt;h3&gt;Timestamps Cruciais: d e f&lt;/h3&gt;
    &lt;p&gt;Cada vértice &lt;code&gt;u&lt;/code&gt; guarda dois registos de tempo fundamentais:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;code&gt;u.d&lt;/code&gt; (Discovery): O instante em que o nó passa de &lt;code&gt;WHITE&lt;/code&gt; para &lt;code&gt;GRAY&lt;/code&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;u.f&lt;/code&gt; (Finishing): O instante em que o nó passa de &lt;code&gt;GRAY&lt;/code&gt; para &lt;code&gt;BLACK&lt;/code&gt; após todos os seus vizinhos estarem esgotados.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;info-badge&quot;&gt;
      &lt;strong&gt;Teorema dos Parênteses (Slide 19):&lt;/strong&gt; Numa DFS, para quaisquer dois nós &lt;code&gt;u&lt;/code&gt; e &lt;code&gt;v&lt;/code&gt;, os seus intervalos de tempo &lt;code&gt;[u.d, u.f]&lt;/code&gt; e &lt;code&gt;[v.d, v.f]&lt;/code&gt; ou são **completamente disjuntos** (sem parentesco), ou estão **totalmente contidos um dentro do outro** (o que estiver contido é descendente direto ou indireto na árvore gerada).
    &lt;/div&gt;

    &lt;h3&gt;Pseudocódigo Estrutural da DFS&lt;/h3&gt;
    &lt;pre&gt;
DFS(G)
1  for each vertex u in G.V
2      u.color = WHITE
3      u.pi = NIL
4  time = 0
5  for each vertex u in G.V
6      if u.color == WHITE
7          DFS-VISIT(G, u)

DFS-VISIT(G, u)
1  time = time + 1
2  u.d = time
3  u.color = GRAY
4  for each v in G.Adj[u]
5      if v.color == WHITE
6          v.pi = u
7          DFS-VISIT(G, v)
8  u.color = BLACK
9  time = time + 1
10 u.f = time
    &lt;/pre&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab3&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Ordenação Topológica (Slides 23-26)&lt;/h2&gt;
    &lt;p&gt;A ordenação topológica de um **DAG (Grafo Orientado Acíclico)** consiste numa ordenação linear de todos os seus vértices de forma a que, se existir um ramo &lt;code&gt;(u, v)&lt;/code&gt;, então &lt;code&gt;u&lt;/code&gt; aparece obrigatoriamente antes de &lt;code&gt;v&lt;/code&gt; na sequência.&lt;/p&gt;
    
    &lt;div class=&quot;info-badge&quot;&gt;
      &lt;strong&gt;Algoritmo Prático de Exame (Slide 23):&lt;/strong&gt; &lt;br&gt;
      1. Executa-se a rotina &lt;code&gt;DFS(G)&lt;/code&gt; para computar os tempos de finalização &lt;code&gt;v.f&lt;/code&gt; de cada nó.&lt;br&gt;
      2. À medida que cada nó termina o seu processamento (fica &lt;code&gt;BLACK&lt;/code&gt;), é inserido na **frente de uma lista ligada**.&lt;br&gt;
      3. A lista resultante final é a ordenação topológica exata. Custo: &lt;strong&gt;Θ(V + E)&lt;/strong&gt;.
    &lt;/div&gt;

    &lt;h2&gt;Componentes Fortemente Conexos — SCC (Slides 27-32)&lt;/h2&gt;
    &lt;p&gt;Um Componente Fortemente Conexo de um grafo orientado é um subconjunto máximo de vértices &lt;code&gt;C ⊆ V&lt;/code&gt; onde, para qualquer par &lt;code&gt;(u, v) ∈ C&lt;/code&gt;, existem caminhos bidirecionais de &lt;code&gt;u&lt;/code&gt; para &lt;code&gt;v&lt;/code&gt; e de &lt;code&gt;v&lt;/code&gt; para &lt;code&gt;u&lt;/code&gt;.&lt;/p&gt;
    
    &lt;h3&gt;Algoritmo de Kosaraju (Slide 27):&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;Executa a &lt;code&gt;DFS(G)&lt;/code&gt; para obter os tempos &lt;code&gt;u.f&lt;/code&gt;.&lt;/li&gt;
      &lt;li&gt;Calcula o **Grafo Transposto** &lt;code&gt;Gᵀ&lt;/code&gt;, invertendo o sentido de todas as setas (Complexidade &lt;code&gt;O(V + E)&lt;/code&gt; usando listas).&lt;/li&gt;
      &lt;li&gt;Executa a &lt;code&gt;DFS(Gᵀ)&lt;/code&gt;, mas processa os nós no ciclo principal por **ordem decrescente de u.f** calculados na primeira etapa.&lt;/li&gt;
      &lt;li&gt;Cada árvore da floresta gerada nesta segunda DFS constitui um Componente Fortemente Conexo individual. Custo total: &lt;strong&gt;Θ(V + E)&lt;/strong&gt;.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab4&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Simulador de Algoritmos Manual por Passos&lt;/h2&gt;
    &lt;p&gt;Escolhe o algoritmo desejado. Utiliza os botões de controlo para **avançar** ou **recuar** os passos manualmente, permitindo analisar detalhadamente a alteração de estruturas e metadados:&lt;/p&gt;
    
    &lt;div class=&quot;interactive-box&quot;&gt;
      &lt;div class=&quot;controls&quot;&gt;
        &lt;label style=&quot;font-size:13px; font-weight:bold;&quot;&gt;Algoritmo:&lt;/label&gt;
        &lt;select id=&quot;algo-select&quot; onchange=&quot;initSimulation()&quot; style=&quot;padding:6px; border-radius:4px; border:1px solid var(--text3); background:var(--bg); color:var(--text);&quot;&gt;
          &lt;option value=&quot;BFS&quot;&gt;Pesquisa em Largura (BFS)&lt;/option&gt;
          &lt;option value=&quot;DFS&quot;&gt;Pesquisa em Profundidade (DFS)&lt;/option&gt;
        &lt;/select&gt;
        
        &lt;button class=&quot;btn&quot; id=&quot;btn-prev&quot; onclick=&quot;prevStep()&quot;&gt;← Recuar Passo&lt;/button&gt;
        &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-next&quot; onclick=&quot;nextStep()&quot;&gt;Avançar Passo →&lt;/button&gt;
        &lt;button class=&quot;btn&quot; id=&quot;btn-reset&quot; onclick=&quot;initSimulation()&quot;&gt;Resetar Algoritmo&lt;/button&gt;
      &lt;/div&gt;
      
      &lt;div id=&quot;graph-log&quot; style=&quot;font-family:monospace; font-size:13px; color:var(--info-border); margin-bottom:12px; min-height:50px; background:var(--bg); padding:10px; border-radius:4px; border:0.5px solid var(--border); line-height:1.4;&quot;&gt;
        Inicializando o sistema...
      &lt;/div&gt;

      &lt;svg class=&quot;graph-viz&quot; id=&quot;graph-svg&quot;&gt;&lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
function switchTab(idx) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b, i) =&gt; b.classList.toggle(&#x27;active&#x27;, i === idx));
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach((c, i) =&gt; c.classList.toggle(&#x27;active&#x27;, i === idx));
  if(idx === 4) initSimulation();
}

// DEFINIÇÃO DO GRAFO (NÓS E EDGES ORIENTADOS DO CADERNO DO PROFESSOR)
const nodes = [
  { id: &#x27;A&#x27;, x: 100, y: 150 },
  { id: &#x27;B&#x27;, x: 250, y: 80 },
  { id: &#x27;C&#x27;, x: 250, y: 220 },
  { id: &#x27;D&#x27;, x: 420, y: 80 },
  { id: &#x27;E&#x27;, x: 420, y: 220 },
  { id: &#x27;F&#x27;, x: 580, y: 150 }
];

const edges = [
  { from: &#x27;A&#x27;, to: &#x27;B&#x27; },
  { from: &#x27;A&#x27;, to: &#x27;C&#x27; },
  { from: &#x27;B&#x27;, to: &#x27;D&#x27; },
  { from: &#x27;C&#x27;, to: &#x27;E&#x27; },
  { from: &#x27;D&#x27;, to: &#x27;F&#x27; },
  { from: &#x27;E&#x27;, to: &#x27;F&#x27; },
  { from: &#x27;B&#x27;, to: &#x27;E&#x27; }
];

// MOTOR DE ESTADOS DA SIMULAÇÃO MANUAL
let historySteps = [];
let currentStepIndex = 0;

function initSimulation() {
  const algo = document.getElementById(&#x27;algo-select&#x27;).value;
  historySteps = [];
  currentStepIndex = 0;
  
  if (algo === &#x27;BFS&#x27;) {
    generateBFSHistory();
  } else {
    generateDFSHistory();
  }
  
  updateUI();
}

// COMPUTAÇÃO COMPLETA DA BFS PARA O HISTÓRICO DE PASSOS
function generateBFSHistory() {
  let states = {};
  nodes.forEach(n =&gt; states[n.id] = { color: &#x27;WHITE&#x27;, info: &#x27;d=INF, π=NIL&#x27; });
  
  // Passo 0: Inicialização completa de exame
  historySteps.push({
    states: JSON.parse(JSON.stringify(states)),
    log: &quot;&lt;b&gt;[Inicialização]&lt;/b&gt; Todos os nós definidos como WHITE, d=INF, π=NIL. Origem configurada no nó A.&quot;,
    activeEdge: null
  });
  
  // Passo 1: Descobrir a raiz
  states[&#x27;A&#x27;] = { color: &#x27;GRAY&#x27;, info: &#x27;d=0, π=NIL&#x27; };
  let queue = [&#x27;A&#x27;];
  historySteps.push({
    states: JSON.parse(JSON.stringify(states)),
    log: &quot;&lt;b&gt;[Origem]&lt;/b&gt; Nó A descoberto (GRAY). Distância d=0. Adicionado à Fila: Q = [A].&quot;,
    activeEdge: null
  });
  
  while(queue.length &gt; 0) {
    let u = queue.shift();
    let currentQStr = queue.join(&#x27;, &#x27;) || &#x27;Vazia&#x27;;
    historySteps.push({
      states: JSON.parse(JSON.stringify(states)),
      log: `&lt;b&gt;[Processar]&lt;/b&gt; Retirado o nó &lt;b&gt;${u}&lt;/b&gt; da Fila para explorar vizinhos. Fila atual: Q = [${currentQStr}].`,
      activeEdge: null
    });
    
    // Obter vizinhos diretos por ordem alfabética estrita
    let adj = edges.filter(e =&gt; e.from === u).map(e =&gt; e.to).sort();
    
    for(let v of adj) {
      if (states[v].color === &#x27;WHITE&#x27;) {
        states[v].color = &#x27;GRAY&#x27;;
        let dist = parseInt(states[u].info.match(/\d+/)[0]) + 1;
        states[v].info = `d=${dist}, π=${u}`;
        queue.push(v);
        
        let qStr = queue.join(&#x27;, &#x27;);
        historySteps.push({
          states: JSON.parse(JSON.stringify(states)),
          log: `&lt;b&gt;[Descoberta]&lt;/b&gt; Ramo (${u} → ${v}): Vizinho &lt;b&gt;${v}&lt;/b&gt; está WHITE! Fica GRAY, d=u.d+1 = ${dist}, pai π=${u}. Inserido na Fila: Q = [${qStr}].`,
          activeEdge: { from: u, to: v }
        });
      } else {
        historySteps.push({
          states: JSON.parse(JSON.stringify(states)),
          log: `&lt;b&gt;[Ignorado]&lt;/b&gt; Ramo (${u} → ${v}): Vizinho &lt;b&gt;${v}&lt;/b&gt; já foi descoberto (não está WHITE). Nenhuma ação necessária.`,
          activeEdge: { from: u, to: v }
        });
      }
    }
    
    states[u].color = &#x27;BLACK&#x27;;
    let finalQStr = queue.join(&#x27;, &#x27;) || &#x27;Vazia&#x27;;
    historySteps.push({
      states: JSON.parse(JSON.stringify(states)),
      log: `&lt;b&gt;[Fecho]&lt;/b&gt; Todos os vizinhos de &lt;b&gt;${u}&lt;/b&gt; foram verificados. O nó passa a &lt;b&gt;BLACK&lt;/b&gt;. Fila atual: Q = [${finalQStr}].`,
      activeEdge: null
    });
  }
}

// COMPUTAÇÃO COMPLETA DA DFS PARA O HISTÓRICO DE PASSOS
function generateDFSHistory() {
  let states = {};
  nodes.forEach(n =&gt; states[n.id] = { color: &#x27;WHITE&#x27;, info: &#x27;π=NIL&#x27; });
  
  historySteps.push({
    states: JSON.parse(JSON.stringify(states)),
    log: &quot;&lt;b&gt;[Inicialização DFS]&lt;/b&gt; Todos os vértices marcados como WHITE. Contador global de tempo = 0.&quot;,
    activeEdge: null
  });
  
  let time = 0;
  let pi = {};
  let d = {};
  let f = {};
  
  function dfsVisit(u) {
    time++;
    d[u] = time;
    states[u].color = &#x27;GRAY&#x27;;
    states[u].info = `d=${d[u]}, π=${pi[u] || &#x27;NIL&#x27;}`;
    
    historySteps.push({
      states: JSON.parse(JSON.stringify(states)),
      log: `&lt;b&gt;[DFS-VISIT]&lt;/b&gt; Entrada no nó &lt;b&gt;${u}&lt;/b&gt;. Passa a GRAY e recebe carimbo de descoberta &lt;b&gt;d=${d[u]}&lt;/b&gt;.`,
      activeEdge: null
    });
    
    let adj = edges.filter(e =&gt; e.from === u).map(e =&gt; e.to).sort();
    for(let v of adj) {
      if(states[v].color === &#x27;WHITE&#x27;) {
        pi[v] = u;
        historySteps.push({
          states: JSON.parse(JSON.stringify(states)),
          log: `&lt;b&gt;[Explorar]&lt;/b&gt; Ramo (${u} → ${v}): Nó ${v} está WHITE. Definindo pai π=${u} e avançando recursivamente.`,
          activeEdge: { from: u, to: v }
        });
        dfsVisit(v);
      } else {
        historySteps.push({
          states: JSON.parse(JSON.stringify(states)),
          log: `&lt;b&gt;[Retorno/Ciclo]&lt;/b&gt; Ramo (${u} → ${v}): Nó ${v} já se encontra visitado (estado: ${states[v].color}).`,
          activeEdge: { from: u, to: v }
        });
      }
    }
    
    time++;
    f[u] = time;
    states[u].color = &#x27;BLACK&#x27;;
    states[u].info = `d=${d[u]}/f=${f[u]}, π=${pi[u] || &#x27;NIL&#x27;}`;
    
    historySteps.push({
      states: JSON.parse(JSON.stringify(states)),
      log: `&lt;b&gt;[Finalização]&lt;/b&gt; Backtracking completo em &lt;b&gt;${u}&lt;/b&gt;. Passa a &lt;b&gt;BLACK&lt;/b&gt; com tempo de fecho &lt;b&gt;f=${f[u]}&lt;/b&gt;.`,
      activeEdge: null
    });
  }
  
  for(let n of nodes.map(nod =&gt; nod.id).sort()) {
    if(states[n].color === &#x27;WHITE&#x27;) {
      historySteps.push({
        states: JSON.parse(JSON.stringify(states)),
        log: `&lt;b&gt;[Ciclo Principal]&lt;/b&gt; Vértice raiz &lt;b&gt;${n}&lt;/b&gt; está WHITE. Disparando varrimento em profundidade.`,
        activeEdge: null
      });
      dfsVisit(n);
    }
  }
}

// CONTROLADORES DE PASSOS DA INTERFACE (MECÂNICA IGUAL ÀS SEBENTAS ANTIGAS)
function nextStep() {
  if (currentStepIndex &lt; historySteps.length - 1) {
    currentStepIndex++;
    updateUI();
  }
}

function prevStep() {
  if (currentStepIndex &gt; 0) {
    currentStepIndex--;
    updateUI();
  }
}

function updateUI() {
  const currentSnapshot = historySteps[currentStepIndex];
  if (!currentSnapshot) return;
  
  // Atualizar Log Informativo superior
  document.getElementById(&#x27;graph-log&#x27;).innerHTML = `Passo [${currentStepIndex + 1} / ${historySteps.length}]: ${currentSnapshot.log}`;
  
  // Bloqueio inteligente de botões nas extremidades
  document.getElementById(&#x27;btn-prev&#x27;).disabled = (currentStepIndex === 0);
  document.getElementById(&#x27;btn-next&#x27;).disabled = (currentStepIndex === historySteps.length - 1);
  
  renderGraphSVG(currentSnapshot.states, currentSnapshot.activeEdge);
}

// RENDERIZADOR DINÂMICO DO GRAFO ORIENTADO VIA SVG
function renderGraphSVG(currentNodeStates, activeEdge) {
  const svg = document.getElementById(&#x27;graph-svg&#x27;);
  svg.innerHTML = &#x27;&#x27;;
  
  // Desenhar todas as linhas de ligação (Ramos/Edges)
  edges.forEach(edge =&gt; {
    const src = nodes.find(n =&gt; n.id === edge.from);
    const dst = nodes.find(n =&gt; n.id === edge.to);
    
    const angle = Math.atan2(dst.y - src.y, dst.x - src.x);
    const x1 = src.x + 18 * Math.cos(angle);
    const y1 = src.y + 18 * Math.sin(angle);
    const x2 = dst.x - 22 * Math.cos(angle);
    const y2 = dst.y - 22 * Math.sin(angle);

    const line = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;line&quot;);
    line.setAttribute(&quot;class&quot;, &quot;edge&quot;);
    line.setAttribute(&quot;x1&quot;, x1);
    line.setAttribute(&quot;y1&quot;, y1);
    line.setAttribute(&quot;x2&quot;, x2);
    line.setAttribute(&quot;y2&quot;, y2);
    
    // Altera a cor se for o ramo sob análise do algoritmo neste passo
    if (activeEdge &amp;&amp; activeEdge.from === edge.from &amp;&amp; activeEdge.to === edge.to) {
      line.setAttribute(&quot;stroke&quot;, &quot;#dc3545&quot;); // Vermelho vivo para destaque
    } else {
      line.setAttribute(&quot;stroke&quot;, &quot;var(--text3)&quot;);
    }
    
    // Adicionar ponta de seta orientada (básica e nativa em coordenadas)
    svg.appendChild(line);
    
    let arrX = x2 - 8 * Math.cos(angle - Math.PI/6);
    let arrY = y2 - 8 * Math.sin(angle - Math.PI/6);
    let arrowLine1 = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;line&quot;);
    arrowLine1.setAttribute(&quot;x1&quot;, x2); arrowLine1.setAttribute(&quot;y1&quot;, y2);
    arrowLine1.setAttribute(&quot;x2&quot;, arrX); arrowLine1.setAttribute(&quot;y2&quot;, arrY);
    arrowLine1.setAttribute(&quot;stroke&quot;, activeEdge &amp;&amp; activeEdge.from === edge.from &amp;&amp; activeEdge.to === edge.to ? &quot;#dc3545&quot; : &quot;var(--text3)&quot;);
    arrowLine1.setAttribute(&quot;stroke-width&quot;, &quot;2&quot;);
    svg.appendChild(arrowLine1);
  });

  // Desenhar as esferas dos Vértices e os rótulos de dados
  nodes.forEach(node =&gt; {
    const g = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;g&quot;);
    g.setAttribute(&quot;class&quot;, &quot;node&quot;);
    
    const circle = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;circle&quot;);
    circle.setAttribute(&quot;cx&quot;, node.x);
    circle.setAttribute(&quot;cy&quot;, node.y);
    circle.setAttribute(&quot;r&quot;, &quot;18&quot;);
    
    let nState = currentNodeStates[node.id] || { color: &#x27;WHITE&#x27;, info: &#x27;&#x27; };
    
    // Cores de estado da convenção do livro/slides do professor
    if (nState.color === &#x27;BLACK&#x27;) {
      circle.setAttribute(&quot;fill&quot;, &quot;#212529&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;#000000&quot;);
    } else if (nState.color === &#x27;GRAY&#x27;) {
      circle.setAttribute(&quot;fill&quot;, &quot;#6c757d&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;#495057&quot;);
    } else {
      circle.setAttribute(&quot;fill&quot;, &quot;var(--bg)&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;var(--text)&quot;);
    }
    
    const text = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    text.setAttribute(&quot;x&quot;, node.x);
    text.setAttribute(&quot;y&quot;, node.y);
    text.setAttribute(&quot;fill&quot;, nState.color === &#x27;WHITE&#x27; ? &quot;var(--text)&quot; : &quot;#ffffff&quot;);
    text.textContent = node.id;

    // Rótulo metadados inferior do nó (d, f, pi)
    const label = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    label.setAttribute(&quot;x&quot;, node.x);
    label.setAttribute(&quot;y&quot;, node.y + 32);
    label.setAttribute(&quot;class&quot;, &quot;edge-label&quot;);
    label.setAttribute(&quot;text-anchor&quot;, &quot;middle&quot;);
    label.setAttribute(&quot;fill&quot;, &quot;var(--info-border)&quot;);
    label.textContent = nState.info;
    
    g.appendChild(label);
    g.appendChild(circle);
    g.appendChild(text);
    svg.appendChild(g);
  });
}

// Inicializar na primeira abertura de janela
window.onload = () =&gt; { initSimulation(); };
&lt;/script&gt;

&lt;style&gt;

&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Sebenta Completa: Aula 10 — Árvores de Envergadura Mínima&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Algoritmos Gulosos, Algoritmo de Kruskal e Algoritmo de Prim · IPBeja&lt;/p&gt;

  &lt;div class=&quot;nav-tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab(0)&quot;&gt;1. Definições Gerais&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(1)&quot;&gt;2. Algoritmo de Kruskal&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(2)&quot;&gt;3. Algoritmo de Prim&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(3)&quot;&gt;4. Simulador Oficial por Passos&lt;/button&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab0&quot; class=&quot;tab-content active&quot;&gt;
    &lt;h2&gt;Problema da Árvore de Envergadura Mínima (Slides 2-5)&lt;/h2&gt;
    &lt;p&gt;Dado um grafo conexo não orientado &lt;code&gt;G = (V, E)&lt;/code&gt;, onde cada ramo &lt;code&gt;(u, v) ∈ E&lt;/code&gt; possui um peso associado &lt;code&gt;w(u, v)&lt;/code&gt;, o objetivo é encontrar um subconjunto acíclico &lt;code&gt;T ⊆ E&lt;/code&gt; que ligue todos os vértices e cujo peso total seja mínimo:&lt;/p&gt;
    &lt;pre&gt;w(T) = ∑ w(u, v) sobre todos os ramos em T&lt;/pre&gt;
    
    &lt;h3&gt;Aplicações Práticas Reais (Slide 2)&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;Minimização da dimensão de interconexões em circuitos eletrónicos.&lt;/li&gt;
      &lt;li&gt;Minimização da extensão de circuitos de distribuição de água ou condutas.&lt;/li&gt;
      &lt;li&gt;Construção e otimização de redes de distribuição de energia elétrica com menor custo.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h2&gt;Abordagem Gulosa (Greedy) (Slide 5)&lt;/h2&gt;
    &lt;p&gt;Os algoritmos que resolvem este problema utilizam uma estratégia gulosa. Uma árvore é construída passo a passo, adicionando ramos a um conjunto estável e seguro &lt;code&gt;A&lt;/code&gt; (que representa um subconjunto de uma MST válida).&lt;/p&gt;
    &lt;div class=&quot;info-badge&quot;&gt;
      &lt;strong&gt;Regra do Ramo Seguro:&lt;/strong&gt; Um ramo &lt;code&gt;(u, v)&lt;/code&gt; é considerado &quot;seguro&quot; se, e apenas se, ao ser adicionado ao conjunto &lt;code&gt;A&lt;/code&gt;, este continua a ser um subconjunto de uma árvore de envergadura mínima.
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab1&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Algoritmo de Kruskal (Slides 6-10)&lt;/h2&gt;
    &lt;p&gt;O algoritmo de Kruskal foca-se diretamente nos ramos do grafo. Funciona encontrando um ramo de peso mínimo absoluto que une duas árvores distintas pertencentes a uma floresta que cresce até cobrir todo o grafo.&lt;/p&gt;
    
    &lt;h3&gt;Mecanismo de Conjuntos Disjuntos (Slide 6)&lt;/h3&gt;
    &lt;p&gt;Para gerir o teste de ciclos de forma altamente eficiente, utiliza-se uma estrutura de dados disjunta (&lt;i&gt;Union-Find&lt;/i&gt;):&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;code&gt;MAKE-SET(v)&lt;/code&gt;: Cria um novo conjunto cujo único membro é o vértice &lt;code&gt;v&lt;/code&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;FIND-SET(v)&lt;/code&gt;: Devolve o representante do conjunto ao qual o vértice &lt;code&gt;v&lt;/code&gt; pertence atualmente. É usado para testar se dois nós pertencem à mesma árvore (evitando a criação de ciclos).&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;UNION(u, v)&lt;/code&gt;: Une os conjuntos que contêm os vértices &lt;code&gt;u&lt;/code&gt; e &lt;code&gt;v&lt;/code&gt; num único conjunto.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;Pseudocódigo Totalmente Comentado&lt;/h3&gt;
    &lt;pre&gt;
MST-KRUSKAL(G, w)
1  A = Ø                      // Linha 1: Inicializa o conjunto A vazio, onde guardaremos os ramos da nossa MST final.
2  for each vertex v in G.V   // Linha 2: Loop para percorrer cada um dos vértices (V) presentes no Grafo (G).
3       MAKE-SET(v)           // Linha 3: Cria um conjunto disjunto individual para o nó &#x27;v&#x27;. Cada nó começa isolado na sua própria árvore.
4  sort the edges of G.E into nondecreasing order by weight w
                              // Linha 4: Ordena TODOS os ramos (E) do grafo por ordem crescente (não decrescente) com base nos seus pesos (w).
5  for each edge (u, v) in G.E, taken in nondecreasing order
                              // Linha 5: Loop principal. Avalia cada ramo (u, v) do grafo, seguindo estritamente a ordem crescente de peso.
6       if FIND-SET(u) != FIND-SET(v)
                              // Linha 6: TESTE DE CICLO. Se o representante do nó &#x27;u&#x27; for diferente do representante de &#x27;v&#x27;, não há ciclo.
7           A = A U {(u, v)}  // Linha 7: RAMO SEGURO! Como não gera ciclos, o ramo (u, v) é oficialmente adicionado ao nosso conjunto final A.
8           UNION(u, v)       // Linha 8: Funde os dois conjuntos/árvores num só, indicando que &#x27;u&#x27; e &#x27;v&#x27; agora fazem parte da mesma componente.
9  return A                   // Linha 9: Fim do algoritmo. Devolve o conjunto A contendo todas as arestas que formam a Árvore de Envergadura Mínima.
    &lt;/pre&gt;
    &lt;p&gt;&lt;strong&gt;Complexidade Computacional:&lt;/strong&gt; &lt;code&gt;O(E log V)&lt;/code&gt; devido à ordenação inicial dos ramos do grafo.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab2&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Algoritmo de Prim (Slides 11-15)&lt;/h2&gt;
    &lt;p&gt;O algoritmo de Prim funciona por agregação sucessiva de ramos a uma **árvore única** central que começa a partir de um vértice arbitrário inicial (raiz). A árvore expande-se até capturar todos os vértices do grafo.&lt;/p&gt;
    
    &lt;h3&gt;Fila de Espera com Prioridade (Slide 11)&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;Todos os vértices que ainda não se encontram inseridos na árvore em crescimento são mantidos numa **fila de prioridade mínima &lt;code&gt;Q&lt;/code&gt;**.&lt;/li&gt;
      &lt;li&gt;A chave (&lt;code&gt;v.key&lt;/code&gt;) de cada vértice representa o peso mínimo de um ramo que liga o vértice &lt;code&gt;v&lt;/code&gt; a qualquer nó que já pertença à árvore. Se não houver ligação, a chave é inicializada com &lt;code&gt;∞&lt;/code&gt; (Infinito).&lt;/li&gt;
      &lt;li&gt;O atributo &lt;code&gt;v.π&lt;/code&gt; guarda o progenitor (pai) do vértice na árvore final.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;Pseudocódigo Totalmente Comentado&lt;/h3&gt;
    &lt;pre&gt;
MST-PRIM(G, w, r)
1  for each u in G.V          // Linha 1: Loop para percorrer todos os vértices (V) do Grafo (G) para fazer a preparação inicial.
2      u.key = INF            // Linha 2: Inicializa o custo/chave de cada nó com Infinito (∞), pois ainda não conhecemos nenhuma ligação à árvore.
3      u.pi = NIL             // Linha 3: Configura o progenitor (π) de cada nó como nulo (NIL), visto que nenhum nó tem pai atribuído ainda.
4  r.key = 0                  // Linha 4: Define a chave do nó raiz &#x27;r&#x27; (por exemplo, o nó &#x27;a&#x27;). Isto garante que ele será o primeiro a ser extraído.
5  Q = G.V                    // Linha 5: Insere todos os vértices do grafo dentro de uma fila de prioridade mínima Q (onde a prioridade é o valor de &#x27;key&#x27;).
6  while Q != Ø               // Linha 6: O algoritmo corre enquanto existirem vértices na fila Q (ou seja, nós que ainda não entraram na árvore).
7      u = EXTRACT-MIN(Q)     // Linha 7: Retira de Q o vértice &#x27;u&#x27; que possui a menor chave atual. Ele entra oficialmente na estrutura da árvore.
8      for each v in G.Adj[u] // Linha 8: Loop que inspeciona cada um dos vértices vizinhos &#x27;v&#x27; que estão adjacentes (ligados diretamente) a &#x27;u&#x27;.
9          if v in Q and w(u, v) &lt; v.key
                              // Linha 9: Condição dupla: Se o vizinho &#x27;v&#x27; ainda estiver fora da árvore (em Q) E o peso do ramo (u, v) for menor que a chave atual de &#x27;v&#x27;.
10            v.pi = u        // Linha 10: ATUALIZAÇÃO DO PAI. O nó &#x27;u&#x27; passa a ser o novo progenitor (π) oficial do vértice &#x27;v&#x27;.
11            v.key = w(u, v) // Linha 11: ATUALIZAÇÃO DA CHAVE. O custo de &#x27;v&#x27; em Q é atualizado para o peso do ramo w(u, v). (Diminui a prioridade em Q).
    &lt;/pre&gt;
    &lt;p&gt;&lt;strong&gt;Complexidade Computacional:&lt;/strong&gt; &lt;code&gt;O(E log V)&lt;/code&gt; se implementado com uma fila de prioridade binária clássica. Pode atingir &lt;code&gt;O(E + V log V)&lt;/code&gt; se recorrer a uma estrutura avançada de &lt;i&gt;Fibonacci Heap&lt;/i&gt; (Slide 11).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab3&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Simulador Oficial (Grafo Real dos Slides)&lt;/h2&gt;
    &lt;p&gt;Controla a execução exata dos exemplos teóricos fornecidos nos slides. Analisa o estado das variáveis de exame em tempo real:&lt;/p&gt;
    
    &lt;div class=&quot;interactive-box&quot;&gt;
      &lt;div class=&quot;controls&quot;&gt;
        &lt;label style=&quot;font-size:13px; font-weight:bold;&quot;&gt;Algoritmo:&lt;/label&gt;
        &lt;select id=&quot;algo-select&quot; onchange=&quot;initSimulation()&quot; style=&quot;padding:6px; border-radius:4px; border:1px solid var(--text3); background:var(--bg); color:var(--text);&quot;&gt;
          &lt;option value=&quot;Kruskal&quot;&gt;Algoritmo de Kruskal (Ordenação de Ramos)&lt;/option&gt;
          &lt;option value=&quot;Prim&quot;&gt;Algoritmo de Prim (Raiz no Nó &#x27;a&#x27;)&lt;/option&gt;
        &lt;/select&gt;
        
        &lt;button class=&quot;btn&quot; id=&quot;btn-prev&quot; onclick=&quot;prevStep()&quot;&gt;← Recuar&lt;/button&gt;
        &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-next&quot; onclick=&quot;nextStep()&quot;&gt;Avançar →&lt;/button&gt;

      &lt;div id=&quot;graph-log&quot; style=&quot;font-family:monospace; font-size:13px; color:var(--info-border); margin-bottom:12px; min-height:55px; background:var(--bg); padding:10px; border-radius:4px; border:0.5px solid var(--border); line-height:1.4;&quot;&gt;

&lt;script&gt;
function switchTab(idx) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b, i) =&gt; b.classList.toggle(&#x27;active&#x27;, i === idx));
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach((c, i) =&gt; c.classList.toggle(&#x27;active&#x27;, i === idx));
  if(idx === 3) initSimulation();
}

// O GRAFO REAL E OFICIAL DOS SLIDES (9 VÉRTICES: a até i)
const nodes = [
  { id: &#x27;a&#x27;, x: 80,  y: 200 },
  { id: &#x27;b&#x27;, x: 220, y: 100 },
  { id: &#x27;c&#x27;, x: 380, y: 100 },
  { id: &#x27;d&#x27;, x: 540, y: 100 },
  { id: &#x27;e&#x27;, x: 680, y: 200 },
  { id: &#x27;f&#x27;, x: 540, y: 300 },
  { id: &#x27;g&#x27;, x: 380, y: 300 },
  { id: &#x27;h&#x27;, x: 220, y: 300 },
  { id: &#x27;i&#x27;, x: 300, y: 200 }
];

// RAMOS REAIS E VALORES DE PESO RETIRADOS DIRETAMENTE DA SEBENTA (SLIDE 7 / 12)
const edges = [
  { from: &#x27;a&#x27;, to: &#x27;b&#x27;, weight: 4 },
  { from: &#x27;a&#x27;, to: &#x27;h&#x27;, weight: 8 },
  { from: &#x27;b&#x27;, to: &#x27;h&#x27;, weight: 11 },
  { from: &#x27;b&#x27;, to: &#x27;c&#x27;, weight: 8 },
  { from: &#x27;h&#x27;, to: &#x27;i&#x27;, weight: 7 },
  { from: &#x27;h&#x27;, to: &#x27;g&#x27;, weight: 1 },
  { from: &#x27;i&#x27;, to: &#x27;c&#x27;, weight: 2 },
  { from: &#x27;i&#x27;, to: &#x27;g&#x27;, weight: 6 },
  { from: &#x27;c&#x27;, to: &#x27;g&#x27;, weight: 4 },
  { from: &#x27;c&#x27;, to: &#x27;d&#x27;, weight: 7 },
  { from: &#x27;g&#x27;, to: &#x27;f&#x27;, weight: 2 },
  { from: &#x27;d&#x27;, to: &#x27;f&#x27;, weight: 14 },
  { from: &#x27;d&#x27;, to: &#x27;e&#x27;, weight: 9 },
  { from: &#x27;f&#x27;, to: &#x27;e&#x27;, weight: 10 }
];

let historySteps = [];
let currentStepIndex = 0;

function initSimulation() {
  const algo = document.getElementById(&#x27;algo-select&#x27;).value;
  historySteps = [];
  currentStepIndex = 0;
  
  if (algo === &#x27;Kruskal&#x27;) {
    generateKruskalHistory();
  } else {
    generatePrimHistory();
  }
  
  updateUI();
}

// SIMULAÇÃO DO ALGORITMO DE KRUSKAL COM OS DADOS REAIS
function generateKruskalHistory() {
  let parentSet = {};
  nodes.forEach(n =&gt; parentSet[n.id] = n.id);
  
  function find(i) {
    if (parentSet[i] === i) return i;
    return find(parentSet[i]);
  }
  
  function union(i, j) {
    let rootI = find(i);
    let rootJ = find(j);
    parentSet[rootI] = rootJ;
  }

  let sortedEdges = [...edges].sort((a, b) =&gt; a.weight - b.weight);
  let currentMST = [];
  let nodeStates = {};
  nodes.forEach(n =&gt; nodeStates[n.id] = { info: `Conj: [${n.id}]` });

  historySteps.push({
    mstEdges: [],
    activeEdge: null,
    nodeStates: JSON.parse(JSON.stringify(nodeStates)),
    log: &quot;&lt;b&gt;[Inicialização]&lt;/b&gt; Cada nó forma o seu próprio conjunto independente. Ramos ordenados por peso para avaliação gulosa.&quot;
  });

  sortedEdges.forEach((edge) =&gt; {
    let rootFrom = find(edge.from);
    let rootTo = find(edge.to);
    
    historySteps.push({
      mstEdges: [...currentMST],
      activeEdge: edge,
      nodeStates: JSON.parse(JSON.stringify(nodeStates)),
      log: `&lt;b&gt;[Avaliação]&lt;/b&gt; A testar ramo de menor peso: &lt;b&gt;(${edge.from} — ${edge.to})&lt;/b&gt; com peso &lt;b&gt;${edge.weight}&lt;/b&gt;.`
    });

    if (rootFrom !== rootTo) {
      union(edge.from, edge.to);
      currentMST.push(edge);
      
      nodes.forEach(n =&gt; {
        nodes.forEach(n =&gt; {
          nodeStates[n.id] = { info: `Conj: [${find(n.id)}]` };
        });
      });

      historySteps.push({
        mstEdges: [...currentMST],
        activeEdge: null,
        nodeStates: JSON.parse(JSON.stringify(nodeStates)),
        log: `&lt;b&gt;[Ramo Seguro]&lt;/b&gt; Componentes disjuntos (&lt;code&gt;FIND-SET(${edge.from}) != FIND-SET(${edge.to})&lt;/code&gt;). Ramo &lt;b&gt;adicionado&lt;/b&gt;.`
      });
    } else {
      historySteps.push({
        mstEdges: [...currentMST],
        activeEdge: null,
        nodeStates: JSON.parse(JSON.stringify(nodeStates)),
        log: `&lt;b&gt;[Rejeitado / Ciclo]&lt;/b&gt; Ambos pertencem ao conjunto &lt;code&gt;${rootFrom}&lt;/code&gt;. Ignorado para evitar ciclos.`
      });
    }
  });

  historySteps.push({
    mstEdges: [...currentMST],
    activeEdge: null,
    nodeStates: JSON.parse(JSON.stringify(nodeStates)),
    log: &quot;&lt;b&gt;[Concluído]&lt;/b&gt; Árvore de Envergadura Mínima de Kruskal gerada com sucesso!&quot;
  });
}

// SIMULAÇÃO DO ALGORITMO DE PRIM COM OS DADOS REAIS
function generatePrimHistory() {
  let inMST = new Set();
  let keys = {};
  let pi = {};
  
  nodes.forEach(n =&gt; {
    keys[n.id] = Infinity;
    pi[n.id] = &#x27;NIL&#x27;;
  });
  
  // Raiz oficial dos slides do professor: nó &#x27;a&#x27;
  keys[&#x27;a&#x27;] = 0;
  
  let currentMSTEdges = [];
  
  function getNodeStates() {
    let states = {};
    nodes.forEach(n =&gt; {
      let keyText = keys[n.id] === Infinity ? &#x27;∞&#x27; : keys[n.id];
      states[n.id] = { 
        info: `k=${keyText}, π=${pi[n.id]}`,
        inTree: inMST.has(n.id)
      };
    });
    return states;
  }

  historySteps.push({
    mstEdges: [],
    activeEdge: null,
    nodeStates: getNodeStates(),
    log: &quot;&lt;b&gt;[Inicialização Prim]&lt;/b&gt; Nós com chave inicial &lt;code&gt;∞&lt;/code&gt; e pai &lt;code&gt;NIL&lt;/code&gt;. Raiz &lt;b&gt;a&lt;/b&gt; configurada com &lt;code&gt;key = 0&lt;/code&gt;.&quot;
  });

  while (inMST.size &lt; nodes.length) {
    let minKey = Infinity;
    let u = null;
    
    nodes.forEach(n =&gt; {
      if (!inMST.has(n.id) &amp;&amp; keys[n.id] &lt; minKey) {
        minKey = keys[n.id];
        u = n.id;
      }
    });

    if (u === null) break;

    inMST.add(u);
    
    if (pi[u] !== &#x27;NIL&#x27;) {
      let edgeInTree = edges.find(e =&gt; 
        (e.from === u &amp;&amp; e.to === pi[u]) || (e.from === pi[u] &amp;&amp; e.to === u)
      );
      if (edgeInTree) currentMSTEdges.push(edgeInTree);
    }

    historySteps.push({
      mstEdges: [...currentMSTEdges],
      activeEdge: null,
      nodeStates: getNodeStates(),
      log: `&lt;b&gt;[EXTRACT-MIN]&lt;/b&gt; Retirado nó &lt;b&gt;${u}&lt;/b&gt; da fila Q por ter a menor chave. Integrado na MST.`
    });

    let adjEdges = edges.filter(e =&gt; e.from === u || e.to === u);
    
    for (let edge of adjEdges) {
      let v = (edge.from === u) ? edge.to : edge.from;
      
      if (!inMST.has(v)) {
        historySteps.push({
          mstEdges: [...currentMSTEdges],
          activeEdge: edge,
          nodeStates: getNodeStates(),
          log: `&lt;b&gt;[Inspeção]&lt;/b&gt; A avaliar adjacência &lt;b&gt;(${u} — ${v})&lt;/b&gt; com peso &lt;b&gt;${edge.weight}&lt;/b&gt;.`
        });

        if (edge.weight &lt; keys[v]) {
          keys[v] = edge.weight;
          pi[v] = u;
          
          historySteps.push({
            mstEdges: [...currentMSTEdges],
            activeEdge: null,
            nodeStates: getNodeStates(),
            log: `&lt;b&gt;[Atualização]&lt;/b&gt; O peso ${edge.weight} é inferior à chave de &lt;b&gt;${v}&lt;/b&gt;. Nova key = &lt;code&gt;${edge.weight}&lt;/code&gt;, π = &lt;code&gt;${u}&lt;/code&gt;.`
          });
        } else {
          historySteps.push({
            mstEdges: [...currentMSTEdges],
            activeEdge: null,
            nodeStates: getNodeStates(),
            log: `&lt;b&gt;[Sem Alteração]&lt;/b&gt; O peso ${edge.weight} não supera a chave atual de &lt;b&gt;${v}&lt;/b&gt; (&lt;code&gt;${keys[v]}&lt;/code&gt;).`
          });
        }
      }
    }
  }

  historySteps.push({
    mstEdges: [...currentMSTEdges],
    activeEdge: null,
    nodeStates: getNodeStates(),
    log: &quot;&lt;b&gt;[Concluído]&lt;/b&gt; Todos os vértices capturados pela árvore única de Prim!&quot;
  });
}

function nextStep() {
  if (currentStepIndex &lt; historySteps.length - 1) {
    currentStepIndex++;
    updateUI();
  }
}

function prevStep() {
  if (currentStepIndex &gt; 0) {
    currentStepIndex--;
    updateUI();
  }
}

function updateUI() {
  const currentSnapshot = historySteps[currentStepIndex];
  if (!currentSnapshot) return;
  
  document.getElementById(&#x27;graph-log&#x27;).innerHTML = `Passo [${currentStepIndex + 1} / ${historySteps.length}]: ${currentSnapshot.log}`;
  document.getElementById(&#x27;btn-prev&#x27;).disabled = (currentStepIndex === 0);
  document.getElementById(&#x27;btn-next&#x27;).disabled = (currentStepIndex === historySteps.length - 1);
  
  renderGraphSVG(currentSnapshot.mstEdges, currentSnapshot.activeEdge, currentSnapshot.nodeStates);
}

function renderGraphSVG(mstEdges, activeEdge, nodeStates) {
  const svg = document.getElementById(&#x27;graph-svg&#x27;);
  svg.innerHTML = &#x27;&#x27;;
  
  edges.forEach(edge =&gt; {
    const src = nodes.find(n =&gt; n.id === edge.from);
    const dst = nodes.find(n =&gt; n.id === edge.to);
    
    const line = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;line&quot;);
    line.setAttribute(&quot;x1&quot;, src.x);
    line.setAttribute(&quot;y1&quot;, src.y);
    line.setAttribute(&quot;x2&quot;, dst.x);
    line.setAttribute(&quot;y2&quot;, dst.y);
    line.setAttribute(&quot;class&quot;, &quot;edge&quot;);
    
    let isMST = mstEdges.some(e =&gt; (e.from === edge.from &amp;&amp; e.to === edge.to) || (e.from === edge.to &amp;&amp; e.to === edge.from));
    let isActive = activeEdge &amp;&amp; ((activeEdge.from === edge.from &amp;&amp; activeEdge.to === edge.to) || (activeEdge.from === edge.to &amp;&amp; activeEdge.to === edge.from));
    
    if (isActive) {
      line.setAttribute(&quot;class&quot;, &quot;edge active-edge&quot;);
    } else if (isMST) {
      line.setAttribute(&quot;class&quot;, &quot;edge mst-edge&quot;);
    } else {
      line.setAttribute(&quot;stroke&quot;, &quot;var(--border2)&quot;);
    }
    svg.appendChild(line);

    const textX = (src.x + dst.x) / 2;
    const textY = (src.y + dst.y) / 2 - 6;
    const text = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    text.setAttribute(&quot;x&quot;, textX);
    text.setAttribute(&quot;y&quot;, textY);
    text.setAttribute(&quot;class&quot;, &quot;edge-weight&quot;);
    text.setAttribute(&quot;text-anchor&quot;, &quot;middle&quot;);
    text.textContent = edge.weight;
    svg.appendChild(text);
  });

  nodes.forEach(node =&gt; {
    const g = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;g&quot;);
    g.setAttribute(&quot;class&quot;, &quot;node&quot;);
    
    const circle = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;circle&quot;);
    circle.setAttribute(&quot;cx&quot;, node.x);
    circle.setAttribute(&quot;cy&quot;, node.y);
    circle.setAttribute(&quot;r&quot;, &quot;18&quot;);
    
    let nState = nodeStates[node.id] || { info: &#x27;&#x27;, inTree: false };
    
    if (nState.inTree) {
      circle.setAttribute(&quot;fill&quot;, &quot;var(--success-bg)&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;var(--success-border)&quot;);
    } else {
      circle.setAttribute(&quot;fill&quot;, &quot;var(--bg)&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;var(--text)&quot;);
    }
    
    const text = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    text.setAttribute(&quot;x&quot;, node.x);
    text.setAttribute(&quot;y&quot;, node.y);
    text.setAttribute(&quot;fill&quot;, &quot;var(--text)&quot;);
    text.textContent = node.id;

    const label = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    label.setAttribute(&quot;x&quot;, node.x);
    label.setAttribute(&quot;y&quot;, node.y + 32);
    label.setAttribute(&quot;class&quot;, &quot;edge-weight&quot;);
    label.setAttribute(&quot;text-anchor&quot;, &quot;middle&quot;);
    label.setAttribute(&quot;fill&quot;, &quot;var(--info-border)&quot;);
    label.textContent = nState.info;
    
    g.appendChild(label);
    g.appendChild(circle);
    g.appendChild(text);
    svg.appendChild(g);
  });
}

window.onload = () =&gt; { initSimulation(); };

&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Sebenta Explicativa: Aula 11 — Caminhos Mais Curtos&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Análise aprofundada dos mecanismos de Grafos Orientados e Ponderados · IPBeja&lt;/p&gt;

  &lt;div class=&quot;nav-tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab(0)&quot;&gt;1. O Mecanismo da Relaxação&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(1)&quot;&gt;2. Algoritmo de Dijkstra&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(2)&quot;&gt;3. Algoritmo de Bellman-Ford&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(3)&quot;&gt;4. Simulador Visual por Passos&lt;/button&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab0&quot; class=&quot;tab-content active&quot;&gt;
    &lt;h2&gt;Como funciona de verdade a Relaxação? (Slides 12-13)&lt;/h2&gt;
    &lt;p&gt;Para qualquer algoritmo de caminhos mais curtos, o grafo orientado guarda duas propriedades dinâmicas em cada vértice &lt;code&gt;v&lt;/code&gt;:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;code&gt;v.d&lt;/code&gt;: A &lt;b&gt;estimativa atual&lt;/b&gt; do custo total desde a origem até ao nó. Começa a infinito (&lt;code&gt;∞&lt;/code&gt;) porque ainda não conhecemos caminhos.&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;v.π&lt;/code&gt;: O nó &lt;b&gt;antecessor imediato&lt;/b&gt; (progenitor) que nos levou até lá pelo caminho mais barato descoberto até ao momento.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;block-info&quot;&gt;
      &lt;strong&gt;O Bloco de Decisão Executável:&lt;/strong&gt;&lt;br&gt;
      Quando avaliamos uma aresta que sai de &lt;code&gt;u&lt;/code&gt; em direção a &lt;code&gt;v&lt;/code&gt; com peso &lt;code&gt;w&lt;/code&gt;, fazemos uma pergunta matemática:&lt;br&gt;
      &lt;span style=&quot;font-family: monospace; display:block; margin-top:5px;&quot;&gt;
        &lt;b&gt;Se&lt;/b&gt; (Custo acumulado em u + Peso da aresta) &lt;b&gt;for MENOR que&lt;/b&gt; (Custo atual registado em v)&lt;br&gt;
        &lt;b&gt;Então&lt;/b&gt; atualizamos o nó v!
      &lt;/span&gt;
    &lt;/div&gt;

    &lt;h3&gt;A Função de Inicialização Base&lt;/h3&gt;
    &lt;p&gt;Antes de aplicar qualquer um dos algoritmos, o grafo tem obrigatoriamente de correr uma rotina para limpar dados antigos (&lt;code&gt;INITIALIZE-SINGLE-SOURCE&lt;/code&gt;):&lt;/p&gt;
    &lt;pre&gt;
INITIALIZE-SINGLE-SOURCE(G, s)
1  for each vertex v in G.V
2      v.d = INFINITY
3      v.π = NIL
4  s.d = 0   // A origem custa zero para chegar a ela própria!&lt;/pre&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab1&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Algoritmo de Dijkstra (Slides 21-24)&lt;/h2&gt;
    &lt;p&gt;É um algoritmo &lt;b&gt;guloso (greedy)&lt;/b&gt;. Ele escolhe sempre o nó em aberto que tem a menor estimativa de distância acumulada.&lt;/p&gt;
    
    &lt;div class=&quot;block-info&quot; style=&quot;background:#fff5f5; color:#c92a2a; border-left-color:#e03131;&quot;&gt;
      &lt;strong&gt;Restrição Crítica de Exame:&lt;/strong&gt; Dijkstra assume obrigatoriamente que as ponderações de todas as arestas são &lt;b&gt;não-negativas&lt;/b&gt; (&lt;code&gt;w(u, v) ≥ 0&lt;/code&gt;). Se o grafo tiver um peso negativo, o algoritmo falha porque fecha os nós permanentemente impossibilitando a sua reavaliação.&lt;br&gt;&lt;br&gt;
      &lt;strong&gt;Nota sobre esta simulação:&lt;/strong&gt; Observe como o Dijkstra falha academicamente neste grafo ao tentar processar as arestas com pesos negativos. Ele fecha o nó &lt;code&gt;T&lt;/code&gt; prematuramente e não consegue encontrar o caminho mais curto real que passa por &lt;code&gt;Y&lt;/code&gt;.
    &lt;/div&gt;

    &lt;h3&gt;Pseudocódigo Padrão&lt;/h3&gt;
    &lt;pre&gt;
DIJKSTRA(G, w, s)
1  INITIALIZE-SINGLE-SOURCE(G, s)
2  S = Ø          // Conjunto de nós com caminho final definitivo fechado
3  Q = G.V        // Fila de prioridade com todos os nós do grafo
4  while Q != Ø
5      u = EXTRACT-MIN(Q)  // Tira o nó com o menor &#x27;d&#x27; atual
6      S = S U {u}
7      for each vertex v in G.Adj[u]
8          RELAX(u, v, w)  // Tenta otimizar os vizinhos diretos&lt;/pre&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab2&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Algoritmo de Bellman-Ford (Slides 13-16)&lt;/h2&gt;
    &lt;p&gt;Ao contrário do Dijkstra, o Bellman-Ford é robusto: ele **suporta arestas com pesos negativos**.&lt;/p&gt;
    
    &lt;h3&gt;Como funciona o mecanismo de repetição?&lt;/h3&gt;
    &lt;p&gt;Em vez de usar uma fila inteligente, ele adota a força bruta organizada: passa por **todas** as arestas do grafo e tenta relaxá-las. Faz este ciclo completo no máximo &lt;code&gt;|V| - 1&lt;/code&gt; vezes. No simulador, adicionámos uma verificação prática: se uma passagem completa não alterar nenhum nó, o algoritmo pode parar mais cedo pois os valores já estabilizaram.&lt;/p&gt;

    &lt;h3&gt;Deteção de Ciclos Negativos&lt;/h3&gt;
    &lt;p&gt;No final das passagens, o algoritmo faz um último varrimento de validação. Se encontrar alguma aresta que **ainda permita reduzir o custo**, significa que existe um ciclo infinito de perda de peso (um ciclo negativo), tornando impossível determinar uma solução estável.&lt;/p&gt;
    &lt;pre&gt;
BELLMAN-FORD(G, w, s)
1  INITIALIZE-SINGLE-SOURCE(G, s)
2  for i = 1 to |G.V| - 1
3      for each edge (u, v) in G.E
4          RELAX(u, v, w)
5  for each edge (u, v) in G.E
6      if v.d &gt; u.d + w(u, v)
7          return FALSE  // Detetou Ciclo Negativo! Solução instável.
8  return TRUE&lt;/pre&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab3&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Simulador Avançado por Passos&lt;/h2&gt;
    &lt;p&gt;Observa a mecânica real. As etiquetas por baixo dos nós seguem o padrão formal de avaliação académica: &lt;code&gt;(Custo Acumulado d, Antecessor π)&lt;/code&gt;.&lt;/p&gt;
    
    &lt;div class=&quot;interactive-box&quot;&gt;
      &lt;div class=&quot;controls&quot;&gt;
        &lt;label style=&quot;font-size:13px; font-weight:bold;&quot;&gt;Selecione o Algoritmo:&lt;/label&gt;
        &lt;select id=&quot;algo-select&quot; onchange=&quot;initSimulation()&quot;&gt;
          &lt;option value=&quot;Dijkstra&quot;&gt;Algoritmo de Dijkstra (Guloso - Expõe Falha com Negativos)&lt;/option&gt;
          &lt;option value=&quot;Bellman&quot;&gt;Algoritmo de Bellman-Ford (Suporta Negativos / Estabilização Dinâmica)&lt;/option&gt;
        &lt;/select&gt;
        
        &lt;button class=&quot;btn&quot; id=&quot;btn-prev&quot; onclick=&quot;prevStep()&quot;&gt;← Recuar&lt;/button&gt;
        &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-next&quot; onclick=&quot;nextStep()&quot;&gt;Avançar →&lt;/button&gt;
        &lt;button class=&quot;btn&quot; id=&quot;btn-reset&quot; onclick=&quot;initSimulation()&quot;&gt;Resetar&lt;/button&gt;
      &lt;/div&gt;
      
      &lt;div id=&quot;graph-log&quot; style=&quot;font-family:monospace; font-size:13.5px; min-height:65px; background:var(--bg); padding:12px; border-radius:6px; border:1px solid var(--border2); line-height:1.5; margin-bottom:1rem;&quot;&gt;
        Carregando simulador...
      &lt;/div&gt;

      &lt;svg class=&quot;graph-viz&quot; id=&quot;graph-svg&quot;&gt;
        &lt;defs&gt;
          &lt;marker id=&quot;arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;21&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto-start-reverse&quot;&gt;
            &lt;path d=&quot;M 0 1 L 10 5 L 0 9 z&quot;/&gt;
          &lt;/marker&gt;
          &lt;marker id=&quot;arrow-relaxed&quot; class=&quot;relaxed&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;21&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto-start-reverse&quot;&gt;
            &lt;path d=&quot;M 0 1 L 10 5 L 0 9 z&quot; fill=&quot;var(--success-border)&quot;/&gt;
          &lt;/marker&gt;
          &lt;marker id=&quot;arrow-active&quot; class=&quot;active&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;21&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto-start-reverse&quot;&gt;
            &lt;path d=&quot;M 0 1 L 10 5 L 0 9 z&quot; fill=&quot;#e03131&quot;/&gt;
          &lt;/marker&gt;
        &lt;/defs&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
function switchTab(idx) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b, i) =&gt; b.classList.toggle(&#x27;active&#x27;, i === idx));
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach((c, i) =&gt; c.classList.toggle(&#x27;active&#x27;, i === idx));
  if(idx === 3) initSimulation();
}

const nodes = [
  { id: &#x27;S&#x27;, x: 100, y: 180 },
  { id: &#x27;T&#x27;, x: 280, y: 80 },
  { id: &#x27;X&#x27;, x: 480, y: 80 },
  { id: &#x27;Y&#x27;, x: 280, y: 280 },
  { id: &#x27;Z&#x27;, x: 480, y: 280 }
];

const edges = [
  { from: &#x27;S&#x27;, to: &#x27;T&#x27;, weight: 6 },
  { from: &#x27;S&#x27;, to: &#x27;Y&#x27;, weight: 7 },
  { from: &#x27;T&#x27;, to: &#x27;X&#x27;, weight: 5 },
  { from: &#x27;T&#x27;, to: &#x27;Y&#x27;, weight: 8 },
  { from: &#x27;Y&#x27;, to: &#x27;T&#x27;, weight: -2 }, 
  { from: &#x27;Y&#x27;, to: &#x27;Z&#x27;, weight: 9 },
  { from: &#x27;X&#x27;, to: &#x27;T&#x27;, weight: -2 },
  { from: &#x27;Z&#x27;, to: &#x27;X&#x27;, weight: 7 },
  { from: &#x27;Z&#x27;, to: &#x27;S&#x27;, weight: 2 }
];

let historySteps = [];
let currentStepIndex = 0;

function initSimulation() {
  const algo = document.getElementById(&#x27;algo-select&#x27;).value;
  historySteps = [];
  currentStepIndex = 0;
  
  if (algo === &#x27;Dijkstra&#x27;) {
    generateDijkstraHistory();
  } else {
    generateBellmanHistory();
  }
  updateUI();
}

function generateDijkstraHistory() {
  let d = {}; let pi = {}; let settled = new Set();
  nodes.forEach(n =&gt; { d[n.id] = Infinity; pi[n.id] = &#x27;NIL&#x27;; });
  d[&#x27;S&#x27;] = 0;

  function snapshot(logText, activeE = null) {
    let states = {};
    nodes.forEach(n =&gt; { states[n.id] = { d: d[n.id], pi: pi[n.id], isSettled: settled.has(n.id) }; });
    historySteps.push({ dStates: states, activeEdge: activeE, log: logText });
  }

  snapshot(&quot;&lt;b&gt;[Rotina Inicial]&lt;/b&gt; Executado &lt;code&gt;INITIALIZE-SINGLE-SOURCE&lt;/code&gt;. Todos os nós começam com distância infinita (&lt;code&gt;d=∞&lt;/code&gt;), exceto a origem &lt;code&gt;S&lt;/code&gt;.&quot;);

  while (settled.size &lt; nodes.length) {
    let u = null; let minD = Infinity;
    nodes.forEach(n =&gt; {
      if (!settled.has(n.id) &amp;&amp; d[n.id] &lt; minD) { minD = d[n.id]; u = n.id; }
    });

    if (u === null) break;
    settled.add(u);
    snapshot(`&lt;b&gt;[EXTRACT-MIN]&lt;/b&gt; Nó &lt;b&gt;${u}&lt;/b&gt; extraído da fila por ter o menor &#x27;d&#x27; (&lt;code&gt;d=${d[u]}&lt;/code&gt;). Fica &quot;fechado&quot; no conjunto S.`);

    let adj = edges.filter(e =&gt; e.from === u);
    for (let edge of adj) {
      snapshot(`&lt;b&gt;[Análise de Ramo]&lt;/b&gt; Testando relaxação da aresta: &lt;b&gt;${edge.from} → ${edge.to}&lt;/b&gt; (peso: ${edge.weight}).`, edge);
      
      let altCost = d[u] + edge.weight;
      if (d[u] !== Infinity &amp;&amp; d[edge.to] &gt; altCost) {
        // Se o nó destino já está fechado, o Dijkstra clássico ignora ou não deveria alterá-lo.
        if (settled.has(edge.to)) {
          snapshot(`&lt;b&gt;[Aviso de Falha]&lt;/b&gt; O custo alternativo &lt;code&gt;${altCost}&lt;/code&gt; é menor que &lt;code&gt;${edge.to}.d&lt;/code&gt;, mas o nó &lt;b&gt;${edge.to}&lt;/b&gt; já está FECHADO pelo Dijkstra. Isto prova visualmente porque o Dijkstra falha com pesos negativos!`, edge);
        } else {
          d[edge.to] = altCost;
          pi[edge.to] = u;
          snapshot(`&lt;b&gt;[RELAX Efetuado]&lt;/b&gt; Novo caminho mais curto provisório! Atualizado &lt;code&gt;${edge.to}.d = ${altCost}&lt;/code&gt; via &lt;code&gt;π=${u}&lt;/code&gt;.`, edge);
        }
      } else {
        snapshot(`&lt;b&gt;[RELAX Rejeitado]&lt;/b&gt; O custo alternativo &lt;code&gt;${altCost}&lt;/code&gt; não melhora o valor atual de &lt;code&gt;${edge.to}&lt;/code&gt; (&lt;code&gt;d=${d[edge.to]}&lt;/code&gt;).`, edge);
      }
    }
  }
  snapshot(&quot;&lt;b&gt;[Concluído]&lt;/b&gt; Terminado. Note como o custo final de &lt;code&gt;T&lt;/code&gt; ficou em &lt;code&gt;6&lt;/code&gt;, quando o caminho real mais curto seria &lt;code&gt;S→Y→T&lt;/code&gt; com custo &lt;code&gt;5&lt;/code&gt;. O Dijkstra falhou!&quot;);
}

function generateBellmanHistory() {
  let d = {}; let pi = {};
  nodes.forEach(n =&gt; { d[n.id] = Infinity; pi[n.id] = &#x27;NIL&#x27;; });
  d[&#x27;S&#x27;] = 0;

  function snapshot(logText, activeE = null) {
    let states = {};
    nodes.forEach(n =&gt; { states[n.id] = { d: d[n.id], pi: pi[n.id], isSettled: false }; });
    historySteps.push({ dStates: states, activeEdge: activeE, log: logText });
  }

  snapshot(&quot;&lt;b&gt;[Inicialização]&lt;/b&gt; Configurado &lt;code&gt;s.d = 0&lt;/code&gt;. O Bellman-Ford vai iniciar as iterações estruturais.&quot;);

  for (let i = 1; i &lt;= nodes.length - 1; i++) {
    let anyChange = false;
    snapshot(`&lt;b&gt;[Início da Passagem #${i}]&lt;/b&gt; O algoritmo vai testar sequencialmente todas as arestas do grafo.`);
    
    for (let edge of edges) {
      snapshot(`&lt;b&gt;[Teste de Relax]&lt;/b&gt; Avaliando aresta: &lt;code&gt;${edge.from} → ${edge.to}&lt;/code&gt; (peso: ${edge.weight}).`, edge);
      
      if (d[edge.from] !== Infinity &amp;&amp; d[edge.to] &gt; d[edge.from] + edge.weight) {
        d[edge.to] = d[edge.from] + edge.weight;
        pi[edge.to] = edge.from;
        anyChange = true;
        snapshot(`&lt;b&gt;[Otimização]&lt;/b&gt; Passagem ${i}: Encontrado trajeto melhor para &lt;code&gt;${edge.to}&lt;/code&gt; via &lt;code&gt;${edge.from}&lt;/code&gt;. Novo custo: &lt;code&gt;d=${d[edge.to]}&lt;/code&gt;.`, edge);
      }
    }
    
    if (!anyChange) {
      snapshot(`&lt;b&gt;[Estabilização Antecipada]&lt;/b&gt; Na Passagem #${i} nenhuma aresta sofreu alterações. Todos os caminhos mínimos já foram encontrados de forma estável!`);
      break;
    }
  }

  let hasNegativeCycle = false;
  for (let edge of edges) {
    if (d[edge.from] !== Infinity &amp;&amp; d[edge.to] &gt; d[edge.from] + edge.weight) {
      hasNegativeCycle = true;
      snapshot(`&lt;b&gt;[ALERTA - CICLO NEGATIVO]&lt;/b&gt; A aresta &lt;b&gt;${edge.from} → ${edge.to}&lt;/b&gt; ainda permite relaxação! Existe um ciclo de peso negativo alcançável.`, edge);
      break;
    }
  }

  if (!hasNegativeCycle) {
    snapshot(&quot;&lt;b&gt;[Validação Final]&lt;/b&gt; Varredura de segurança concluída. Nenhuma aresta permitiu mais relaxações. Os caminhos finais estão corretos e estáveis!&quot;);
  }
}

function nextStep() { if (currentStepIndex &lt; historySteps.length - 1) { currentStepIndex++; updateUI(); } }
function prevStep() { if (currentStepIndex &gt; 0) { currentStepIndex--; updateUI(); } }

function updateUI() {
  const currentSnapshot = historySteps[currentStepIndex];
  if (!currentSnapshot) return;
  
  document.getElementById(&#x27;graph-log&#x27;).innerHTML = `&lt;b&gt;Passo ${currentStepIndex + 1} de ${historySteps.length}:&lt;/b&gt; ${currentSnapshot.log}`;
  document.getElementById(&#x27;btn-prev&#x27;).disabled = (currentStepIndex === 0);
  document.getElementById(&#x27;btn-next&#x27;).disabled = (currentStepIndex === historySteps.length - 1);
  
  renderGraphSVG(currentSnapshot.dStates, currentSnapshot.activeEdge);
}

function renderGraphSVG(dStates, activeEdge) {
  const svg = document.getElementById(&#x27;graph-svg&#x27;);
  const defs = svg.querySelector(&#x27;defs&#x27;);
  svg.innerHTML = &#x27;&#x27;;
  svg.appendChild(defs);

  // Desenhar Arestas (Todas as arestas mapeadas)
  edges.forEach(edge =&gt; {
    const src = nodes.find(n =&gt; n.id === edge.from);
    const dst = nodes.find(n =&gt; n.id === edge.to);
    
    const line = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;line&quot;);
    line.setAttribute(&quot;x1&quot;, src.x);
    line.setAttribute(&quot;y1&quot;, src.y);
    line.setAttribute(&quot;x2&quot;, dst.x);
    line.setAttribute(&quot;y2&quot;, dst.y);
    line.setAttribute(&quot;class&quot;, &quot;edge&quot;);
    
    let isActive = activeEdge &amp;&amp; activeEdge.from === edge.from &amp;&amp; activeEdge.to === edge.to;
    let isPath = dStates[edge.to] &amp;&amp; dStates[edge.to].pi === edge.from;
    
    if (isActive) {
      line.setAttribute(&quot;stroke&quot;, &quot;#e03131&quot;);
      line.setAttribute(&quot;stroke-width&quot;, &quot;3.5px&quot;);
      line.setAttribute(&quot;marker-end&quot;, &quot;url(#arrow-active)&quot;);
    } else if (isPath &amp;&amp; dStates[edge.to].d !== Infinity) {
      line.setAttribute(&quot;stroke&quot;, &quot;var(--success-border)&quot;);
      line.setAttribute(&quot;stroke-width&quot;, &quot;3px&quot;);
      line.setAttribute(&quot;marker-end&quot;, &quot;url(#arrow-relaxed)&quot;);
    } else {
      line.setAttribute(&quot;stroke&quot;, &quot;var(--text3)&quot;);
      line.setAttribute(&quot;marker-end&quot;, &quot;url(#arrow)&quot;);
    }
    svg.appendChild(line);

    const textX = (src.x + dst.x) / 2;
    const textY = (src.y + dst.y) / 2 - 8;
    const text = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    text.setAttribute(&quot;x&quot;, textX);
    text.setAttribute(&quot;y&quot;, textY);
    text.setAttribute(&quot;class&quot;, &quot;edge-weight&quot;);
    text.setAttribute(&quot;text-anchor&quot;, &quot;middle&quot;);
    text.textContent = edge.weight;
    svg.appendChild(text);
  });

  // Desenhar Nós
  nodes.forEach(node =&gt; {
    const g = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;g&quot;);
    g.setAttribute(&quot;class&quot;, &quot;node&quot;);
    
    const circle = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;circle&quot;);
    circle.setAttribute(&quot;cx&quot;, node.x);
    circle.setAttribute(&quot;cy&quot;, node.y);
    circle.setAttribute(&quot;r&quot;, &quot;18&quot;);
    
    let nState = dStates[node.id] || { d: Infinity, pi: &#x27;NIL&#x27;, isSettled: false };
    
    if (nState.isSettled) {
      circle.setAttribute(&quot;fill&quot;, &quot;var(--success-bg)&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;var(--success-border)&quot;);
    } else {
      circle.setAttribute(&quot;fill&quot;, &quot;var(--bg)&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;var(--text)&quot;);
    }
    
    const text = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    text.setAttribute(&quot;x&quot;, node.x);
    text.setAttribute(&quot;y&quot;, node.y);
    text.setAttribute(&quot;fill&quot;, &quot;var(--text)&quot;);
    text.textContent = node.id;

    const label = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    label.setAttribute(&quot;x&quot;, node.x);
    label.setAttribute(&quot;y&quot;, node.y + 32);
    label.setAttribute(&quot;class&quot;, &quot;edge-weight&quot;);
    label.setAttribute(&quot;text-anchor&quot;, &quot;middle&quot;);
    label.setAttribute(&quot;fill&quot;, &quot;var(--info-border)&quot;);
    
    let distText = nState.d === Infinity ? &#x27;∞&#x27; : nState.d;
    label.textContent = `(${distText}, ${nState.pi})`;
    
    g.appendChild(label);
    g.appendChild(circle);
    g.appendChild(text);
    svg.appendChild(g);
  });
}

window.onload = () =&gt; { initSimulation(); };
&lt;/script&gt;
&lt;/body&gt;

      title="Caminhos Mais Curtos"></iframe>
  </section>

  </main>
</div>

<script>
const items = [{"id": "1-insertion-sort", "short": "Insertion Sort"}, {"id": "2-merge-sort", "short": "Merge Sort"}, {"id": "3-heap", "short": "Heap Sort"}, {"id": "4-quick-sort", "short": "Quick Sort"}, {"id": "5-conjuntos-dinamicos", "short": "Conjuntos Dinâmicos"}, {"id": "6-hash-tables", "short": "Hash Tables"}, {"id": "7-arvores-pesquisa-binarias", "short": "Árvores BST"}, {"id": "8-desbalanceadas-red-black", "short": "Árvores Red-Black"}, {"id": "9-introducao-grafos", "short": "Introdução a Grafos"}, {"id": "10-arvores-envergadura-minima", "short": "Envergadura Mínima"}, {"id": "11-caminhos-curtos-grafos", "short": "Caminhos Mais Curtos"}];

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const sec = document.getElementById('sec-' + id);
  if (sec) sec.style.display = 'flex';
  const navBtn = document.getElementById('nav-' + id);
  if (navBtn) navBtn.classList.add('active');
  const item = items.find(x => x.id === id);
  if (item) document.getElementById('mobile-title').textContent = item.short;
  closeSidebar();
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
</script>
