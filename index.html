&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Sebenta Teórico-Prática: Aula 5 — Conjuntos Dinâmicos&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Estruturas de Dados Lineares e Alocação de Memória · IPBeja · Resumo para Estudo&lt;/p&gt;

  &lt;div class=&quot;nav-tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab(0)&quot;&gt;1. Dicionários e Operações&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(1)&quot;&gt;2. Pilhas (LIFO)&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(2)&quot;&gt;3. Filas (FIFO)&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(3)&quot;&gt;4. Listas, Memória e Árvores&lt;/button&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab0&quot; class=&quot;tab-content active&quot;&gt;
    &lt;h2&gt;Conjuntos Matemáticos vs. Informáticos&lt;/h2&gt;
    &lt;p&gt;Na matemática pura, os conjuntos são estáticos e imutáveis. Em informática a conversa é outra: os algoritmos manipulam dados que mudam a toda a hora, crescendo ou encolhendo conforme os utilizadores adicionam ou removem coisas. A esses conjuntos que variam em tempo de execução chamamos &lt;strong&gt;Conjuntos Dinâmicos&lt;/strong&gt;.&lt;/p&gt;
    
    &lt;h2&gt;As Duas Categorias de Operações&lt;/h2&gt;
    &lt;p&gt;Qualquer operação que lances sobre uma estrutura de dados recai sempre numa destas duas categorias:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Consultas (Queries):&lt;/strong&gt; São operações de leitura pura. Não alteram rigorosamente nada no conjunto. &lt;br&gt;👉 Exemplos: &lt;code&gt;SEARCH(S, k)&lt;/code&gt;, &lt;code&gt;MINIMUM(S)&lt;/code&gt;, &lt;code&gt;MAXIMUM(S)&lt;/code&gt;, &lt;code&gt;SUCCESSOR(S, x)&lt;/code&gt; e &lt;code&gt;PREDECESSOR(S, x)&lt;/code&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Modificações (Modifying Operations):&lt;/strong&gt; Estas alteram fisicamente o conteúdo ou o tamanho da estrutura em memória. &lt;br&gt;👉 Exemplos: &lt;code&gt;INSERT(S, x)&lt;/code&gt; e &lt;code&gt;DELETE(S, x)&lt;/code&gt;.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h2&gt;Dicionários e Elementos Satélite (Termos de Exame)&lt;/h2&gt;
    &lt;div class=&quot;concept-card&quot;&gt;
      &lt;p&gt;&lt;strong&gt;O que é um Dicionário em EDA?&lt;/strong&gt; É um conjunto dinâmico que suporta apenas as três operações mais básicas e essenciais: &lt;code&gt;INSERT&lt;/code&gt;, &lt;code&gt;DELETE&lt;/code&gt; e &lt;code&gt;SEARCH&lt;/code&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;info-badge&quot;&gt;
      &lt;strong&gt;Chave vs. Dados Satélite:&lt;/strong&gt; Geralmente, pesquisamos elementos usando um identificador único chamado &lt;strong&gt;Chave (Key)&lt;/strong&gt;. Mas os objetos trazem carga útil atrás deles! Toda a informação extra associada a essa chave chama-se &lt;strong&gt;Dados Satélite (Satellite Data)&lt;/strong&gt;. Se precisarmos de mover o elemento, os dados satélite movem-se com a chave.
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab1&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Pilhas e a Política LIFO (Last-In, First-Out)&lt;/h2&gt;
    &lt;p&gt;Numa pilha (Stack), o último elemento a entrar é obrigatoriamente o primeiro a ser retirado (pensa numa pilha de pratos). O ponteiro crucial aqui chama-se &lt;code&gt;S.top&lt;/code&gt;, que guarda o índice do elemento que está mesmo no topo da pilha.&lt;/p&gt;
    
    &lt;div class=&quot;danger-badge&quot;&gt;
      &lt;strong&gt;⚠️ Cuidado com as Condições de Limite (Erros de Execução):&lt;/strong&gt;
      &lt;br&gt;• &lt;strong&gt;Stack Overflow:&lt;/strong&gt; Acontece quando tentas empilhar (&lt;code&gt;PUSH&lt;/code&gt;) um elemento, mas a tabela já atingiu o limite máximo de tamanho de alocação (&lt;code&gt;S.top &amp;gt; S.length&lt;/code&gt;).
      &lt;br&gt;• &lt;strong&gt;Stack Underflow:&lt;/strong&gt; Acontece quando tentas desempilhar (&lt;code&gt;POP&lt;/code&gt;) um elemento de uma pilha que está completamente vazia (&lt;code&gt;S.top == 0&lt;/code&gt;).
    &lt;/div&gt;

    &lt;div class=&quot;interactive-box&quot;&gt;
      &lt;h3&gt;Simulador de Pilha com Algoritmos Associados&lt;/h3&gt;
      &lt;p style=&quot;font-size:13px; color:var(--text2);&quot;&gt;Brinca com os botões PUSH/POP e vê o ponteiro &lt;code&gt;S.top&lt;/code&gt; (Base 1) a deslocar-se a par dos algoritmos teóricos abaixo.&lt;/p&gt;
      
      &lt;div class=&quot;controls&quot;&gt;
        &lt;input type=&quot;number&quot; id=&quot;stack-input&quot; value=&quot;42&quot; style=&quot;width:65px; padding:6px; border-radius:4px; border:1px solid var(--text3); font-weight:bold; text-align:center;&quot;&gt;
        &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;pushStack()&quot;&gt;STACK-EMPTY? / PUSH&lt;/button&gt;
        &lt;button class=&quot;btn&quot; onclick=&quot;popStack()&quot;&gt;POP&lt;/button&gt;
        &lt;span id=&quot;stack-status&quot; style=&quot;font-size:13px; font-weight:bold; color:var(--warn-border);&quot;&gt;&lt;/span&gt;
      &lt;/div&gt;

      &lt;div class=&quot;visual-array&quot; id=&quot;stack-visual&quot;&gt;&lt;/div&gt;

      &lt;div class=&quot;grid-layout&quot;&gt;
        &lt;div class=&quot;code-static&quot;&gt;
          &lt;strong&gt;STACK-EMPTY(S)&lt;/strong&gt;&lt;br&gt;
          1  if S.top == 0&lt;br&gt;
          2      return true&lt;br&gt;
          3  else return false
        &lt;/div&gt;
        &lt;div class=&quot;code-static&quot;&gt;
          &lt;strong&gt;PUSH(S, x)&lt;/strong&gt;&lt;br&gt;
          1  S.top = S.top + 1&lt;br&gt;
          2  S[S.top] = x &lt;span class=&quot;code-comment&quot;&gt;// Guarda na nova posição&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;code-static&quot; style=&quot;grid-column: 1 / -1;&quot;&gt;
          &lt;strong&gt;POP(S)&lt;/strong&gt;&lt;br&gt;
          1  if STACK-EMPTY(S)&lt;br&gt;
          2      error &quot;underflow&quot;&lt;br&gt;
          3  else S.top = S.top - 1&lt;br&gt;
          4      return S[S.top + 1]
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab2&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Filas de Espera e a Política FIFO (First-In, First-Out)&lt;/h2&gt;
    &lt;p&gt;Nas filas (Queues), quem chega primeiro é atendido e sai primeiro (como na fila do supermercado). A inserção chama-se &lt;code&gt;ENQUEUE&lt;/code&gt; e a remoção chama-se &lt;code&gt;DEQUEUE&lt;/code&gt;.&lt;/p&gt;
    
    &lt;h2&gt;A Magia da Fila Circular&lt;/h2&gt;
    &lt;p&gt;Para não desperdiçarmos memória, a fila do manual do Cormen/IPBeja é **Circular**: quando os ponteiros chegam ao fim do array, eles &quot;dão a volta&quot; e regressam ao índice 1 se houver casas vazias livres.&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;code&gt;Q.head&lt;/code&gt;: Aponta para a cabeça (o próximo elemento a ser removido).&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;Q.tail&lt;/code&gt;: Aponta para a cauda (a posição exata onde o próximo elemento **vai entrar**).&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;danger-badge&quot;&gt;
      &lt;strong&gt;Detetores de Erro na Fila:&lt;/strong&gt;
      &lt;br&gt;• Se &lt;code&gt;Q.head == Q.tail&lt;/code&gt;, significa que a fila está &lt;strong&gt;Vazia&lt;/strong&gt;. Tentar fazer Dequeue gera Underflow.
      &lt;br&gt;• Se &lt;code&gt;Q.head == Q.tail + 1&lt;/code&gt; (ou se &lt;code&gt;Q.head == 1 e Q.tail == Q.length&lt;/code&gt;), a fila está completamente &lt;strong&gt;Cheia&lt;/strong&gt;! Tentar fazer Enqueue dá Overflow.
    &lt;/div&gt;

    &lt;div class=&quot;interactive-box&quot;&gt;
      &lt;h3&gt;Simulador de Fila Circular&lt;/h3&gt;
      &lt;p style=&quot;font-size:13px; color:var(--text2);&quot;&gt;Insere elementos para veres os ponteiros a dar a volta ao array circular (Tamanho fixo = 6 casas).&lt;/p&gt;
      
      &lt;div class=&quot;controls&quot;&gt;
        &lt;input type=&quot;number&quot; id=&quot;queue-input&quot; value=&quot;99&quot; style=&quot;width:65px; padding:6px; border-radius:4px; border:1px solid var(--text3); font-weight:bold; text-align:center;&quot;&gt;
        &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;enqueueQueue()&quot;&gt;ENQUEUE(Q, x)&lt;/button&gt;
        &lt;button class=&quot;btn&quot; onclick=&quot;dequeueQueue()&quot;&gt;DEQUEUE(Q)&lt;/button&gt;
        &lt;span id=&quot;queue-status&quot; style=&quot;font-size:13px; font-weight:bold; color:var(--warn-border);&quot;&gt;&lt;/span&gt;
      &lt;/div&gt;

      &lt;div class=&quot;visual-array&quot; id=&quot;queue-visual&quot;&gt;&lt;/div&gt;

      &lt;div class=&quot;grid-layout&quot;&gt;
        &lt;div class=&quot;code-static&quot;&gt;
          &lt;strong&gt;ENQUEUE(Q, x)&lt;/strong&gt;&lt;br&gt;
          1  Q[Q.tail] = x&lt;br&gt;
          2  if Q.tail == Q.length&lt;br&gt;
          3      Q.tail = 1&lt;br&gt;
          4  else Q.tail = Q.tail + 1
        &lt;/div&gt;
        &lt;div class=&quot;code-static&quot;&gt;
          &lt;strong&gt;DEQUEUE(Q)&lt;/strong&gt;&lt;br&gt;
          1  x = Q[Q.head]&lt;br&gt;
          2  if Q.head == Q.length&lt;br&gt;
          3      Q.head = 1&lt;br&gt;
          4  else Q.head = Q.head + 1&lt;br&gt;
          5  return x
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab3&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Listas Ligadas Duplas&lt;/h2&gt;
    &lt;p&gt;Ao contrário dos arrays ordinais, numa Lista Ligada a ordem dos elementos não vem dada pelos índices da tabela, mas sim por referências de memória (ponteiros). Cada nó é uma estrutura independente com três campos:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;code&gt;x.key&lt;/code&gt;: O dado propriamente dito.&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;x.next&lt;/code&gt;: Ponteiro que salta para o elemento seguinte (vale &lt;code&gt;NIL&lt;/code&gt; se for o fim).&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;x.prev&lt;/code&gt;: Ponteiro que aponta para o elemento anterior (vale &lt;code&gt;NIL&lt;/code&gt; se for o início).&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h2&gt;Sentinelas: O Truque Limpa-Código&lt;/h2&gt;
    &lt;p&gt;Para evitar fazer verificações do tipo &lt;code&gt;if x.next == NIL&lt;/code&gt; ou &lt;code&gt;if x.prev == NIL&lt;/code&gt; a toda a hora (o que enche o código de condições lentas), usamos um objeto especial chamado &lt;strong&gt;Sentinela (Sentinel)&lt;/strong&gt;, representado por &lt;code&gt;L.nil&lt;/code&gt;.&lt;/p&gt;
    &lt;div class=&quot;info-badge&quot;&gt;
      A sentinela faz o papel de um nó &quot;dummy/fantasma&quot; intermédio que fecha a lista num anel circular. O &lt;code&gt;next&lt;/code&gt; do último elemento aponta para a sentinela, e o &lt;code&gt;prev&lt;/code&gt; do primeiro elemento aponta também para ela. Com isto, o código de inserção/remoção fica limpo, direto e muito mais rápido!
    &lt;/div&gt;

    &lt;h2&gt;Simulação de Objetos na Ausência de Ponteiros Reais&lt;/h2&gt;
    &lt;p&gt;Como lidamos com memória em computadores ou linguagens antigas que não gerem ponteiros de forma nativa? O manual aborda duas técnicas:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Arrays Múltiplos:&lt;/strong&gt; Criamos três arrays paralelos (&lt;code&gt;key[x]&lt;/code&gt;, &lt;code&gt;next[x]&lt;/code&gt;, &lt;code&gt;prev[x]&lt;/code&gt;) onde o mesmo índice &lt;code&gt;x&lt;/code&gt; acede às propriedades do mesmo objeto fictício.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Array Único Composto:&lt;/strong&gt; Guardamos tudo sequencialmente num só grande array de inteiros. Cada objeto fictício consome exatamente 3 posições consecutivas de memória (Índice $i$=chave, $i+1$=next, $i+2$=prev).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;concept-card&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Lista Livre (Free List):&lt;/strong&gt; A memória disponível que não está a ser usada por nenhum nó válido não fica ao abandono: é organizada e encadeada numa lista ligada simples própria. Fazer um &quot;new&quot; significa retirar um índice da Free List; apagar um nó significa devolvê-lo para a Free List.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h2&gt;Representação de Árvores n-árias (Descendente Esq., Irmão Dir.)&lt;/h2&gt;
    &lt;p&gt;Numa árvore binária comum, cada nó tem apenas dois apontadores fixos: &lt;code&gt;left&lt;/code&gt; e &lt;code&gt;right&lt;/code&gt;. Mas e se um pai puder ter 10, 20 ou um número indefinido de filhos? Alocar arrays fixos para cada nó seria um desperdício colossal de RAM.&lt;/p&gt;
    &lt;div class=&quot;info-badge&quot;&gt;
      &lt;strong&gt;A Solução Eficiente (Slide 39):&lt;/strong&gt; Usar a regra de ouro do algoritmo:
      &lt;br&gt;1. &lt;code&gt;x.left-child&lt;/code&gt;: Aponta única e exclusivamente para o &lt;strong&gt;primeiro filho&lt;/strong&gt; do nó (o mais à esquerda).
      &lt;br&gt;2. &lt;code&gt;x.right-sibling&lt;/code&gt;: Aponta para o seu &lt;strong&gt;irmão gémeo imediato&lt;/strong&gt; que está logo à sua direita.
      &lt;br&gt;Com apenas dois ponteiros por nó conseguimos mapear qualquer árvore complexa do universo gastando exatamente $O(n)$ de memória total estável!
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
// Lógica de navegação entre tabs
function switchTab(idx) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b, i) =&gt; b.classList.toggle(&#x27;active&#x27;, i === idx));
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach((c, i) =&gt; c.classList.toggle(&#x27;active&#x27;, i === idx));
}

// LÓGICA DO SIMULADOR DE PILHA
let stack = [12, 45, 78, null, null, null];
let topIdx = 3; // Estado Inicial S.top = 3 elementos ativos

function renderStack() {
  const container = document.getElementById(&#x27;stack-visual&#x27;);
  container.innerHTML = &#x27;&#x27;;
  for(let i = 0; i &lt; 6; i++) {
    let cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;cell&#x27;;
    if(i &lt; topIdx) cell.classList.add(&#x27;active-cell&#x27;);
    cell.innerHTML = `&lt;span class=&quot;idx&quot;&gt;${i+1}&lt;/span&gt;${stack[i] !== null ? stack[i] : &#x27;&#x27;}`;
    if(i + 1 === topIdx) {
      cell.innerHTML += `&lt;span class=&quot;ptr&quot;&gt;S.top&lt;/span&gt;`;
    }
    container.appendChild(cell);
  }
}

function pushStack() {
  const val = document.getElementById(&#x27;stack-input&#x27;).value;
  const status = document.getElementById(&#x27;stack-status&#x27;);
  status.innerText = &#x27;&#x27;;
  if(topIdx &gt;= 6) {
    status.innerText = &#x27;ERRO: STACK OVERFLOW! A tabela estourou o limite máximo.&#x27;;
    return;
  }
  stack[topIdx] = val;
  topIdx++;
  renderStack();
}

function popStack() {
  const status = document.getElementById(&#x27;stack-status&#x27;);
  status.innerText = &#x27;&#x27;;
  if(topIdx === 0) {
    status.innerText = &#x27;ERRO: STACK UNDERFLOW! Não podes remover de uma pilha vazia.&#x27;;
    return;
  }
  topIdx--;
  stack[topIdx] = null;
  renderStack();
}

// LÓGICA DO SIMULADOR DE FILA CIRCULAR
let queue = [null, 10, 20, 30, null, null];
let head = 2; // Aponta para o valor 10 (Índice humano 2)
let tail = 5; // Aponta para a casa vazia de inserção (Índice humano 5)
const Q_LEN = 6;

function renderQueue() {
  const container = document.getElementById(&#x27;queue-visual&#x27;);
  container.innerHTML = &#x27;&#x27;;
  for(let i = 0; i &lt; Q_LEN; i++) {
    let cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;cell&#x27;;
    if(queue[i] !== null) cell.classList.add(&#x27;active-cell&#x27;);
    cell.innerHTML = `&lt;span class=&quot;idx&quot;&gt;${i+1}&lt;/span&gt;${queue[i] !== null ? queue[i] : &#x27;&#x27;}`;
    
    let labels = [];
    if(i + 1 === head) labels.push(&#x27;head&#x27;);
    if(i + 1 === tail) labels.push(&#x27;tail&#x27;);
    if(labels.length &gt; 0) {
      cell.innerHTML += `&lt;span class=&quot;ptr&quot;&gt;${labels.join(&#x27; + &#x27;)}&lt;/span&gt;`;
    }
    container.appendChild(cell);
  }
}

function enqueueQueue() {
  const val = document.getElementById(&#x27;queue-input&#x27;).value;
  const status = document.getElementById(&#x27;queue-status&#x27;);
  status.innerText = &#x27;&#x27;;
  
  // Condição analítica de fila cheia circular
  if((tail === Q_LEN &amp;&amp; head === 1) || (tail + 1 === head)) {
    status.innerText = &#x27;ERRO: QUEUE OVERFLOW! Fila cheia.&#x27;;
    return;
  }
  
  queue[tail - 1] = val;
  if(tail === Q_LEN) tail = 1;
  else tail++;
  renderQueue();
}

function dequeueQueue() {
  const status = document.getElementById(&#x27;queue-status&#x27;);
  status.innerText = &#x27;&#x27;;
  
  // Condição de fila vazia
  if(head === tail &amp;&amp; queue[head - 1] === null) {
    status.innerText = &#x27;ERRO: QUEUE UNDERFLOW! Fila vazia.&#x27;;
    return;
  }
  
  queue[head - 1] = null;
  if(head === Q_LEN) head = 1;
  else head++;
  renderQueue();
}

// Arranque inicial
renderStack();
renderQueue();
&lt;/script&gt;
&lt;/body&gt;

&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Sebenta Teórico-Prática: Aula 6 — Tabelas de Dispersão&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Mapeamento Associativo, Funções de Hash e Resolução de Colisões · IPBeja&lt;/p&gt;

  &lt;div class=&quot;nav-tabs&quot;&gt;

  &lt;div id=&quot;tab0&quot; class=&quot;tab-content active&quot;&gt;
    &lt;h2&gt;Tabelas de Endereçamento Direto (Slide 4)&lt;/h2&gt;
    &lt;p&gt;Quando o universo de chaves possíveis &lt;code&gt;U&lt;/code&gt; é muito pequeno e controlado, podemos criar um array &lt;code&gt;T&lt;/code&gt; onde o valor da própria chave dita o índice exato da sua posição (ex: o elemento com a chave &lt;code&gt;k = 4&lt;/code&gt; fica guardado diretamente na célula &lt;code&gt;T[4]&lt;/code&gt;). O tempo de execução de qualquer operação aqui é perfeito: &lt;strong&gt;O(1)&lt;/strong&gt;.&lt;/p&gt;
    
    &lt;div class=&quot;danger-badge&quot;&gt;
      &lt;strong&gt;O Grande Problema Prático (Slide 6):&lt;/strong&gt; Se as chaves puderem ser números gigantes (como o número de NIF ou BI), mas na realidade só precisarmos de guardar 10 ou 20 elementos reais, criar uma tabela com capacidade para todo o universo teórico seria um desperdício monstruoso e impossível de memória RAM.
    &lt;/div&gt;
    
    &lt;h2&gt;A Solução: Tabelas de Dispersão / Hash Tables (Slide 7)&lt;/h2&gt;
    &lt;p&gt;Em vez de mapearmos a chave diretamente, passamo-la por um filtro matemático: uma &lt;strong&gt;Função de Dispersão (Hash Function)&lt;/strong&gt;, designada por &lt;code&gt;h(k)&lt;/code&gt;. Esta função recebe uma chave arbitrária do universo &lt;code&gt;U&lt;/code&gt; e reduz ou dispersa esse valor para um intervalo menor de posições correspondente ao tamanho real da nossa tabela &lt;code&gt;[0, 1, ..., m-1]&lt;/code&gt;.&lt;/p&gt;
    
    &lt;div class=&quot;info-badge&quot;&gt;
      &lt;strong&gt;⚠️ O Fenómeno Inevitável da Colisão (Slide 9):&lt;/strong&gt; Como o tamanho da tabela &lt;code&gt;m&lt;/code&gt; é significativamente menor do que o universo de chaves possíveis, haverá sempre momentos em que duas chaves diferentes vão produzir exatamente o mesmo índice (&lt;code&gt;h(k1) == h(k2)&lt;/code&gt;). Os métodos que estudamos de seguida servem exclusivamente para gerir e resolver estes conflitos!
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab1&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Funções de Dispersão Matemáticas (Slide 13 e 14)&lt;/h2&gt;
    &lt;p&gt;Uma boa função de dispersão deve aproximar-se do paradigma da &lt;strong&gt;Dispersão Uniforme Simples&lt;/strong&gt;: cada chave deve ter a mesma probabilidade de ser mapeada em qualquer uma das &lt;code&gt;m&lt;/code&gt; posições da tabela, independentemente das outras chaves já inseridas.&lt;/p&gt;
    
    &lt;h3&gt;1. O Método da Divisão (Slide 13)&lt;/h3&gt;
    &lt;p&gt;É o algoritmo mais direto e comum, baseado no resto da divisão inteira:&lt;/p&gt;
    &lt;span class=&quot;formula&quot;&gt;h(k) = k mod m&lt;/span&gt;
    &lt;p&gt;&lt;strong&gt;⚠️ Regra de Ouro para o Exame:&lt;/strong&gt; Para evitar padrões viciados nos dados, o tamanho da tabela &lt;code&gt;m&lt;/code&gt; deve ser obrigatoriamente um &lt;strong&gt;número primo&lt;/strong&gt; que não esteja excessivamente perto de nenhuma potência de 2.&lt;/p&gt;

    &lt;h3&gt;2. O Método da Multiplicação (Slide 14)&lt;/h3&gt;
    &lt;p&gt;Este método não depende tanto da escolha de &lt;code&gt;m&lt;/code&gt;. Funciona em dois passos matemáticos: primeiro multiplica-se a chave &lt;code&gt;k&lt;/code&gt; por uma constante fracionária fixa &lt;code&gt;A&lt;/code&gt; (onde $0 &lt; A &lt; 1$) e extrai-se a parte decimal desse produto. De seguida, multiplica-se esse resto decimal por &lt;code&gt;m&lt;/code&gt; e retira-se apenas a parte inteira (função chão / floor):&lt;/p&gt;
    &lt;span class=&quot;formula&quot;&gt;h(k) = ⌊m × ( (k × A) mod 1 )⌋&lt;/span&gt;
    &lt;p&gt;&lt;em&gt;Nota Teórica:&lt;/em&gt; Segundo Knuth, o valor ideal para esta constante é baseado na proporção áurea: $A \approx 0.6180339887...$&lt;/p&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab2&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Resolução de Colisões por Encadeamento (Chaining)&lt;/h2&gt;
    &lt;p&gt;No método de **Encadeamento** (Slide 10), os elementos em colisão não lutam pelo espaço das outras células da tabela. Cada célula do array &lt;code&gt;T[i]&lt;/code&gt; não guarda o registo final, mas sim um apontador para a **cabeça de uma Lista Ligada** que agrupa todos os registos que fizeram hash para esse índice.&lt;/p&gt;
    
    &lt;h2&gt;Análise de Complexidade Crítica (Slide 11 e 12)&lt;/h2&gt;
    &lt;p&gt;Para analisar estas tabelas, usamos o termo &lt;strong&gt;Fator de Carga (Load Factor)&lt;/strong&gt;, denotado por &lt;code&gt;α&lt;/code&gt;, que define a ocupação média de cada lista:&lt;/p&gt;
    &lt;span class=&quot;formula&quot;&gt;α = n / m  (onde n = número total de elementos guardados; m = tamanho do array)&lt;/span&gt;
    
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Inserção:&lt;/strong&gt; No pior caso é &lt;strong&gt;O(1)&lt;/strong&gt;, partindo do princípio de que os novos nós são anexados diretamente à cabeça della lista ligada de forma imediata.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Pesquisa (Pior Caso):&lt;/strong&gt; É &lt;strong&gt;O(n)&lt;/strong&gt;. Se todas as &lt;code&gt;n&lt;/code&gt; chaves colidirem para a mesmíssima posição, a tabela de dispersão colapsa e transforma-se numa única lista ligada gigante.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Pesquisa (Caso Médio de Sucesso):&lt;/strong&gt; O tempo de execução esperado é de &lt;strong&gt;Θ(1 + α)&lt;/strong&gt;, representando o tempo para computar a função hash mais o custo de percorrer metade della lista encadeada daquela posição.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab3&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;O que é o Endereçamento Aberto e o que é a &quot;Sondagem&quot;?&lt;/h2&gt;
    &lt;p&gt;No **Endereçamento Aberto** (Slide 21), esquece as listas ligadas. **Tudo é guardado dentro do próprio array**. Se o teu índice ideal está ocupado por outro elemento, tu não podes criar ramificações. Tens de procurar (&lt;strong&gt;sondar&lt;/strong&gt;) outra posição livre no array seguindo uma sequência estrita de passos.&lt;/p&gt;
    
    &lt;p&gt;A variável &lt;code&gt;i&lt;/code&gt; representa o número da tua tentativa: começas na tentativa &lt;code&gt;i = 0&lt;/code&gt; (a tua posição favorita). Se falhar, passas para a tentativa &lt;code&gt;i = 1&lt;/code&gt;, depois &lt;code&gt;i = 2&lt;/code&gt;, e assim por diante. As três técnicas abaixo diferem apenas em **como calculam os saltos para a próxima tentativa**.&lt;/p&gt;

    &lt;h2&gt;As 3 Técnicas de Sondagem Explicadas Sem Complicações&lt;/h2&gt;

    &lt;div class=&quot;explanation-card&quot;&gt;
      &lt;span class=&quot;badge-tech tech-linear&quot;&gt;1. Teste Linear (Linear Probing)&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;O que faz na prática:&lt;/strong&gt; Se houver colisão, ele simplesmente tenta a célula imediatamente a seguir (&lt;code&gt;+1&lt;/code&gt;, &lt;code&gt;+2&lt;/code&gt;, &lt;code&gt;+3&lt;/code&gt;...). É o equivalente a procurares um lugar para estacionar e ires avançando de um em um até veres um lugar vazio.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Como calcula (Fórmula):&lt;/strong&gt; &lt;code&gt;h(k, i) = (h&#x27;(k) + i) mod m&lt;/code&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;O Problema (Agregação Primária / Primary Clustering):&lt;/strong&gt; Como andamos de 1 em 1, criam-se blocos gigantescos de células consecutivas totalmente ocupadas. Se uma nova chave for dar a qualquer ponto desse bloco, vai ter de percorrer penosamente o bloco inteiro até chegar ao fim e encontrar uma vaga, tornando o algoritmo lento.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;explanation-card&quot;&gt;
      &lt;span class=&quot;badge-tech tech-quad&quot;&gt;2. Teste Quadrático (Quadratic Probing)&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;O que faz na prática:&lt;/strong&gt; Para evitar andar devagarinho de 1 em 1, esta técnica faz saltos que crescem de forma quadrática a cada falha. Na primeira tentativa falhada salta 1 casa, na segunda salta 4 casas, na terceira salta 9 casas, etc. A ideia é afastarmo-nos rapidamente da zona de colisão.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Como calcula (Fórmula):&lt;/strong&gt; &lt;code&gt;h(k, i) = (h&#x27;(k) + c1*i + c2*i²) mod m&lt;/code&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;O Problema (Agregação Secundária / Secondary Clustering):&lt;/strong&gt; É melhor que o linear, mas tem um defeito: duas chaves completamente diferentes que tenham o mesmo índice inicial (por exemplo, ambas dão índice 3) vão fazer **exatamente a mesma sequência de saltos idêntica** (ambas saltam para o 4, depois para o 8, etc.), criando um mini-congestionamento secundário.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;explanation-card&quot;&gt;
      &lt;span class=&quot;badge-tech tech-double&quot;&gt;3. Dispersão Dupla (Double Hashing)&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;O que faz na prática:&lt;/strong&gt; É a técnica ideal. Aqui, se houver colisão, o tamanho do teu salto é calculado por uma **segunda função hash independente (h2)**. Isso significa que o tamanho do salto é personalizado para a tua chave!&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Como calcula (Fórmula):&lt;/strong&gt; &lt;code&gt;h(k, i) = (h1(k) + i * h2(k)) mod m&lt;/code&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Porque é a melhor?&lt;/strong&gt; Imagina que a chave 14 e a chave 25 colidem na posição 3. No teste quadrático ou linear, ambas iam saltar para o mesmo sítio a seguir. Na dispersão dupla, o 14 calcula um tamanho de salto de 2 em 2 posições, enquanto o 25 calcula um tamanho de salto de 5 em 5 posições. Elas divergem imediatamente e espalham-se na tabela de forma perfeita!&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;interactive-box&quot;&gt;
      &lt;h3&gt;Simulador de Sondagens Mecânicas (m = 11 posições)&lt;/h3&gt;
      &lt;p style=&quot;font-size:13px; color:var(--text2); margin-bottom: 15px;&quot;&gt;
        Experimenta este teste típico de exame: escolhe o &lt;b&gt;Teste Linear&lt;/b&gt; e insere as chaves &lt;b&gt;11&lt;/b&gt;, &lt;b&gt;22&lt;/b&gt; e &lt;b&gt;33&lt;/b&gt; consecutivamente. Vais ver o efeito da &quot;Agregação Primária&quot; acontecer em tempo real (as células laranjas mostram os testes falhados).
      &lt;/p&gt;
      
      &lt;div class=&quot;controls&quot;&gt;
        &lt;label&gt;&lt;b&gt;Técnica de Sondagem:&lt;/b&gt;&lt;/label&gt;
        &lt;select id=&quot;hash-method&quot; onchange=&quot;resetTable()&quot; style=&quot;padding:6px; border-radius:4px; font-weight:600; background:var(--bg); color:var(--text); border:1px solid var(--border2);&quot;&gt;
          &lt;option value=&quot;linear&quot;&gt;Teste Linear: (h0(k) + i) mod 11&lt;/option&gt;
          &lt;option value=&quot;quad&quot;&gt;Teste Quadrático: (h0(k) + 1*i + 3*i²) mod 11&lt;/option&gt;
          &lt;option value=&quot;double&quot;&gt;Dispersão Dupla: (h1(k) + i*h2(k)) mod 11&lt;/option&gt;
        &lt;/select&gt;
        
        &lt;input type=&quot;number&quot; id=&quot;hash-input&quot; value=&quot;11&quot; style=&quot;width:65px; padding:6px; border-radius:4px; border:1px solid var(--text3); font-weight:bold; text-align:center;&quot;&gt;
        &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;insertHash()&quot;&gt;Inserir Chave&lt;/button&gt;
        &lt;button class=&quot;btn&quot; onclick=&quot;resetTable()&quot;&gt;Limpar Tudo&lt;/button&gt;
      &lt;/div&gt;

      &lt;div id=&quot;hash-log&quot; style=&quot;font-size:13px; color:var(--warn-border); margin-bottom:10px; font-family:monospace; min-height:20px; font-weight:600;&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;grid-table&quot; id=&quot;hash-grid&quot;&gt;&lt;/div&gt;

      &lt;div class=&quot;grid-layout&quot;&gt;
        &lt;div class=&quot;code-container&quot;&gt;
          &lt;strong&gt;HASH-INSERT(T, k)&lt;/strong&gt;
          &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  i = 0  &lt;span class=&quot;code-comment&quot;&gt;// Começamos na tentativa zero&lt;/span&gt;
2  repeat
3      q = h(k, i)  &lt;span class=&quot;code-comment&quot;&gt;// Calcula o índice p/ a chave e nº da tentativa&lt;/span&gt;
4      if T[q] == NIL  &lt;span class=&quot;code-comment&quot;&gt;// Se a célula [q] estiver vazia...&lt;/span&gt;
5          T[q] = k  &lt;span class=&quot;code-comment&quot;&gt;// ...guardamos lá a chave com sucesso!&lt;/span&gt;
6          return q  &lt;span class=&quot;code-comment&quot;&gt;// Devolvemos o índice onde ficou guardada&lt;/span&gt;
7      else 
8          i = i + 1  &lt;span class=&quot;code-comment&quot;&gt;// Colisão: passamos à próxima tentativa&lt;/span&gt;
9  until i == m  &lt;span class=&quot;code-comment&quot;&gt;// Repete até esgotar o tamanho da tabela&lt;/span&gt;
10 error &quot;hash table overflow&quot;  &lt;span class=&quot;code-comment&quot;&gt;// Tabela cheia sem vagas&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;

        &lt;div class=&quot;code-container&quot;&gt;
          &lt;strong&gt;HASH-SEARCH(T, k)&lt;/strong&gt;
          &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  i = 0  &lt;span class=&quot;code-comment&quot;&gt;// Iniciamos a busca na tentativa zero&lt;/span&gt;
2  repeat
3      q = h(k, i)  &lt;span class=&quot;code-comment&quot;&gt;// Calcula o índice esperado nesta tentativa&lt;/span&gt;
4      if T[q] == k  &lt;span class=&quot;code-comment&quot;&gt;// Encontrámos a chave na tabela!&lt;/span&gt;
5          return q  &lt;span class=&quot;code-comment&quot;&gt;// Devolvemos a posição atual dela&lt;/span&gt;
6      i = i + 1  &lt;span class=&quot;code-comment&quot;&gt;// Não era ela, passamos à próxima tentativa&lt;/span&gt;
7  until T[q] == NIL or i == m  &lt;span class=&quot;code-comment&quot;&gt;// Para se achar vazio ou testar m vezes&lt;/span&gt;
8  return NIL  &lt;span class=&quot;code-comment&quot;&gt;// Saiu do ciclo: a chave não existe&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
function switchTab(idx) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b, i) =&gt; b.classList.toggle(&#x27;active&#x27;, i === idx));
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach((c, i) =&gt; c.classList.toggle(&#x27;active&#x27;, i === idx));
}

const M = 11;
let hashTable = Array(M).fill(null);

function renderHashGrid(tested = []) {
  const grid = document.getElementById(&#x27;hash-grid&#x27;);
  grid.innerHTML = &#x27;&#x27;;
  for(let i = 0; i &lt; M; i++) {
    let cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;cell&#x27;;
    if(hashTable[i] !== null) cell.classList.add(&#x27;occupied&#x27;);
    if(tested.includes(i)) cell.classList.add(&#x27;tested&#x27;);
    
    cell.innerHTML = `&lt;span class=&quot;idx&quot;&gt;${i}&lt;/span&gt;${hashTable[i] !== null ? hashTable[i] : &#x27;&#x27;}`;
    grid.appendChild(cell);
  }
}

function resetTable() {
  hashTable = Array(M).fill(null);
  document.getElementById(&#x27;hash-log&#x27;).innerHTML = &#x27;&#x27;;
  renderHashGrid();
}

function insertHash() {
  const k = parseInt(document.getElementById(&#x27;hash-input&#x27;).value);
  if(isNaN(k)) return;
  
  const method = document.getElementById(&#x27;hash-method&#x27;).value;
  const log = document.getElementById(&#x27;hash-log&#x27;);
  log.innerHTML = &#x27;&#x27;;

  let i = 0;
  let testedIndices = [];
  let foundSlot = false;

  const h1 = k % M;
  const h2 = 1 + (k % (M - 2)); 

  while(i &lt; M) {
    let idx = 0;
    if(method === &#x27;linear&#x27;) {
      idx = (h1 + i) % M;
    } else if(method === &#x27;quad&#x27;) {
      idx = (h1 + 1 * i + 3 * i * i) % M;
    } else if(method === &#x27;double&#x27;) {
      idx = (h1 + i * h2) % M;
    }

    testedIndices.push(idx);

    if(hashTable[idx] === null) {
      hashTable[idx] = k;
      log.innerHTML = `Sucesso: Chave ${k} alocada no índice ${idx} (Tentativa i = ${i}).`;
      foundSlot = true;
      break;
    } else {
      log.innerHTML += `Colisão em [${idx}] (i=${i}) -&gt; `;
      i++;
    }
  }

  if(!foundSlot) {
    log.innerHTML = `&lt;b&gt;ERRO: HASH TABLE OVERFLOW!&lt;/b&gt; Tabela cheia para a chave ${k} após testar ${M} posições.`;
  }

  renderHashGrid(testedIndices);
}

renderHashGrid();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"

&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Sebenta Teórico-Prática: Árvores de Pesquisa Binária&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Tudo o que precisas de saber para o exame da Aula 7 (Compilado e Simplificado) · IPBeja&lt;/p&gt;

  &lt;div class=&quot;nav-tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab(0)&quot;&gt;1. Regras Secretas (Teoria)&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(1)&quot;&gt;2. Caminhar e Consultar&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(2)&quot;&gt;3. Algoritmo: Inserção&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(3)&quot;&gt;4. Algoritmo Estrutural: Remoção&lt;/button&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab0&quot; class=&quot;tab-content active&quot;&gt;
    &lt;h2&gt;O que é uma BST (Binary Search Tree)?&lt;/h2&gt;
    &lt;p&gt;É uma árvore binária onde cada nó tem, no máximo, dois filhos. A grande diferença para uma árvore comum é a sua &lt;strong&gt;Regra de Ouro Matemático (Slide 4)&lt;/strong&gt;:&lt;/p&gt;
    &lt;div class=&quot;info-badge&quot;&gt;
      Seja &lt;strong&gt;x&lt;/strong&gt; um nó qualquer da árvore. Se &lt;strong&gt;y&lt;/strong&gt; for um nó na subárvore &lt;strong&gt;esquerda&lt;/strong&gt; de x, então &lt;strong&gt;y.key &amp;le; x.key&lt;/strong&gt;. Se &lt;strong&gt;y&lt;/strong&gt; for um nó na subárvore &lt;strong&gt;direita&lt;/strong&gt; de x, então &lt;strong&gt;y.key &amp;ge; x.key&lt;/strong&gt;.
    &lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;Traduzindo para miúdos:&lt;/strong&gt; Quem se senta à esquerda do pai tem de ser mais pequeno ou igual. Quem se senta à direita tem de ser maior ou igual. Se isto for respeitado, o computador consegue pesquisar dados muito rapidamente sem ler a árvore toda.&lt;/p&gt;
    
    &lt;h2&gt;Os Atributos de Cada Nó (O que significa cada letra?)&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;x.key&lt;/strong&gt;: O valor numérico real guardado no nó (ex: 15).&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;x.p&lt;/strong&gt;: O Progenitor (Pai) do nó. Se for a Raiz da árvore, o pai é &lt;code&gt;NIL&lt;/code&gt; (vazio).&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;x.left&lt;/strong&gt;: O ponteiro para o filho da esquerda.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;x.right&lt;/strong&gt;: O ponteiro para o filho da direita.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;&lt;em&gt;Nota de Exame (Slide 5):&lt;/em&gt; A altura da árvore determina o custo de todas as operações. No melhor cenário (árvore perfeitamente equilibrada), o custo é &lt;strong&gt;O(log n)&lt;/strong&gt;. No pior cenário (árvore torta em linha reta), o custo passa a ser &lt;strong&gt;O(n)&lt;/strong&gt;, virando uma simples lista ligada!&lt;/p&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab1&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Pesquisas, Mínimos, Máximos e Caminhamentos&lt;/h2&gt;
    &lt;p&gt;O PDF aborda as rotinas fundamentais de consulta e a forma como visitamos os nós (Caminhamento em-ordem / Inorder-Tree-Walk).&lt;/p&gt;
    
    &lt;div class=&quot;controls&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-c-prev&quot; onclick=&quot;stepC(-1)&quot;&gt;← Passo Anterior&lt;/button&gt;
      &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-c-next&quot; onclick=&quot;stepC(1)&quot;&gt;Próximo Passo →&lt;/button&gt;
      &lt;button class=&quot;btn&quot; onclick=&quot;setMode(&#x27;search&#x27;)&quot;&gt;Simular: Buscar 13&lt;/button&gt;
      &lt;button class=&quot;btn&quot; onclick=&quot;setMode(&#x27;min&#x27;)&quot;&gt;Simular: Achar Mínimo&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;desc-box&quot; id=&quot;desc-c&quot;&gt;&lt;/div&gt;
    &lt;svg id=&quot;svg-c&quot; viewBox=&quot;0 0 700 240&quot;&gt;&lt;/svg&gt;

    &lt;div class=&quot;grid-layout&quot;&gt;
      &lt;div class=&quot;code-container&quot;&gt;
        &lt;strong&gt;INORDER-TREE-WALK(x) (Slide 6)&lt;/strong&gt;
        &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  if x != NIL
2      INORDER-TREE-WALK(x.left)  &lt;span class=&quot;code-comment&quot;&gt;// Visita toda a subárvore esquerda&lt;/span&gt;
3      print x.key                &lt;span class=&quot;code-comment&quot;&gt;// Imprime a chave do nó atual&lt;/span&gt;
4      INORDER-TREE-WALK(x.right) &lt;span class=&quot;code-comment&quot;&gt;// Visita toda a subárvore direita&lt;/span&gt;
&lt;span class=&quot;code-comment&quot;&gt;// Nota de exame: Imprime os elementos por ordem crescente!&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;

      &lt;div class=&quot;code-container&quot;&gt;
        &lt;strong&gt;TREE-SEARCH(x, k) (Slide 7)&lt;/strong&gt;
        &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  if x == NIL or k == x.key
2      return x                 &lt;span class=&quot;code-comment&quot;&gt;// Para se não achar ou se encontrar&lt;/span&gt;
3  if k &lt; x.key
4      return TREE-SEARCH(x.left, k)  &lt;span class=&quot;code-comment&quot;&gt;// Chave menor: vai p/ esquerda&lt;/span&gt;
5  else
6      return TREE-SEARCH(x.right, k) &lt;span class=&quot;code-comment&quot;&gt;// Chave maior: vai p/ direita&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;

      &lt;div class=&quot;code-container&quot;&gt;
        &lt;strong&gt;TREE-MINIMUM(x) (Slide 11)&lt;/strong&gt;
        &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  while x.left != NIL
2      x = x.left  &lt;span class=&quot;code-comment&quot;&gt;// Desce o máximo possível para a esquerda&lt;/span&gt;
3  return x        &lt;span class=&quot;code-comment&quot;&gt;// O nó mais à esquerda é o menor valor&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;

      &lt;div class=&quot;code-container&quot;&gt;
        &lt;strong&gt;TREE-MAXIMUM(x) (Slide 11)&lt;/strong&gt;
        &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  while x.right != NIL
2      x = x.right &lt;span class=&quot;code-comment&quot;&gt;// Desce o máximo possível para a direita&lt;/span&gt;
3  return x        &lt;span class=&quot;code-comment&quot;&gt;// O nó mais à direita é o maior valor&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab2&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Como se insere um elemento novo? (TREE-INSERT)&lt;/h2&gt;
    &lt;p&gt;Para meter um nó novo na árvore, tu &lt;strong&gt;nunca o metes no meio&lt;/strong&gt;. Tu corres a árvore desde a raiz usando dois ponteiros (o ponteiro de exploração &lt;code&gt;x&lt;/code&gt; e o ponteiro &quot;atrás do pai&quot; &lt;code&gt;y&lt;/code&gt;) até encontrares um espaço vazio (&lt;code&gt;NIL&lt;/code&gt;). É aí que ele é anexado.&lt;/p&gt;
    
    &lt;div class=&quot;controls&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-i-prev&quot; onclick=&quot;stepI(-1)&quot;&gt;← Passo Anterior&lt;/button&gt;
      &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-i-next&quot; onclick=&quot;stepI(1)&quot;&gt;Próximo Passo →&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;desc-box&quot; id=&quot;desc-i&quot;&gt;&lt;/div&gt;
    &lt;svg id=&quot;svg-i&quot; viewBox=&quot;0 0 700 240&quot;&gt;&lt;/svg&gt;

    &lt;div class=&quot;code-container&quot;&gt;
      &lt;strong&gt;TREE-INSERT(T, z) (Slide 14)&lt;/strong&gt;
      &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  y = NIL         &lt;span class=&quot;code-comment&quot;&gt;// y vai guardar o futuro pai de z&lt;/span&gt;
2  x = T.root      &lt;span class=&quot;code-comment&quot;&gt;// Começamos a varredura a partir da raiz da árvore&lt;/span&gt;
3  while x != NIL  &lt;span class=&quot;code-comment&quot;&gt;// Descemos pela árvore até bater em NIL (folha)&lt;/span&gt;
4      y = x       &lt;span class=&quot;code-comment&quot;&gt;// Guarda a posição atual de x antes dele descer&lt;/span&gt;
5      if z.key &lt; x.key
6          x = x.left   &lt;span class=&quot;code-comment&quot;&gt;// Se a nova chave for menor, caminha para a esquerda&lt;/span&gt;
7      else 
8          x = x.right  &lt;span class=&quot;code-comment&quot;&gt;// Se for maior ou igual, caminha para a direita&lt;/span&gt;
9  z.p = y         &lt;span class=&quot;code-comment&quot;&gt;// Definimos o pai de z como sendo o y encontrado&lt;/span&gt;
10 if y == NIL
11     T.root = z  &lt;span class=&quot;code-comment&quot;&gt;// Se a árvore estava vazia, z torna-se a própria raiz&lt;/span&gt;
12 else if z.key &lt; y.key
13     y.left = z  &lt;span class=&quot;code-comment&quot;&gt;// Encaixa z como filho esquerdo do pai&lt;/span&gt;
14 else 
15     y.right = z &lt;span class=&quot;code-comment&quot;&gt;// Encaixa z como filho direito do pai&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab3&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;A Remoção e a Sub-rotina TRANSPLANT&lt;/h2&gt;
    &lt;p&gt;Remover um nó &lt;strong&gt;z&lt;/strong&gt; exige gerir os ponteiros com cuidado. O professor utiliza uma função de suporte chamada &lt;code&gt;TRANSPLANT&lt;/code&gt; para substituir uma subárvore pela outra, facilitando os 3 cenários de eliminação estudados (Slide 17).&lt;/p&gt;
    
    &lt;div class=&quot;controls&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-d-prev&quot; onclick=&quot;stepD(-1)&quot;&gt;← Passo Anterior&lt;/button&gt;
      &lt;button class=&quot;btn btn-primary&quot; id=&quot;btn-d-next&quot; onclick=&quot;stepD(1)&quot;&gt;Próximo Passo →&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;desc-box&quot; id=&quot;desc-d&quot;&gt;&lt;/div&gt;
    &lt;svg id=&quot;svg-d&quot; viewBox=&quot;0 0 700 240&quot;&gt;&lt;/svg&gt;

    &lt;div class=&quot;grid-layout&quot;&gt;
      &lt;div class=&quot;code-container&quot;&gt;
        &lt;strong&gt;TRANSPLANT(T, u, v) (Slide 18)&lt;/strong&gt;
        &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  if u.p == NIL
2      T.root = v      &lt;span class=&quot;code-comment&quot;&gt;// Se u era a raiz, v passa a ser a nova raiz&lt;/span&gt;
3  else if u == u.p.left
4      u.p.left = v    &lt;span class=&quot;code-comment&quot;&gt;// Se u era filho esquerdo, substitui pelo v&lt;/span&gt;
5  else 
6      u.p.right = v   &lt;span class=&quot;code-comment&quot;&gt;// Se u era filho direito, substitui pelo v&lt;/span&gt;
7  if v != NIL
8      v.p = u.p       &lt;span class=&quot;code-comment&quot;&gt;// Atualiza o ponteiro do pai de v para o pai de u&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;

      &lt;div class=&quot;code-container&quot;&gt;
        &lt;strong&gt;TREE-DELETE(T, z) (Slide 19)&lt;/strong&gt;
        &lt;pre&gt;&lt;code class=&quot;pseudocode&quot;&gt;1  if z.left == NIL
2      TRANSPLANT(T, z, z.right) &lt;span class=&quot;code-comment&quot;&gt;// Cenário A/B: só tem filho direito&lt;/span&gt;
3  else if z.right == NIL
4      TRANSPLANT(T, z, z.left)  &lt;span class=&quot;code-comment&quot;&gt;// Cenário B: só tem filho esquerdo&lt;/span&gt;
5  else
6      y = TREE-MINIMUM(z.right) &lt;span class=&quot;code-comment&quot;&gt;// Cenário C: Acha sucessor y no lado direito&lt;/span&gt;
7      if y.p != z               &lt;span class=&quot;code-comment&quot;&gt;// Se o sucessor não for filho direto de z&lt;/span&gt;
8          TRANSPLANT(T, y, y.right) &lt;span class=&quot;code-comment&quot;&gt;// y liberta-se da sua posição antiga&lt;/span&gt;
9          y.right = z.right     &lt;span class=&quot;code-comment&quot;&gt;// O filho direito de z passa para y&lt;/span&gt;
10         y.right.p = y         &lt;span class=&quot;code-comment&quot;&gt;// Atualiza progenitor&lt;/span&gt;
11     TRANSPLANT(T, z, y)       &lt;span class=&quot;code-comment&quot;&gt;// Coloca y no lugar de z&lt;/span&gt;
12     y.left = z.left           &lt;span class=&quot;code-comment&quot;&gt;// Transfere o filho esquerdo de z para y&lt;/span&gt;
13     y.left.p = y              &lt;span class=&quot;code-comment&quot;&gt;// Atualiza progenitor do filho esquerdo&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
// Maquetes de dados das animações
let curC = 0, curI = 0, curD = 0;
let modeC = &#x27;search&#x27;;

const treeC = {
  15: {x: 350, y: 40,  l: 6,  r: 18},
  6:  {x: 180, y: 100, l: 3,  r: 7},
  18: {x: 520, y: 100, l: null, r: 20},
  3:  {x: 100, y: 170, l: null, r: null},
  7:  {x: 260, y: 170, l: null, r: 13},
  20: {x: 600, y: 170, l: null, r: null},
  13: {x: 320, y: 220, l: null, r: null}
};

const stepsSearch = [
  { desc: &quot;&lt;b&gt;TREE-SEARCH(T, 13)&lt;/b&gt;: Iniciamos o ponteiro na raiz &lt;b&gt;x = 15&lt;/b&gt;. Como 13 &amp;lt; 15, o algoritmo decide ir para a &lt;b&gt;esquerda&lt;/b&gt;.&quot;, active: 15 },
  { desc: &quot;Ponteiro desceu: &lt;b&gt;x = 6&lt;/b&gt;. Comparamos se 13 == 6? Não. Como 13 &amp;gt; 6, a Regra de Ouro manda-nos ir para a &lt;b&gt;direita&lt;/b&gt;.&quot;, active: 6 },
  { desc: &quot;Ponteiro avançou: &lt;b&gt;x = 7&lt;/b&gt;. Comparamos se 13 == 7? Não. Como 13 &amp;gt; 7, continuamos para a &lt;b&gt;direita&lt;/b&gt;.&quot;, active: 7 },
  { desc: &quot;&lt;b&gt;x = 13&lt;/b&gt;. Encontrámos! O critério de paragem &lt;code&gt;x.key == k&lt;/code&gt; foi atingido. O nó é retornado.&quot;, active: 13, win: true }
];

const stepsMin = [
  { desc: &quot;&lt;b&gt;TREE-MINIMUM(x)&lt;/b&gt;: O algoritmo serve para achar o menor valor. A regra diz: &lt;i&gt;&#x27;Começa na raiz e caminha sempre para a esquerda (x = x.left) até não dar mais&#x27;&lt;/i&gt;. Iniciamos em 15.&quot;, active: 15 },
  { desc: &quot;Ainda há filho esquerdo, por isso o ponteiro avança: &lt;b&gt;x = 6&lt;/b&gt;.&quot;, active: 6 },
  { desc: &quot;Ainda há filho esquerdo, avançamos: &lt;b&gt;x = 3&lt;/b&gt;.&quot;, active: 3 },
  { desc: &quot;Estamos no &lt;b&gt;Nó 3&lt;/b&gt;. O seu atributo &lt;code&gt;x.left&lt;/code&gt; é igual a &lt;b&gt;NIL&lt;/b&gt;. Fim do ciclo! O menor elemento da árvore inteira é garantidamente o 3.&quot;, active: 3, win: true }
];

const stepsInsert = [
  { desc: &quot;&lt;b&gt;TREE-INSERT(T, z)&lt;/b&gt;: Queremos inserir o número &lt;b&gt;8&lt;/b&gt;. Criamos o nó z com chave 8 e começamos a procurar o sítio dele a partir da raiz (15).&quot;, active: 15, add: null },
  { desc: &quot;Como 8 &amp;lt; 15, descemos para a esquerda. O ponteiro passa para o nó 6.&quot;, active: 6, add: null },
  { desc: &quot;Como 8 &amp;gt; 6, mudamos de direção e descemos para a direita. O ponteiro passa para o nó 7.&quot;, active: 7, add: null },
  { desc: &quot;Como 8 &amp;gt; 7, tentamos ir para a direita. O filho direito do 7 é o 13. Ponteiro passa para 13.&quot;, active: 13, add: null },
  { desc: &quot;Como 8 &amp;lt; 13, o algoritmo tenta ir para a esquerda. Mas o 13 não tem filho esquerdo (&lt;b&gt;x.left == NIL&lt;/b&gt;)!&quot;, active: 13, add: null },
  { desc: &quot;Encontrámos a vaga! O algoritmo liga o ponteiro &lt;code&gt;right&lt;/code&gt; ou &lt;code&gt;left&lt;/code&gt; correspondente. O &lt;b&gt;Nó 8&lt;/b&gt; é oficialmente criado como filho esquerdo do 13.&quot;, active: 13, add: 8 }
];

const stepsDelete = [
  { desc: &quot;&lt;b&gt;TREE-DELETE(T, z)&lt;/b&gt;: Vamos simular o cenário mais complexo do exame: &lt;b&gt;Apagar o Nó 6&lt;/b&gt;. Nota que ele tem 2 filhos (o 3 e o 7). Não o podemos simplesmente eliminar.&quot;, target: 6, swap: 7 },
  { desc: &quot;O algoritmo vai procurar o &lt;b&gt;Sucessor&lt;/b&gt; de 6 (o número mais pequeno do seu lado direito). O sucessor é o &lt;b&gt;Nó 7&lt;/b&gt;.&quot;, target: 6, swap: 7 },
  { desc: &quot;O algoritmo faz um &lt;b&gt;TRANSPLANT&lt;/b&gt; do 7 para o lugar do 6. O Nó 7 passa a ser o novo pai do 3 e filho do 15.&quot;, target: 7, swap: null },
  { desc: &quot;Remoção concluída! A estrutura manteve-se intacta e a Regra de Ouro das BSTs continua a funcionar perfeitamente.&quot;, target: null, swap: null }
];

function switchTab(idx) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b, i) =&gt; b.classList.toggle(&#x27;active&#x27;, i === idx));
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach((c, i) =&gt; c.classList.toggle(&#x27;active&#x27;, i === idx));
  renderAll();
}

function setMode(m) { modeC = m; curC = 0; renderC(); }
function stepC(d) { 
  let list = modeC === &#x27;search&#x27; ? stepsSearch : stepsMin;
  curC = Math.max(0, Math.min(list.length - 1, curC + d)); 
  renderC(); 
}
function stepI(d) { curI = Math.max(0, Math.min(stepsInsert.length - 1, curI + d)); renderI(); }
function stepD(d) { curD = Math.max(0, Math.min(stepsDelete.length - 1, curD + d)); renderD(); }

function renderC() {
  const svg = document.getElementById(&#x27;svg-c&#x27;); svg.innerHTML = &#x27;&#x27;;
  let list = modeC === &#x27;search&#x27; ? stepsSearch : stepsMin;
  let s = list[curC];
  document.getElementById(&#x27;desc-c&#x27;).innerHTML = s.desc;
  
  for(let id in treeC) {
    let n = treeC[id];
    if(n.l) drawL(svg, n.x, n.y, treeC[n.l].x, treeC[n.l].y);
    if(n.r) drawL(svg, n.x, n.y, treeC[n.r].x, treeC[n.r].y);
  }
  for(let id in treeC) {
    let n = treeC[id];
    let fill = &#x27;var(--bg)&#x27;, stroke = &#x27;var(--text3)&#x27;, sw = &#x27;1.5&#x27;;
    if(s.active === parseInt(id)) {
      fill = s.win ? &#x27;var(--success-bg)&#x27; : &#x27;var(--warn-bg)&#x27;;
      stroke = s.win ? &#x27;var(--success-border)&#x27; : &#x27;var(--warn-border)&#x27;;
      sw = &#x27;3&#x27;;
    }
    drawN(svg, n.x, n.y, id, fill, stroke, sw);
  }
  document.getElementById(&#x27;btn-c-prev&#x27;).disabled = curC === 0;
  document.getElementById(&#x27;btn-c-next&#x27;).disabled = curC === list.length - 1;
}

function renderI() {
  const svg = document.getElementById(&#x27;svg-i&#x27;); svg.innerHTML = &#x27;&#x27;;
  let s = stepsInsert[curI];
  document.getElementById(&#x27;desc-i&#x27;).innerHTML = s.desc;
  
  for(let id in treeC) {
    let n = treeC[id];
    if(n.l) drawL(svg, n.x, n.y, treeC[n.l].x, treeC[n.l].y);
    if(n.r) drawL(svg, n.x, n.y, treeC[n.r].x, treeC[n.r].y);
  }
  if(s.add === 8) {
    drawL(svg, treeC[13].x, treeC[13].y, 280, 240);
  }

  for(let id in treeC) {
    let n = treeC[id];
    let fill = &#x27;var(--bg)&#x27;, stroke = &#x27;var(--text3)&#x27;, sw = &#x27;1.5&#x27;;
    if(s.active === parseInt(id)) { fill = &#x27;var(--info-bg)&#x27;; stroke = &#x27;var(--info-border)&#x27;; sw = &#x27;3&#x27;; }
    drawN(svg, n.x, n.y, id, fill, stroke, sw);
  }

  if(s.add === 8) {
    drawN(svg, 280, 240, &quot;8&quot;, &#x27;var(--success-bg)&#x27;, &#x27;var(--success-border)&#x27;, &#x27;3&#x27;);
  }
  document.getElementById(&#x27;btn-i-prev&#x27;).disabled = curI === 0;
  document.getElementById(&#x27;btn-i-next&#x27;).disabled = curI === stepsInsert.length - 1;
}

function renderD() {
  const svg = document.getElementById(&#x27;svg-d&#x27;); svg.innerHTML = &#x27;&#x27;;
  let s = stepsDelete[curD];
  document.getElementById(&#x27;desc-d&#x27;).innerHTML = s.desc;

  if (curD &lt; 2) {
    for(let id in treeC) {
      let n = treeC[id];
      if(n.l) drawL(svg, n.x, n.y, treeC[n.l].x, treeC[n.l].y);
      if(n.r) drawL(svg, n.x, n.y, treeC[n.r].x, treeC[n.r].y);
    }
    for(let id in treeC) {
      let n = treeC[id];
      let fill = &#x27;var(--bg)&#x27;, stroke = &#x27;var(--text3)&#x27;, sw = &#x27;1.5&#x27;;
      if(s.target === parseInt(id)) { fill = &#x27;var(--warn-bg)&#x27;; stroke = &#x27;var(--warn-border)&#x27;; sw = &#x27;3&#x27;; }
      if(s.swap === parseInt(id)) { fill = &#x27;var(--info-bg)&#x27;; stroke = &#x27;var(--info-border)&#x27;; sw = &#x27;3&#x27;; }
      drawN(svg, n.x, n.y, id, fill, stroke, sw);
    }
  } else {
    drawL(svg, 350, 40, 260, 100); 
    drawL(svg, 350, 40, 520, 100); 
    drawL(svg, 520, 100, 600, 170); 
    drawL(svg, 260, 100, 100, 170); 
    drawL(svg, 260, 100, 320, 170); 
    
    drawN(svg, 350, 40, &quot;15&quot;, &#x27;var(--bg)&#x27;, &#x27;var(--text3)&#x27;, &#x27;1.5&#x27;);
    drawN(svg, 520, 100, &quot;18&quot;, &#x27;var(--bg)&#x27;, &#x27;var(--text3)&#x27;, &#x27;1.5&#x27;);
    drawN(svg, 100, 170, &quot;3&quot;, &#x27;var(--bg)&#x27;, &#x27;var(--text3)&#x27;, &#x27;1.5&#x27;);
    drawN(svg, 600, 170, &quot;20&quot;, &#x27;var(--bg)&#x27;, &#x27;var(--text3)&#x27;, &#x27;1.5&#x27;);
    drawN(svg, 320, 170, &quot;13&quot;, &#x27;var(--bg)&#x27;, &#x27;var(--text3)&#x27;, &#x27;1.5&#x27;);
    drawN(svg, 260, 100, &quot;7&quot;, &#x27;var(--success-bg)&#x27;, &#x27;var(--success-border)&#x27;, &#x27;3&#x27;);
  }
  document.getElementById(&#x27;btn-d-prev&#x27;).disabled = curD === 0;
  document.getElementById(&#x27;btn-d-next&#x27;).disabled = curD === stepsDelete.length - 1;
}

function drawN(svg, x, y, txt, f, s, sw) {
  const c = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;circle&#x27;);
  c.setAttribute(&#x27;cx&#x27;, x); c.setAttribute(&#x27;cy&#x27;, y); c.setAttribute(&#x27;r&#x27;, 18);
  c.setAttribute(&#x27;fill&#x27;, f); c.setAttribute(&#x27;stroke&#x27;, s); c.setAttribute(&#x27;stroke-width&#x27;, sw);
  svg.appendChild(c);
  const t = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
  t.setAttribute(&#x27;x&#x27;, x); t.setAttribute(&#x27;y&#x27;, y + 5);
  t.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;); t.setAttribute(&#x27;font-size&#x27;, &#x27;12&#x27;); t.setAttribute(&#x27;font-weight&#x27;, &#x27;bold&#x27;);
  t.setAttribute(&#x27;fill&#x27;, &#x27;var(--text)&#x27;); t.textContent = txt;
  svg.appendChild(t);
}

function drawL(svg, x1, y1, x2, y2) {
  const l = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;line&#x27;);
  l.setAttribute(&#x27;x1&#x27;, x1); l.setAttribute(&#x27;y1&#x27;, y1); l.setAttribute(&#x27;x2&#x27;, x2); l.setAttribute(&#x27;y2&#x27;, y2);
  l.setAttribute(&#x27;stroke&#x27;, &#x27;var(--text3)&#x27;); l.setAttribute(&#x27;stroke-width&#x27;, &#x27;1.5&#x27;);
  svg.appendChild(l);
}

function renderAll() { renderC(); renderI(); renderD(); }
renderAll();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Sebenta Completa: Aula 8 — Árvores Red-Black&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Pesquisa Binária Balanceada, Propriedades Estritas, Rotações e Casos de Ajuste · IPBeja&lt;/p&gt;

  &lt;div class=&quot;nav-tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab(0)&quot;&gt;1. Teoria &amp; Propriedades&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(1)&quot;&gt;2. Rotações Mecânicas&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(2)&quot;&gt;3. Inserção &amp; Os 3 Casos&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(3)&quot;&gt;4. Remoção (Fixup)&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(4)&quot;&gt;5. Simulador de Árvore Real&lt;/button&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab0&quot; class=&quot;tab-content active&quot;&gt;
    &lt;h2&gt;Porquê Árvores Red-Black? (Slide 2)&lt;/h2&gt;
    &lt;p&gt;As operações básicas numa Árvore de Pesquisa Binária normal demoram &lt;code&gt;O(h)&lt;/code&gt;, onde &lt;code&gt;h&lt;/code&gt; é a altura. Se os dados forem inseridos ordenados, a árvore degenera numa lista ligada gigante com &lt;code&gt;h = n&lt;/code&gt;, estragando a eficiência. As árvores **Red-Black** resolvem isto forçando um balanceamento através de atribuição de cores, garantindo tempo &lt;strong&gt;O(log n)&lt;/strong&gt; no pior cenário possível.&lt;/p&gt;
    
    &lt;h2&gt;As 5 Propriedades Invioláveis (Slide 4)&lt;/h2&gt;
    &lt;p&gt;Uma árvore de pesquisa binária é uma Árvore Red-Black se satisfizer as seguintes propriedades:&lt;/p&gt;
    &lt;div class=&quot;danger-badge&quot;&gt;
      &lt;strong&gt;1.&lt;/strong&gt; Cada nó é obrigatoriamente ou &lt;code&gt;RED&lt;/code&gt; (Vermelho) ou &lt;code&gt;BLACK&lt;/code&gt; (Preto).&lt;br&gt;
      &lt;strong&gt;2.&lt;/strong&gt; A Raiz da árvore é sempre &lt;code&gt;BLACK&lt;/code&gt;.&lt;br&gt;
      &lt;strong&gt;3.&lt;/strong&gt; Todas as folhas vazias (&lt;code&gt;NIL&lt;/code&gt;) são sempre &lt;code&gt;BLACK&lt;/code&gt;.&lt;br&gt;
      &lt;strong&gt;4.&lt;/strong&gt; Se um nó é &lt;code&gt;RED&lt;/code&gt;, os seus dois nós filhos têm de ser obrigatoriamente &lt;code&gt;BLACK&lt;/code&gt; (Não pode haver dois vermelhos consecutivos verticalmente).&lt;br&gt;
      &lt;strong&gt;5.&lt;/strong&gt; Para cada nó, todos os caminhos simples desse nó até às folhas descendentas contêm exatamente o mesmo número de nós &lt;code&gt;BLACK&lt;/code&gt; (Altura Negra - &lt;i&gt;black-height&lt;/i&gt;).
    &lt;/div&gt;
    &lt;p&gt;O Slide 5 demonstra matematicamente que uma árvore red-black com &lt;code&gt;n&lt;/code&gt; nós internos tem uma altura máxima de &lt;code&gt;h &amp;lt;= 2 log(n + 1)&lt;/code&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab1&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Rotações na Árvore (Slide 6 e 7)&lt;/h2&gt;
    &lt;p&gt;As operações de modificação (Inserção/Remoção) alteram a árvore e quebram as propriedades Red-Black. Para repor a ordem sem violar as regras de pesquisa binária (elementos à esquerda menores, à direita maiores), usamos as **Rotações Locais** que alteram os ponteiros de forma instantânea em tempo &lt;code&gt;O(1)&lt;/code&gt;.&lt;/p&gt;
    
    &lt;h3&gt;Pseudocódigo Comentado: LEFT-ROTATE(T, x) (Slide 7)&lt;/h3&gt;
    &lt;pre&gt;
LEFT-ROTATE(T, x)
1  y = x.right            // Define y como o filho direito de x (y vai subir para a posição de x)
2  x.right = y.left       // O filho esquerdo de y passa a ser o novo filho direito de x
3  if y.left != T.nil     // Se a subárvore esquerda de y não for uma folha vazia (sentinela)...
4      y.left.p = x       // ...atualiza o ponteiro do pai dessa subárvore para apontar para x
5  y.p = x.p              // O pai de y passa a ser o antigo pai de x (y assume o lugar na estrutura superior)
6  if x.p == T.nil        // Se x era a raiz original da árvore...
7      T.root = y         // ...então y passa a ser a nova raiz oficial da árvore T
8  else if x == x.p.left  // Caso contrário, se x era o filho esquerdo do pai...
9      x.p.left = y       // ...y passa a ser o filho esquerdo desse pai
10 else x.p.right = y     // Se x era o filho direito, y passa a ser o filho direito desse pai
11 y.left = x             // x desce na árvore e fica posicionado à esquerda de y
12 x.p = y                // Atualiza o pai de x, indicando que agora o seu novo pai é y
    &lt;/pre&gt;
    &lt;p&gt;A rotação &lt;code&gt;RIGHT-ROTATE(T, y)&lt;/code&gt; funciona exatamente de forma simétrica à anterior (Slide 6), invertendo as referências de esquerda e direita.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab2&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Inserção Dinâmica: RB-INSERT(T, z) (Slide 10)&lt;/h2&gt;
    &lt;p&gt;Todos os nós entram na árvore usando a lógica padrão de inserção binária, mas com duas particularidades fundamentais: o nó inserido é pintado inicialmente como &lt;strong&gt;RED&lt;/strong&gt; e os seus filhos apontam para a folha sentinela universal &lt;code&gt;T.nil&lt;/code&gt;.&lt;/p&gt;
    
    &lt;h2&gt;O Algoritmo de Ajuste: RB-INSERT-FIXUP(T, z) (Slide 11-14)&lt;/h2&gt;
    &lt;p&gt;Se o pai do nó inserido também for &lt;code&gt;RED&lt;/code&gt;, quebrou-se a Propriedade 4. O algoritmo avalia a cor do &lt;strong&gt;tio&lt;/strong&gt; de &lt;code&gt;z&lt;/code&gt; para decidir o que fazer. Assumindo que o pai de &lt;code&gt;z&lt;/code&gt; é filho esquerdo do avô, temos 3 Casos:&lt;/p&gt;
    
    &lt;div class=&quot;interactive-box&quot;&gt;
      &lt;h3 style=&quot;color:var(--danger-border)&quot;&gt;Caso 1: O tio de z é RED (Slide 12)&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;Ação:&lt;/strong&gt; Apenas recolorização. O pai e o tio passam a &lt;code&gt;BLACK&lt;/code&gt;, e o avô passa a &lt;code&gt;RED&lt;/code&gt;. O ponteiro &lt;code&gt;z&lt;/code&gt; sobe para o avô (&lt;code&gt;z = z.p.p&lt;/code&gt;) para continuar a verificação nos níveis superiores.&lt;/p&gt;
      
      &lt;h3 style=&quot;color:var(--warn-border)&quot;&gt;Caso 2: O tio de z é BLACK e z é filho da direita (Ziguezague - Slide 13)&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;Ação:&lt;/strong&gt; Aplica-se uma &lt;code&gt;LEFT-ROTATE(T, z.p)&lt;/code&gt; no pai de z. Isto transforma o ziguezague numa linha reta estável, caindo imediatamente no Caso 3.&lt;/p&gt;
      
      &lt;h3 style=&quot;color:var(--info-border)&quot;&gt;Caso 3: O tio de z é BLACK e z é filho da esquerda (Linha Reta - Slide 14)&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;Ação:&lt;/strong&gt; O pai passa a &lt;code&gt;BLACK&lt;/code&gt;, o avô passa a &lt;code&gt;RED&lt;/code&gt; e aplica-se uma &lt;code&gt;RIGHT-ROTATE(T, z.p.p)&lt;/code&gt; no avô. A árvore fica perfeitamente balanceada aqui e o ciclo termina.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab3&quot; class=&quot;tab-content&quot;&gt;
    &lt;h2&gt;Remoção: RB-DELETE(T, z) (Slide 25)&lt;/h2&gt;
    &lt;p&gt;Remover nós numa árvore Red-Black exige o uso de uma rotina auxiliar chamada &lt;code&gt;RB-TRANSPLANT(T, u, v)&lt;/code&gt; para substituir sub-árvores. Se o nó fisicamente removido ou movido for &lt;strong&gt;BLACK&lt;/strong&gt;, removeu-se uma unidade preta de um caminho, violando a Propriedade 5. Para corrigir, ativa-se o procedimento reparador.&lt;/p&gt;
    
    &lt;h2&gt;Os 4 Casos do RB-DELETE-FIXUP(T, x) (Slide 26)&lt;/h2&gt;
    &lt;p&gt;O nó substituto &lt;code&gt;x&lt;/code&gt; ganha a propriedade conceitual de ser &quot;Preto Extra&quot; (Double-Black). O algoritmo analisa o seu **irmão** &lt;code&gt;w&lt;/code&gt; para descarregar este peso preto:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Caso 1:&lt;/strong&gt; O irmão &lt;code&gt;w&lt;/code&gt; é &lt;code&gt;RED&lt;/code&gt;. Troca-se a cor do pai com &lt;code&gt;w&lt;/code&gt;, faz-se uma rotação no pai e o irmão muda, caindo num dos casos seguintes.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Caso 2:&lt;/strong&gt; O irmão &lt;code&gt;w&lt;/code&gt; é &lt;code&gt;BLACK&lt;/code&gt; e ambos os seus filhos são &lt;code&gt;BLACK&lt;/code&gt;. Retira-se o peso preto de &lt;code&gt;w&lt;/code&gt; (passa a &lt;code&gt;RED&lt;/code&gt;) e o problema do preto extra sobe para o pai (&lt;code&gt;x = x.p&lt;/code&gt;).&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Caso 3:&lt;/strong&gt; O irmão &lt;code&gt;w&lt;/code&gt; é &lt;code&gt;BLACK&lt;/code&gt;, o filho esquerdo de &lt;code&gt;w&lt;/code&gt; é &lt;code&gt;RED&lt;/code&gt; e o direito é &lt;code&gt;BLACK&lt;/code&gt;. Faz-se rotação local em &lt;code&gt;w&lt;/code&gt; para transformá-lo no Caso 4.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Caso 4:&lt;/strong&gt; O irmão &lt;code&gt;w&lt;/code&gt; é &lt;code&gt;BLACK&lt;/code&gt; e o seu filho direito é &lt;code&gt;RED&lt;/code&gt;. Ajustam-se as cores finais, executa-se uma rotação no pai e o preto extra é absorvido com sucesso, terminando o algoritmo.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tab4&quot; class=&quot;tab-content&quot;&gt;

&lt;script&gt;
function switchTab(idx) {
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b, i) =&gt; b.classList.toggle(&#x27;active&#x27;, i === idx));
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach((c, i) =&gt; c.classList.toggle(&#x27;active&#x27;, i === idx));
  if (idx === 4) {
    setTimeout(renderSVG, 50);
  }
}

const RED = 0;
const BLACK = 1;

class RBNode {
  constructor(key) {
    this.key = key;
    this.color = RED;
    this.left = null;
    this.right = null;
    this.p = null;
  }
}

// Inicialização segura da folha sentinela T.nil universal do PDF
const NIL = new RBNode(null);
NIL.color = BLACK;
NIL.left = NIL;
NIL.right = NIL;
NIL.p = NIL;

class RedBlackTree {
  constructor() {
    this.root = NIL;
  }

  leftRotate(x) {
    let y = x.right;
    x.right = y.left;
    if (y.left !== NIL) {
      y.left.p = x;
    }
    y.p = x.p;
    if (x.p === NIL) {
      this.root = y;
    } else if (x === x.p.left) {
      x.p.left = y;
    } else {
      x.p.right = y;
    }
    y.left = x;
    x.p = y;
  }

  rightRotate(x) {
    let y = x.left;
    x.left = y.right;
    if (y.right !== NIL) {
      y.right.p = x;
    }
    y.p = x.p;
    if (x.p === NIL) {
      this.root = y;
    } else if (x === x.p.right) {
      x.p.right = y;
    } else {
      x.p.left = y;
    }
    y.right = x;
    x.p = y;
  }

  insert(key) {
    let z = new RBNode(key);
    z.left = NIL;
    z.right = NIL;
    
    let y = NIL;
    let x = this.root;
    
    while (x !== NIL) {
      y = x;
      if (z.key &lt; x.key) {
        x = x.left;
      } else if (z.key &gt; x.key) {
        x = x.right;
      } else {
        return false;
      }
    }
    
    z.p = y;
    if (y === NIL) {
      this.root = z;
    } else if (z.key &lt; y.key) {
      y.left = z;
    } else {
      y.right = z;
    }
    
    this.insertFixup(z);
    return true;
  }

  insertFixup(z) {
    while (z.p.color === RED) {
      if (z.p === z.p.p.left) {
        let y = z.p.p.right;
        if (y.color === RED) {
          z.p.color = BLACK;
          y.color = BLACK;
          z.p.p.color = RED;
          z = z.p.p;
        } else {
          if (z === z.p.right) {
            z = z.p;
            this.leftRotate(z);
          }
          z.p.color = BLACK;
          z.p.p.color = RED;
          this.rightRotate(z.p.p);
        }
      } else {
        let y = z.p.p.left;
        if (y.color === RED) {
          z.p.color = BLACK;
          y.color = BLACK;
          z.p.p.color = RED;
          z = z.p.p;
        } else {
          if (z === z.p.left) {
            z = z.p;
            this.rightRotate(z);
          }
          z.p.color = BLACK;
          z.p.p.color = RED;
          this.leftRotate(z.p.p);
        }
      }
    }
    this.root.color = BLACK;
  }
}

let tree = new RedBlackTree();
[15, 6, 18, 3, 7, 17, 20, 2, 4, 13, 9].forEach(k =&gt; tree.insert(k));

function triggerInsert() {
  const input = document.getElementById(&#x27;insert-val&#x27;);
  const val = parseInt(input.value);
  const log = document.getElementById(&#x27;sim-log&#x27;);
  if (isNaN(val)) return;
  
  let ok = tree.insert(val);
  if(ok) {
    log.innerHTML = `Inserido ${val}. Reajustes efetuados de acordo com os Casos do PDF.`;
  } else {
    log.innerHTML = `A chave ${val} já existe na árvore. Tenta outro número.`;
  }
  renderSVG();
  input.value = &#x27;&#x27;;
}

function triggerReset() {
  tree = new RedBlackTree();
  document.getElementById(&#x27;sim-log&#x27;).innerHTML = &quot;Árvore reinicializada (Vazia).&quot;;
  renderSVG();
}

function buildLayout(node, depth, leftBound, rightBound, elements, links) {
  if (node === NIL) return;
  
  let x = (leftBound + rightBound) / 2;
  let y = depth * 60 + 40;
  
  elements.push({ node: node, x: x, y: y });
  
  if (node.left !== NIL) {
    let nextX = (leftBound + x) / 2;
    let nextY = (depth + 1) * 60 + 40;
    links.push({ x1: x, y1: y, x2: nextX, y2: nextY });
    buildLayout(node.left, depth + 1, leftBound, x, elements, links);
  }
  if (node.right !== NIL) {
    let nextX = (x + rightBound) / 2;
    let nextY = (depth + 1) * 60 + 40;
    links.push({ x1: x, y1: y, x2: nextX, y2: nextY });
    buildLayout(node.right, depth + 1, x, rightBound, elements, links);
  }
}

function renderSVG() {
  const svg = document.getElementById(&#x27;tree-svg&#x27;);
  if (!svg) return;
  svg.innerHTML = &#x27;&#x27;;
  
  let elements = [];
  let links = [];
  
  let width = svg.getBoundingClientRect().width || 800;
  buildLayout(tree.root, 0, 20, width - 20, elements, links);
  
  links.forEach(l =&gt; {
    let line = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;line&quot;);
    line.setAttribute(&quot;class&quot;, &quot;link&quot;);
    line.setAttribute(&quot;x1&quot;, l.x1);
    line.setAttribute(&quot;y1&quot;, l.y1);
    line.setAttribute(&quot;x2&quot;, l.x2);
    line.setAttribute(&quot;y2&quot;, l.y2);
    svg.appendChild(line);
  });
  
  elements.forEach(e =&gt; {
    let g = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;g&quot;);
    g.setAttribute(&quot;class&quot;, &quot;node&quot;);
    
    let circle = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;circle&quot;);
    circle.setAttribute(&quot;cx&quot;, e.x);
    circle.setAttribute(&quot;cy&quot;, e.y);
    circle.setAttribute(&quot;r&quot;, &quot;18&quot;);
    
    if (e.node.color === RED) {
      circle.setAttribute(&quot;fill&quot;, &quot;#dc3545&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;#b71c1c&quot;);
    } else {
      circle.setAttribute(&quot;fill&quot;, &quot;#212529&quot;);
      circle.setAttribute(&quot;stroke&quot;, &quot;#000000&quot;);
    }
    
    let text = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;text&quot;);
    text.setAttribute(&quot;x&quot;, e.x);
    text.setAttribute(&quot;y&quot;, e.y);
    text.setAttribute(&quot;fill&quot;, &quot;#ffffff&quot;);
    text.textContent = e.node.key;
    
    g.appendChild(circle);
    g.appendChild(text);
    svg.appendChild(g);
  });
}

window.addEventListener(&#x27;resize&#x27;, renderSVG);
window.onload = () =&gt; { renderSVG(); };
